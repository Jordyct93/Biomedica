function routh(p0){
  let p=p0.slice(); while(p.length>1&&Math.abs(p[0])<1e-12) p.shift();
  const n=p.length-1, cols=Math.floor(n/2)+1, rows=[], notes=[];
  const r0=[],r1=[]; for(let j=0;j<cols;j++){ r0.push(p[2*j]??0); r1.push(p[2*j+1]??0); }
  rows.push(r0); if(n>=1) rows.push(r1);
  for(let i=2;i<=n;i++){
    let prev=rows[i-1]; const pp=rows[i-2];
    if(prev.every(x=>Math.abs(x)<1e-10)){ const ord=n-i+2; rows[i-1]=pp.map((x,j)=>x*(ord-2*j)); prev=rows[i-1]; notes.push(`La fila s<sup>${n-i+1}</sup> salió toda en cero: se reemplazó con la derivada del polinomio auxiliar de la fila anterior. Hay raíces simétricas respecto al origen (posible par sobre el eje jω).`); }
    if(Math.abs(prev[0])<1e-10){ prev[0]=1e-6; notes.push(`Apareció un cero en la primera columna (fila s<sup>${n-i+1}</sup>): se reemplazó por ε pequeño y positivo.`); }
    const row=[]; for(let j=0;j<cols;j++){ const a=pp[j+1]??0, b=prev[j+1]??0; row.push((prev[0]*a-pp[0]*b)/prev[0]); }
    rows.push(row);
  }
  const fc=rows.map(r=>r[0]); let ch=0,last=0; fc.forEach(x=>{ if(Math.abs(x)<1e-12) return; const s=Math.sign(x); if(last&&s!==last) ch++; last=s; });
  return {rows,n,changes:ch,notes,p};
}

    caso:'Volvemos al brazo de rehabilitación con ganancia K y encontramos la ganancia crítica y el periodo de oscilación. Esos dos números son justo los que pide la sintonía de Ziegler-Nichols de la unidad 4. También puedes escribir cualquier polinomio característico.',

    const R=routh(p); const rts=polyRoots(R.p); const nR=rts.filter(z=>z.re>1e-7).length, nJ=rts.filter(z=>Math.abs(z.re)<=1e-7).length;

    if(R.n>=1){ const ss=tf2ss([1],R.p); const x0=ss.B.slice(); const maxRe=Math.max(...rts.map(z=>z.re)); const minRe=Math.min(...rts.map(z=>Math.abs(z.re)).filter(x=>x>1e-6),50);
      const T=maxRe>1e-7?clamp(4/maxRe,1,20):clamp(7/minRe,1,40); const r=simTF([1],R.p,()=>0,T,3000,x0);
      P(root,'p2',{series:[{x:r.t,y:r.y,color:maxRe>1e-7?'s2':'s1',label:'y(t)'}],axes0:true,xlabel:'tiempo (s)'}); }
    $('#kpis',root).innerHTML=kpi('Cambios de signo',String(R.changes))+kpi('Polos en semiplano derecho',String(nR))+kpi('Polos sobre jω',String(nJ))+kpi('Veredicto',stable?pill('ok','estable'):marg?pill('warn','marginalmente estable'):pill('bad','inestable'));
    let h=`<div class="steps">${step('Polinomio característico',R.p.map((c,i)=>{const k=R.n-i; return `${i?(c<0?' − ':' + '):(c<0?'−':'')}${fmt(Math.abs(c),3)}${k>0?'<span class="m">s</span>'+(k>1?'<sup>'+k+'</sup>':''):''}`;}).join(''))}
      ${step('Raíces (para comprobar)',B(polesTxt(rts,3)||'—'))}`;
    if(v.mode==='arm'){ const Ku=v.a*v.b*(v.a+v.b), wu=Math.sqrt(v.a*v.b), Pu=2*PI/wu;
      h+=step('Fila s¹ de la tabla',`${fr('('+fmt(v.a+v.b,1)+')('+fmt(v.a*v.b,2)+') − <span class="m">K</span>',fmt(v.a+v.b,1))} > 0 → <span class="m">K</span> < ${B(fmt(Ku,2))}`)+
        step('Ganancia última y frecuencia',`<span class="m">K</span><sub>u</sub> = ${B(fmt(Ku,2))} &nbsp; ${fmt(v.a+v.b,1)}<span class="m">s</span>² + ${fmt(Ku,2)} = 0 → <span class="m">ω</span> = ${B(fmt(wu,3)+' rad/s')}`)+
        step('Periodo último',`<span class="m">P</span><sub>u</sub> = ${fr('2π',fmt(wu,3))} = ${B(fmt(Pu,3)+' s')}`)+
        step('Ziegler-Nichols (lazo cerrado)',`P: <span class="m">K</span><sub>p</sub> = ${B(fmt(0.5*Ku,2))} &nbsp; PI: ${B(fmt(0.45*Ku,2))}, <span class="m">T</span><sub>i</sub> = ${B(fmt(Pu/1.2,2)+' s')} &nbsp; PID: ${B(fmt(0.6*Ku,2))}, <span class="m">T</span><sub>i</sub> = ${B(fmt(Pu/2,2)+' s')}, <span class="m">T</span><sub>d</sub> = ${B(fmt(Pu/8,3)+' s')}`); }
    h+='</div>'+R.notes.map(n=>`<p class="note">${n}</p>`).join('');
    $('#calc',root).innerHTML=h;
  }

/* ---------- 4.1 ---------- */
function simPID(N,D,g,struct,Nf,r,T,steps){
  const ss=tf2ss(N,D); const dt=T/steps; let x=new Array(ss.n).fill(0), I=0, fe=0, fy=0;
  const t=[],y=[],u=[];
  for(let i=0;i<=steps;i++){ const yy=outp(ss,x,0), e=r-yy; const de=(e-fe)*Nf, dy=(yy-fy)*Nf;
    let uu; if(struct==='pid') uu=g.Kp*e+g.Ki*I+g.Kd*de; else if(struct==='pid2') uu=g.Kp*e+g.Ki*I-g.Kd*dy; else uu=-g.Kp*yy+g.Ki*I-g.Kd*dy;
    t.push(i*dt); y.push(yy); u.push(uu);
    I+=e*dt; fe+=dt*Nf*(e-fe); fy+=dt*Nf*(yy-fy); x=rk4(ss,x,uu,dt); if(!isFinite(x[0])) break; }
  return {t,y,u};
}

      eq(`MRA: <span class="m">ms</span>³ + (<span class="m">b</span>+<span class="m">K</span><sub>d</sub>)<span class="m">s</span>² + (<span class="m">k</span>+<span class="m">K</span><sub>p</sub>)<span class="m">s</span> + <span class="m">K</span><sub>i</sub> = 0`),

      ['Cambia a I-PD con las mismas ganancias. ¿Qué pasa con el pico de u(t) y por qué?','Desaparece el pico inicial porque la referencia ya no entra por P ni por D. El costo es una subida más lenta.']]
  });
  const ctl=makeControls($('#ctl',root),'m41',[

    {type:'buttons',id:'pre',label:'Ajustes rápidos',items:[['Solo P',a=>{ const m=a.v.pl==='mra'; a.set('Kp',m?1500:10); a.set('Ki',0); a.set('Kd',0);}],['PID sugerido',a=>{ const m=a.v.pl==='mra'; a.set('Kp',m?1500:10); a.set('Ki',m?5000:2); a.set('Kd',m?120:8);}],['Ziegler-Nichols',a=>{ if(a.v.pl!=='arm') a.set('pl','arm'); a.set('Kp',18); a.set('Ki',12.8); a.set('Kd',6.3);}]]},
    {id:'Kp',label:'K<sub>p</sub>',min:0,max:5000,step:10,value:1500,dec:1},

    {id:'Kd',label:'K<sub>d</sub>',min:0,max:400,step:1,value:120,dec:1},
    {id:'N',label:'Filtro de la derivada N',min:5,max:200,step:1,value:100,unit:'rad/s',dec:0}],upd);

    formulas: eq(`ẋ = <span class="m">A</span>x + <span class="m">B</span>u, &nbsp; <span class="m">y</span> = <span class="m">C</span>x + <span class="m">D</span>u`)+
      eq(`<span class="m">A</span> = ${mat([['0','1'],['−k/m','−b/m']])} &nbsp; <span class="m">B</span> = ${mat([['0'],['1/m']])}`)+
      eq(`det(<span class="m">sI</span> − <span class="m">A</span>) = 0 &nbsp; ⇒ &nbsp; valores propios`)+
      eq(`<span class="m">G</span>(<span class="m">s</span>) = <span class="m">C</span>(<span class="m">sI</span> − <span class="m">A</span>)<sup>−1</sup><span class="m">B</span> + <span class="m">D</span>`)+
      eq(`x(<span class="m">t</span>) = e<sup><span class="m">At</span></sup>x(0)`,'respuesta libre')+
      eq(`𝒞 = [<span class="m">B</span> &nbsp; <span class="m">AB</span>] &nbsp; 𝒪 = ${mat([['<span class="m">C</span>'],['<span class="m">CA</span>']])}`),
    plots:[{id:'p1',cap:'Plano de fase',sub:'x₁ posición vs x₂ velocidad',cls:'tall'},{id:'p2',cap:'Estados en el tiempo',cls:'short'}],
    practice:[
      ['Escribe A para m = 80 kg, b = 600 N·s/m, k = 8000 N/m.','A = [0 1; −100 −7,5]. Valores propios: s² + 7,5s + 100 = 0 → s = −3,75 ± j9,27.'],
      ['¿El MRA es siempre controlable con la fuerza como entrada?','Sí. det[B AB] = −1/m², que nunca es cero.'],
      ['Si b = 0, ¿qué forma tiene la trayectoria en el plano de fase?','Una elipse cerrada: la energía se conserva y la camilla oscila sin fin. Los valores propios quedan sobre el eje imaginario.']]
  });
  const ctl=makeControls($('#ctl',root),'m42',[
    {id:'m',label:'Masa m',min:20,max:150,step:1,value:80,unit:'kg',dec:0},
    {id:'b',label:'Amortiguamiento b',min:0,max:3000,step:10,value:600,unit:'N·s/m',dec:0},
    {id:'k',label:'Rigidez k',min:0,max:20000,step:100,value:8000,unit:'N/m',dec:0},
    {id:'x0',label:'Posición inicial x₁(0)',min:-10,max:10,step:0.5,value:5,unit:'cm',dec:1},
    {id:'v0',label:'Velocidad inicial x₂(0)',min:-80,max:80,step:1,value:0,unit:'cm/s',dec:0},
    {type:'seg',id:'out',label:'Sensor (salida y)',options:[['pos','Posición'],['vel','Velocidad']],value:'pos'}],upd);
  function upd(v){
    const a21=-v.k/v.m, a22=-v.b/v.m; const ss={n:2,A:[[0,1],[a21,a22]],B:[0,0],C:[1,0],D:0};
    const ev=polyRoots([1,v.b/v.m,v.k/v.m]); const sig=Math.max(...ev.map(z=>z.re)); const wmax=Math.max(...ev.map(z=>Math.abs(z.im)));
    let T; if(sig<-1e-6) T=clamp(7/Math.min(...ev.map(z=>Math.abs(z.re)).filter(x=>x>1e-9)),1,25); else T=wmax>0?clamp(3*2*PI/wmax,1,25):10;
    const run=(x0,N)=>{ let x=x0.slice(); const dt=T/N, t=[],a=[],b=[]; for(let i=0;i<=N;i++){ t.push(i*dt); a.push(x[0]); b.push(x[1]); x=rk4(ss,x,0,dt); } return {t,a,b}; };
    const main=run([v.x0,v.v0],2500);
    const others=[]; const R=Math.max(Math.abs(v.x0),2), Vr=Math.max(Math.abs(v.v0),R*Math.sqrt(Math.max(v.k/v.m,1)),5);
    for(let i=0;i<8;i++){ const th=2*PI*i/8+0.3; const o=run([R*Math.cos(th),Vr*Math.sin(th)],1200); others.push({x:o.a,y:o.b,color:'s6',width:1,dash:[2,3]}); }
    P(root,'p1',{series:[...others,{x:main.a,y:main.b,color:'s2',width:2.4,label:'trayectoria desde tus condiciones'}],points:[{x:v.x0,y:v.v0,shape:'dot',color:'s2',size:5,text:'x(0)'},{x:0,y:0,shape:'ring',color:'s3',size:4}],axes0:true,xlabel:'x₁ (cm)',ylabel:'x₂ (cm/s)'});
    P(root,'p2',{series:[{x:main.t,y:main.a,color:'s1',label:'x₁ posición (cm)'},{x:main.t,y:main.b,color:'s4',label:'x₂ velocidad (cm/s)',width:1.5}],axes0:true,xlabel:'tiempo (s)'});
    const Cm=v.out==='pos'?[1,0]:[0,1]; const CA=[Cm[0]*0+Cm[1]*a21, Cm[0]*1+Cm[1]*a22];
    const detO=Cm[0]*CA[1]-Cm[1]*CA[0], detC=-1/(v.m*v.m);
    const obs=Math.abs(detO)>1e-9;
    $('#kpis',root).innerHTML=kpi('Valores propios',polesTxt(ev,2))+kpi('Estabilidad',sig<-1e-6?pill('ok','asintóticamente estable'):sig<=1e-6?pill('warn','marginal'):pill('bad','inestable'))+kpi('Controlable',pill('ok','sí, rango 2'))+kpi('Observable',obs?pill('ok','sí, rango 2'):pill('bad','no, rango 1'));
    const f=x=>fmt(x,3);
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Matrices del sistema',`<span class="m">A</span> = ${mat([['0','1'],[f(a21),f(a22)]])} <span class="m">B</span> = ${mat([['0'],[sci(1/v.m,3)]])} <span class="m">C</span> = ${mat([[String(Cm[0]),String(Cm[1])]])}`)}
      ${step('2. Polinomio característico',`det(<span class="m">sI</span> − <span class="m">A</span>) = <span class="m">s</span>² + ${f(-a22)}<span class="m">s</span> + ${f(-a21)}`)}
      ${step('3. Valores propios',B(polesTxt(ev,3)))}
      ${step('4. Matriz de controlabilidad',`𝒞 = ${mat([['0',sci(1/v.m,3)],[sci(1/v.m,3),sci(a22/v.m,3)]])} det = ${B(sci(detC,3))}`)}
      ${step('5. Matriz de observabilidad',`𝒪 = ${mat([[String(Cm[0]),String(Cm[1])],[f(CA[0]),f(CA[1])]])} det = ${B(f(detO))}`)}
      ${step('6. Función de transferencia desde (A, B, C)',`<span class="m">G</span>(<span class="m">s</span>) = ${fr(v.out==='pos'?'1':'<span class="m">s</span>',fmt(v.m,0)+'<span class="m">s</span>² + '+fmt(v.b,0)+'<span class="m">s</span> + '+fmt(v.k,0))}`)}
    </div>${!obs?'<p class="note alert">Con k = 0 y midiendo solo velocidad, la posición no se puede reconstruir: cualquier desplazamiento constante produce la misma salida.</p>':''}`;
  }
  ctl.fire();
}};

MODS.m43={unit:4,code:'4.3',title:'Diseño de sistemas de control en el espacio de estados',nav:'Diseño en el espacio de estados',
init(root){
  root.innerHTML=layout({unit:4,code:'4.3',title:this.title,
    lead:'Con realimentación de estados u = N̄r − Kx se pueden poner los polos de lazo cerrado donde uno quiera, siempre que el sistema sea controlable. Si un estado no se mide, un observador lo estima.',
    caso:'Plataforma de rehabilitación (MRA) poco amortiguada que debe posicionarse 1 cm. Se fijan el amortiguamiento y el tiempo de establecimiento deseados y se calculan las ganancias. La velocidad no tiene sensor: se puede activar un observador de Luenberger que la estima a partir de la posición.',
    theory:`<p><b>Ubicación de polos.</b> Con <span class="m">u = −Kx</span> la dinámica queda <span class="m">ẋ = (A − BK)x</span>. Se iguala <span class="m">det(sI − A + BK)</span> con el polinomio deseado <span class="m">s² + 2ζω<sub>n</sub>s + ω<sub>n</sub>²</span> y se despejan <span class="m">k<sub>1</sub></span> y <span class="m">k<sub>2</sub></span>. Para el MRA el resultado es directo (ver fórmulas). Para órdenes mayores se usa la fórmula de Ackermann.</p>
    <p><b>Ganancia de prealimentación N̄.</b> Escala la referencia para que la posición final sea exactamente r.</p>
    <p><b>Observador.</b> Copia el modelo y lo corrige con el error de medición: <span class="m">x̂̇ = Ax̂ + Bu + L(y − Cx̂)</span>. Sus polos se ponen de 2 a 10 veces más rápidos que los del controlador, para que la estimación converja antes de que importe.</p>`,
    formulas: eq(`<span class="m">u</span> = <span class="m">N̄ r</span> − <span class="m">K</span>x, &nbsp; <span class="m">K</span> = [<span class="m">k</span><sub>1</sub> &nbsp; <span class="m">k</span><sub>2</sub>]`)+
      eq(`<span class="m">ω</span><sub>n</sub> = ${fr('4','<span class="m">ζ t</span><sub>s</sub>')}`,'criterio 2 %')+
      eq(`<span class="m">k</span><sub>1</sub> = <span class="m">mω</span><sub>n</sub>² − <span class="m">k</span> &nbsp;&nbsp; <span class="m">k</span><sub>2</sub> = 2<span class="m">ζω</span><sub>n</sub><span class="m">m</span> − <span class="m">b</span>`)+
      eq(`<span class="m">N̄</span> = <span class="m">k</span> + <span class="m">k</span><sub>1</sub> = <span class="m">mω</span><sub>n</sub>²`)+
      eq(`<span class="m">K</span> = [0 &nbsp; 1]𝒞<sup>−1</sup>φ(<span class="m">A</span>)`,'Ackermann')+
      eq(`<span class="m">l</span><sub>1</sub> = 2<span class="m">ζ</span><sub>o</sub><span class="m">ω</span><sub>o</sub> − ${fr('<span class="m">b</span>','<span class="m">m</span>')} &nbsp; <span class="m">l</span><sub>2</sub> = <span class="m">ω</span><sub>o</sub>² − ${fr('<span class="m">k</span>','<span class="m">m</span>')} − <span class="m">l</span><sub>1</sub>${fr('<span class="m">b</span>','<span class="m">m</span>')}`,'observador'),
    plots:[{id:'p1',cap:'Posición de la plataforma'},{id:'p2',cap:'Fuerza aplicada u(t)',cls:'short'},{id:'p3',cap:'Velocidad real y estimada',cls:'short'},{id:'p4',cap:'Polos en el plano s',cls:'short'}],plotsCls:'two',
    practice:[
      ['m = 80 kg, b = 200, k = 4000. Se pide ζ = 0,8 y ts = 1 s. Calcula K.','ωn = 4/(0,8·1) = 5 rad/s. k₁ = 80·25 − 4000 = −2000 N/m; k₂ = 2·0,8·5·80 − 200 = 440 N·s/m. Un k₁ negativo significa que el controlador “ablanda” el resorte.'],
      ['¿Por qué hace falta N̄?','Sin N̄ la posición final sería r·k/(k + k₁), distinta de r. N̄ = mωn² corrige esa ganancia estática.'],
      ['¿Qué pasa si los polos del observador son más lentos que los del controlador?','El controlador trabaja con una velocidad mal estimada durante más tiempo y la respuesta se deforma: más sobrepaso o más lenta que lo diseñado.']]
  });
  const ctl=makeControls($('#ctl',root),'m43',[
    {id:'m',label:'Masa m',min:20,max:150,step:1,value:80,unit:'kg',dec:0},
    {id:'b',label:'Amortiguamiento b',min:0,max:2000,step:10,value:200,unit:'N·s/m',dec:0},
    {id:'k',label:'Rigidez k',min:1000,max:20000,step:100,value:4000,unit:'N/m',dec:0},
    {id:'z',label:'ζ deseado',min:0.3,max:1.2,step:0.01,value:0.8,dec:2},
    {id:'ts',label:'Tiempo de establecimiento deseado',min:0.3,max:4,step:0.05,value:1,unit:'s',dec:2},
    {type:'check',id:'obs',label:'Usar observador (sin sensor de velocidad)',value:false},
    {id:'of',label:'Polos del observador: veces más rápidos',min:2,max:10,step:0.5,value:4,dec:1,showIf:v=>v.obs}],upd);
  function upd(v){
    const {m,b,k}=v, wn=4/(v.z*v.ts), k1=m*wn*wn-k, k2=2*v.z*wn*m-b, Nb=m*wn*wn;
    const wo=v.of*wn, zo=0.8, l1=2*zo*wo-b/m, l2=wo*wo-k/m-l1*b/m;
    const r=0.01, zol=b/(2*Math.sqrt(k*m)), wol=Math.sqrt(k/m);
    const T=clamp(Math.max(3*v.ts,Math.min(8/(Math.max(zol,0.02)*wol),12)),1.5,12), N=6000, dt=T/N;
    const A=[[0,1],[-k/m,-b/m]], Bv=[0,1/m];
    const f=(x,u)=>[x[1],(u-k*x[0]-b*x[1])/m];
    const rk=(x,u,fn)=>{ const a=fn(x,u), c=fn(x.map((s,i)=>s+dt/2*a[i]),u), d=fn(x.map((s,i)=>s+dt/2*c[i]),u), e=fn(x.map((s,i)=>s+dt*d[i]),u); return x.map((s,i)=>s+dt/6*(a[i]+2*c[i]+2*d[i]+e[i])); };
    let xo=[0,0], xc=[0,0], xh=[0.004,0]; const t=[],yo=[],yc=[],uc=[],vr=[],ve=[];
    for(let i=0;i<=N;i++){
      const xs=v.obs?xh:xc; const u=Nb*r-k1*xs[0]-k2*xs[1];
      t.push(i*dt); yo.push(xo[0]*100); yc.push(xc[0]*100); uc.push(u); vr.push(xc[1]*100); ve.push(xh[1]*100);
      const y=xc[0];
      const fo=(x,uu)=>[x[1]+l1*(y-x[0]),(uu-k*x[0]-b*x[1])/m+l2*(y-x[0])];
      xo=rk(xo,k*r,f); xh=rk(xh,u,fo); xc=rk(xc,u,f);
    }
    P(root,'p1',{series:[{x:t,y:yo,color:'s6',dash:[6,4],label:'lazo abierto (F = k·r)'},{x:t,y:yc,color:'s1',label:v.obs?'realimentación con observador':'realimentación de estados'}],hlines:[{y:1,color:'s3',label:'1 cm'}],bands:[{y0:0.98,y1:1.02}],vlines:[{x:v.ts,color:'s4',label:'ts deseado'}],xlabel:'tiempo (s)',ylabel:'x (cm)',yzero:true});
    P(root,'p2',{series:[{x:t,y:uc,color:'s4',label:'u (N)'}],xlabel:'tiempo (s)',axes0:true});
    show(root,'p3',v.obs);
    if(v.obs) P(root,'p3',{series:[{x:t,y:vr,color:'s1',label:'velocidad real'},{x:t,y:ve,color:'s2',dash:[5,3],label:'estimada'}],xlabel:'tiempo (s)',ylabel:'cm/s',axes0:true});
    const pol=polyRoots([1,b/m,k/m]), des=polyRoots([1,2*v.z*wn,wn*wn]), obsP=polyRoots([1,2*zo*wo,wo*wo]);
    const pts=[...pol.map(p=>({x:p.re,y:p.im,shape:'x',color:'s6',size:6})),...des.map(p=>({x:p.re,y:p.im,shape:'dot',color:'s1',size:5})),...(v.obs?obsP.map(p=>({x:p.re,y:p.im,shape:'dot',color:'s2',size:4})):[])];
    const Rm=Math.max(...[...pol,...des,...(v.obs?obsP:[])].map(cabs))*1.2;
    P(root,'p4',{series:[],points:pts,xlim:[-Rm,Rm*0.3],ylim:[-Rm*0.7,Rm*0.7],equal:true,axes0:true,under:rhpShade,legend:[{color:'s6',label:'lazo abierto'},{color:'s1',label:'deseados'},...(v.obs?[{color:'s2',label:'observador'}]:[])]});
    const si=stepInfo(t,yc,1);
    $('#kpis',root).innerHTML=kpi('Sobrepaso logrado',fmt(si.Mp,1)+' %')+kpi('Establecimiento logrado',fmt(si.ts,2)+' s')+kpi('Fuerza máxima',fmt(Math.max(...uc.map(Math.abs)),0)+' N')+kpi('ζ en lazo abierto',fmt(zol,3));
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Frecuencia natural deseada',`<span class="m">ω</span><sub>n</sub> = ${fr('4',fmt(v.z,2)+'·'+fmt(v.ts,2))} = ${B(fmt(wn,3)+' rad/s')}`)}
      ${step('2. Polinomio deseado',`<span class="m">s</span>² + ${fmt(2*v.z*wn,3)}<span class="m">s</span> + ${fmt(wn*wn,3)} → polos ${B(polesTxt(des,2))}`)}
      ${step('3. Polinomio con realimentación',`<span class="m">s</span>² + ${fr(fmt(b,0)+' + <span class="m">k</span><sub>2</sub>',fmt(m,0))}<span class="m">s</span> + ${fr(fmt(k,0)+' + <span class="m">k</span><sub>1</sub>',fmt(m,0))}`)}
      ${step('4. Ganancias',`<span class="m">k</span><sub>1</sub> = ${fmt(m,0)}·${fmt(wn*wn,2)} − ${fmt(k,0)} = ${B(fmt(k1,1)+' N/m')} &nbsp; <span class="m">k</span><sub>2</sub> = 2·${fmt(v.z,2)}·${fmt(wn,2)}·${fmt(m,0)} − ${fmt(b,0)} = ${B(fmt(k2,1)+' N·s/m')}`)}
      ${step('5. Prealimentación',`<span class="m">N̄</span> = ${fmt(m,0)}·${fmt(wn*wn,2)} = ${B(fmt(Nb,1)+' N/m')}`)}
      ${step('6. Ley de control',`<span class="m">u</span> = ${fmt(Nb,0)}·<span class="m">r</span> − ${fmt(k1,0)}·<span class="m">x</span><sub>1</sub> − ${fmt(k2,0)}·<span class="m">x</span><sub>2</sub>`)}
      ${v.obs?step('7. Ganancias del observador (ω<sub>o</sub> = '+fmt(wo,1)+' rad/s, ζ<sub>o</sub> = 0,8)',`<span class="m">l</span><sub>1</sub> = ${B(fmt(l1,2))} &nbsp; <span class="m">l</span><sub>2</sub> = ${B(fmt(l2,1))}`):''}
    </div><p class="note">El observador arranca con 4 mm de error en la posición estimada para que se vea cómo converge.</p>`;
  }
  ctl.fire();
}};

function formulario(root){
  const blk=(t,items)=>`<section class="formulas"><div class="ft">${t}</div>${items.join('')}</section>`;
  root.innerHTML=`<article class="mod"><header class="mh"><div class="eyebrow">Repaso</div><h1>Formulario de Control Electrónico</h1><p class="lead">Las ecuaciones de las cuatro unidades. Cada bloque enlaza con su simulador.</p></header><div class="fsheet">
  ${blk('Unidad 1 · Modelado y respuesta',[eq('<span class="m">e</span> = <span class="m">r</span> − <span class="m">y</span>'),eq(`<span class="m">G</span>(<span class="m">s</span>) = ${fr('<span class="m">K</span>','<span class="m">τs</span>+1')}`,'63,2 % en τ, 98 % en 4τ'),eq(`<span class="m">G</span>(<span class="m">s</span>) = ${fr('<span class="m">ω</span><sub>n</sub>²','<span class="m">s</span>²+2<span class="m">ζω</span><sub>n</sub><span class="m">s</span>+<span class="m">ω</span><sub>n</sub>²')}`),eq(`<span class="m">M</span><sub>p</sub> = e<sup>−ζπ/√(1−ζ²)</sup> &nbsp; <span class="m">t</span><sub>p</sub> = π/<span class="m">ω</span><sub>d</sub> &nbsp; <span class="m">t</span><sub>s</sub> ≈ 4/(ζ<span class="m">ω</span><sub>n</sub>)`),eq(`<span class="m">m</span>ẍ + <span class="m">b</span>ẋ + <span class="m">k</span>x = <span class="m">F</span> &nbsp; <span class="m">ω</span><sub>n</sub> = √(k/m) &nbsp; ζ = b/(2√(km))`),eq('m ↔ L, &nbsp; b ↔ R, &nbsp; k ↔ 1/C, &nbsp; F ↔ v','analogía fuerza–voltaje'),'<a href="#m11">Ir a la unidad 1 →</a>'])}
  ${blk('Unidad 2 · Fluidos, térmicos y error',[eq(`<span class="m">R</span><sub>h</sub> = 8<span class="m">μL</span>/(π<span class="m">r</span>⁴) &nbsp; <span class="m">C</span><sub>h</sub> = <span class="m">A</span>/(ρ<span class="m">g</span>)`),eq('<span class="m">τ</span> = <span class="m">R</span><sub>h</sub><span class="m">C</span><sub>h</sub> &nbsp; <span class="m">h</span><sub>∞</sub> = <span class="m">q</span><span class="m">R</span><sub>h</sub>/(ρ<span class="m">g</span>)'),eq('<span class="m">mc</span><sub>p</sub>Ṫ = <span class="m">Q</span> − <span class="m">hA</span>(<span class="m">T</span> − <span class="m">T</span><sub>amb</sub>) &nbsp; <span class="m">τ</span> = <span class="m">mc</span><sub>p</sub>/(<span class="m">hA</span>)'),eq(`<span class="m">e</span><sub>ss</sub> = lím <span class="m">s</span>·<span class="m">R</span>(<span class="m">s</span>)/(1+<span class="m">G</span><sub>la</sub>)`),eq('escalón: 1/(1+K<sub>pos</sub>) &nbsp; rampa: 1/K<sub>v</sub> &nbsp; parábola: 1/K<sub>a</sub>'),eq('<span class="m">G</span>(<span class="m">s</span>) = <span class="m">K</span>e<sup>−θs</sup>/(<span class="m">τs</span>+1)','proceso con retardo'),'<a href="#m21">Ir a la unidad 2 →</a>'])}
  ${blk('Unidad 3 · Lugar de las raíces, frecuencia y Routh',[eq('1 + <span class="m">K G</span>(<span class="m">s</span>) = 0'),eq('<span class="m">σ</span><sub>a</sub> = (Σp − Σz)/(n−m) &nbsp; θ<sub>a</sub> = (2q+1)180°/(n−m)'),eq('d<span class="m">K</span>/d<span class="m">s</span> = 0','ruptura'),eq('|<span class="m">G</span>|<sub>dB</sub> = 20 log|<span class="m">G</span>(jω)|'),eq('MF = 180° + ∠<span class="m">L</span>(jω<sub>gc</sub>) &nbsp; MG = 1/|<span class="m">L</span>(jω<sub>pc</sub>)|'),eq('<span class="m">b</span><sub>1</sub> = (a<sub>1</sub>a<sub>2</sub> − a<sub>0</sub>a<sub>3</sub>)/a<sub>1</sub>','Routh'),eq('cambios de signo = polos en el semiplano derecho'),'<a href="#m31">Ir a la unidad 3 →</a>'])}
  ${blk('Unidad 4 · PID y espacio de estados',[eq(`<span class="m">C</span>(<span class="m">s</span>) = <span class="m">K</span><sub>p</sub> + <span class="m">K</span><sub>i</sub>/<span class="m">s</span> + <span class="m">K</span><sub>d</sub><span class="m">s</span> = <span class="m">K</span><sub>p</sub>(1 + 1/(<span class="m">T</span><sub>i</sub><span class="m">s</span>) + <span class="m">T</span><sub>d</sub><span class="m">s</span>)`),eq('Z-N: K<sub>p</sub> = 0,6K<sub>u</sub>, T<sub>i</sub> = P<sub>u</sub>/2, T<sub>d</sub> = P<sub>u</sub>/8'),eq('ẋ = <span class="m">A</span>x + <span class="m">B</span>u, &nbsp; <span class="m">y</span> = <span class="m">C</span>x + <span class="m">D</span>u'),eq('<span class="m">G</span>(<span class="m">s</span>) = <span class="m">C</span>(<span class="m">sI</span>−<span class="m">A</span>)<sup>−1</sup><span class="m">B</span> + <span class="m">D</span>'),eq('𝒞 = [B AB] &nbsp; 𝒪 = [C; CA]','rango completo'),eq('<span class="m">u</span> = N̄r − <span class="m">K</span>x &nbsp; det(<span class="m">sI</span> − <span class="m">A</span> + <span class="m">BK</span>) = polinomio deseado'),eq('x̂̇ = <span class="m">A</span>x̂ + <span class="m">B</span>u + <span class="m">L</span>(<span class="m">y</span> − <span class="m">C</span>x̂)','observador'),'<a href="#m41">Ir a la unidad 4 →</a>'])}
  </div></article>`;
}

/* =============== navegación =============== */
const ORDER=['inicio',...UNITS.flatMap(u=>u.mods),'formulario'];
function buildNav(){
  $('#side').innerHTML=`<a class="home" href="#inicio" data-id="inicio">Inicio</a>`+UNITS.map(u=>`<h3><i>U${u.n}</i>${u.title}</h3>`+u.mods.map(id=>`<a class="it" href="#${id}" data-id="${id}"><span>${MODS[id].code}</span><span>${MODS[id].nav}</span></a>`).join('')).join('')+`<h3>Repaso</h3><a class="it" href="#formulario" data-id="formulario"><span>Σ</span><span>Formulario completo</span></a>`;
  const sel=$('#navsel'); sel.innerHTML=`<option value="inicio">Inicio</option>`+UNITS.map(u=>`<optgroup label="Unidad ${u.n}">${u.mods.map(id=>`<option value="${id}">${MODS[id].code} ${MODS[id].nav}</option>`).join('')}</optgroup>`).join('')+`<option value="formulario">Formulario completo</option>`;
  sel.onchange=()=>{ location.hash=sel.value; };
}
function route(){
  let id=(location.hash||'').slice(1); if(!ORDER.includes(id)) id='inicio';
  const main=$('#main'); main.innerHTML='';
  if(id==='inicio') home(main); else if(id==='formulario') formulario(main); else MODS[id].init(main);
  document.querySelectorAll('.side a').forEach(a=>{ if(a.dataset.id===id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#navsel').value=id; window.scrollTo(0,0);
  const t=id==='inicio'?'':id==='formulario'?'Formulario':MODS[id].code;
}
buildNav(); window.addEventListener('hashchange',route); route();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(redrawAll);
</script>
