<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.navhome{margin-left:auto;font-size:13px;text-decoration:none;color:var(--accent);white-space:nowrap}

<title>Laboratorio de Control Electrónico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: barra lateral con las 4 unidades del micro + área de trabajo tipo banco de laboratorio (teoría, simulador, cálculo). Colores de trazas inspirados en el monitor de signos vitales. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15202A; --muted:#566778; --line:#D3DCE4;
  --accent:#B0243E; --accent-ink:#FFFFFF; --accent-soft:#F6E2E6;
  --plot-bg:#FBFCFD; --grid:#E4EAF0; --axis:#8796A5; --band:rgba(33,135,90,.12); --shade:rgba(176,36,62,.08);
  --s1:#1170B5; --s2:#C8362B; --s3:#1F8656; --s4:#B07408; --s5:#6C45B3; --s6:#7A8896;
  --ok:#1E7D4F; --warn:#9A6200; --bad:#B0243E;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1016; --surface:#111920; --surface-2:#16212B; --ink:#E3EAF0; --muted:#92A3B3; --line:#24313D;
  --accent:#F06A82; --accent-ink:#1A0A0E; --accent-soft:#3A1720;
  --plot-bg:#091016; --grid:#1A2630; --axis:#5D6F80; --band:rgba(69,211,138,.13); --shade:rgba(240,106,130,.10);
  --s1:#4DB2F4; --s2:#FF6C5C; --s3:#46D28A; --s4:#F1B23C; --s5:#B28EFF; --s6:#8D9EAE;
  --ok:#46D28A; --warn:#F1B23C; --bad:#F06A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1016; --surface:#111920; --surface-2:#16212B; --ink:#E3EAF0; --muted:#92A3B3; --line:#24313D;
  --accent:#F06A82; --accent-ink:#1A0A0E; --accent-soft:#3A1720;
  --plot-bg:#091016; --grid:#1A2630; --axis:#5D6F80; --band:rgba(69,211,138,.13); --shade:rgba(240,106,130,.10);
  --s1:#4DB2F4; --s2:#FF6C5C; --s3:#46D28A; --s4:#F1B23C; --s5:#B28EFF; --s6:#8D9EAE;
  --ok:#46D28A; --warn:#F1B23C; --bad:#F06A82; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand b{font-family:var(--f-display);font-stretch:92%;font-weight:750;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trace{width:64px;height:22px;flex:none;color:var(--accent)}
.navsel{display:none;margin-left:auto;max-width:56vw;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font-size:13px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100% - 50px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px 40px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);height:calc(100vh - 49px);overflow:auto}
.side .home{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;margin-bottom:6px}
.side h3{font-family:var(--f-display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px;font-weight:650;line-height:1.35}
.side h3 i{font-style:normal;color:var(--accent);margin-right:4px}
.side a.it{display:flex;gap:8px;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.35}
.side a.it span:first-child{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;padding-top:1px}
.side a:hover{background:var(--surface-2)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.side a[aria-current="page"] span:first-child{color:var(--accent)}

main{min-width:0;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mod{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mh .eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.mh h1{font-family:var(--f-display);font-weight:780;font-stretch:90%;font-size:clamp(26px,3.4vw,38px);line-height:1.08;margin:4px 0 8px;letter-spacing:-.015em;text-wrap:balance}
.mh .lead{max-width:72ch;color:var(--muted);margin:0;font-size:16px}
h2{font-family:var(--f-display);font-weight:700;font-stretch:95%;font-size:19px;margin:0 0 10px;letter-spacing:-.005em}
h4{font-size:14px;margin:14px 0 4px}
.case{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px 8px 8px 4px;padding:12px 16px;max-width:900px}
.case b{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);flex:none;padding-top:2px}
.case p{margin:0}

.theory{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.theory .txt p{margin:0 0 10px;max-width:68ch}
.theory .txt ul{margin:0 0 10px;padding-left:20px}
.formulas{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.formulas .ft{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eq{font-family:var(--f-math);font-size:18px;line-height:1.7;overflow-x:auto;white-space:nowrap;padding:2px 0}
.eq small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);margin-left:10px;white-space:normal}
.eqd{font-size:12.5px;color:var(--muted);margin-top:-6px;font-family:var(--f-body)}
.m{font-family:var(--f-math);font-style:italic;font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:1.2px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
.sq{border-top:1.2px solid currentColor;padding:0 2px;margin-left:1px}
.mat{display:inline-flex;vertical-align:middle;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:5px;padding:1px 4px;margin:0 3px}
.mat .mb{display:table}.mat .mr{display:table-row}.mat .mr>span{display:table-cell;padding:1px 7px;text-align:center;font-variant-numeric:tabular-nums}

.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.lab .lt{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:-4px}
.lab .lt h2{margin:0}
.lab .lt span{font-size:12.5px;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}
.crow .clab{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px;align-items:baseline}
.crow .clab label{color:var(--ink)}
.crow output{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.crow output .u{color:var(--muted);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:7px 10px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.crow.num{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.crow.num input{width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font-family:var(--f-mono)}
.plots{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.plots.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.plot{margin:0;min-width:0}
.plot figcaption{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plot figcaption b{color:var(--ink);font-weight:600}
.plot canvas{display:block;width:100%;height:280px;border-radius:6px}
.plot.short canvas{height:210px}
.plot.tall canvas{height:320px}
.plots .kpis,.plots .tbl{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.pt{width:8px;height:8px;border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.kpi .k{font-size:11.5px;color:var(--muted);line-height:1.3}
.kpi .v{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;letter-spacing:.02em}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}

.calc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:10px 26px}
.step{padding:8px 0;border-bottom:1px dashed var(--line);min-width:0}
.step .sl{font-size:12.5px;color:var(--muted)}
.step .se{font-family:var(--f-math);font-size:17px;overflow-x:auto;white-space:nowrap;line-height:1.75}
.step .se b{font-family:var(--f-mono);font-weight:500;font-size:14.5px;color:var(--accent)}
.note{font-size:13.5px;color:var(--muted);margin:12px 0 0;max-width:80ch}
.note.alert{color:var(--bad)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.03em}
td.mono{font-family:var(--f-mono);font-size:13px}
.routh td{font-family:var(--f-mono);text-align:right}
.routh td:first-child{text-align:left;color:var(--muted)}
.routh td.fc{font-weight:600}
.routh td.neg{color:var(--bad)}

.practice details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.practice summary{cursor:pointer;font-weight:500}
.practice details p{margin:8px 0 2px;color:var(--muted)}

.diagram{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.diagram svg{display:block;min-width:640px;width:100%;height:auto}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:clamp(32px,4.6vw,54px);line-height:1;margin:6px 0 12px;letter-spacing:-.02em;text-wrap:balance}
.hero p{color:var(--muted);max-width:60ch;margin:0 0 8px;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:12px}
.meta b{color:var(--ink);font-weight:600}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.unit .un{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.unit h2{margin:4px 0 10px}
.unit a{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.unit a span:first-child{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;flex:none;padding-top:1px}
.unit a:hover span:last-child{color:var(--accent)}
.unit a small{display:block;color:var(--muted);font-size:12.5px}
.fsheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

@media (max-width:1020px){
  .theory{grid-template-columns:minmax(0,1fr)}
  .lab{grid-template-columns:minmax(0,1fr)}
  .ctl{position:static}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .navsel{display:block}
  .brand span{display:none}
  .units,.fsheet{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .plots.two{grid-template-columns:minmax(0,1fr)}
  .plot canvas{height:240px}
  .lab{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.expl{display:flex;flex-direction:column;gap:4px}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.ecard .en{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ecard .eq{font-size:17px;white-space:normal}
.ecard p{margin:2px 0 8px;font-size:13.5px;color:var(--muted)}
.vt{min-width:0;width:100%;font-size:13px}
.vt td{padding:4px 6px;vertical-align:top}
.vt td.sym{font-family:var(--f-math);font-style:italic;font-size:15px;white-space:nowrap;color:var(--ink);width:1%}
.vt td.un{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;width:1%}
</style>

</head>

<script>
"use strict";
/* =============== utilidades numéricas =============== */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const PI=Math.PI;
function fmt(x,d=2){
  if(x===undefined||x===null||Number.isNaN(x)) return '—';
  if(!isFinite(x)) return x>0?'∞':'−∞';
  const a=Math.abs(x);
  if(a!==0&&(a>=1e6||a<Math.pow(10,-d)/2)) return sci(x,2);
  return x.toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:d}).replace('-','−');
}
function sci(x,d=2){
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x))); const m=x/Math.pow(10,e);
  return `${m.toLocaleString('es-CO',{maximumFractionDigits:d}).replace('-','−')}×10<sup>${e}</sup>`;
}
function fsig(x,s=3){ if(!isFinite(x)||x===0) return fmt(x); const d=Math.max(0,s-1-Math.floor(Math.log10(Math.abs(x)))); return fmt(x,Math.min(d,6)); }
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sq=x=>`√<span class="sq">${x}</span>`;
const mat=rows=>`<span class="mat"><span class="mb">${rows.map(r=>`<span class="mr">${r.map(c=>`<span>${c}</span>`).join('')}</span>`).join('')}</span></span>`;
const B=x=>`<b>${x}</b>`;

const Cx=(re,im=0)=>({re,im});
const cadd=(a,b)=>Cx(a.re+b.re,a.im+b.im), csub=(a,b)=>Cx(a.re-b.re,a.im-b.im);
const cmul=(a,b)=>Cx(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);
const cdiv=(a,b)=>{const d=b.re*b.re+b.im*b.im; return Cx((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d);};
const cabs=a=>Math.hypot(a.re,a.im);
function cfmt(z,d=2){ if(Math.abs(z.im)<1e-9) return fmt(z.re,d); return `${fmt(z.re,d)} ${z.im>=0?'+':'−'} j${fmt(Math.abs(z.im),d)}`; }
function polesTxt(rs,d=2){ const out=[]; rs.forEach(z=>{ if(Math.abs(z.im)<1e-9) out.push(fmt(z.re,d)); else if(z.im>0) out.push(`${fmt(z.re,d)} ± j${fmt(z.im,d)}`); }); return out.join(' ; '); }

function polyval(p,s){ let r=Cx(0); for(const c of p) r=cadd(cmul(r,s),Cx(c)); return r; }
const polyvalR=(p,x)=>p.reduce((r,c)=>r*x+c,0);
function polymul(a,b){ const r=new Array(a.length+b.length-1).fill(0); a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y)); return r; }
function polyadd(a,b){ const n=Math.max(a.length,b.length); const r=new Array(n).fill(0); a.forEach((x,i)=>r[n-a.length+i]+=x); b.forEach((x,i)=>r[n-b.length+i]+=x); return r; }
const polyscale=(a,k)=>a.map(x=>x*k);
const polyder=p=>p.slice(0,-1).map((c,i)=>c*(p.length-1-i));
function polyRoots(p0){
  let p=p0.slice(); while(p.length>1&&Math.abs(p[0])<1e-14) p.shift();
  const roots=[]; while(p.length>1&&Math.abs(p[p.length-1])<1e-14){ p.pop(); roots.push(Cx(0)); }
  const n=p.length-1; if(n<1) return roots;
  const a=p.map(v=>v/p[0]);
  if(n===1){ roots.push(Cx(-a[1])); return roots; }

/* función de transferencia -> espacio de estados (forma canónica controlable) */
function tf2ss(num,den){
  den=den.slice(); while(Math.abs(den[0])<1e-15) den.shift();
  const n=den.length-1, a0=den[0]; const a=den.map(v=>v/a0);
  let b=num.map(v=>v/a0); while(b.length<n+1) b.unshift(0);
  const D=b[0]; const A=[]; for(let i=0;i<n;i++){ A.push(new Array(n).fill(0)); if(i<n-1) A[i][i+1]=1; }
  for(let j=0;j<n;j++) A[n-1][j]=-a[n-j];
  const Bv=new Array(n).fill(0); Bv[n-1]=1;
  const Cv=[]; for(let j=0;j<n;j++) Cv.push(b[n-j]-a[n-j]*D);
  return {A,B:Bv,C:Cv,D,n};
}
function deriv(ss,x,u){ const n=ss.n, dx=new Array(n); for(let i=0;i<n;i++){ let s=ss.B[i]*u; const r=ss.A[i]; for(let j=0;j<n;j++) s+=r[j]*x[j]; dx[i]=s; } return dx; }
function rk4(ss,x,u,dt){ const n=ss.n; const k1=deriv(ss,x,u);
  const x2=x.map((v,i)=>v+dt/2*k1[i]), k2=deriv(ss,x2,u);
  const x3=x.map((v,i)=>v+dt/2*k2[i]), k3=deriv(ss,x3,u);
  const x4=x.map((v,i)=>v+dt*k3[i]), k4=deriv(ss,x4,u);
  return x.map((v,i)=>v+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i])); }
const outp=(ss,x,u)=>ss.C.reduce((s,c,i)=>s+c*x[i],0)+ss.D*u;
function simTF(num,den,uf,T,N=2500,x0){
  const ss=tf2ss(num,den); const dt=T/N; let x=x0?x0.slice():new Array(ss.n).fill(0);
  const t=[],y=[];
  for(let i=0;i<=N;i++){ const ti=i*dt, u=uf(ti); t.push(ti); y.push(outp(ss,x,u)); if(ss.n) x=rk4(ss,x,uf(ti+dt/2),dt); }
  return {t,y};
}
function stepInfo(t,y,yf,y0=0){
  const n=y.length; if(yf===undefined) yf=y[n-1];
  const amp=yf-y0; let pk=-Infinity,tp=NaN;
  for(let i=0;i<n;i++){ const v=(y[i]-y0)*Math.sign(amp||1); if(v>pk){pk=v;tp=t[i];} }
  const Mp=Math.abs(amp)>1e-12&&pk>Math.abs(amp)?(pk-Math.abs(amp))/Math.abs(amp)*100:0;
  let t10=NaN,t90=NaN; for(let i=0;i<n;i++){ const v=(y[i]-y0)/(amp||1); if(isNaN(t10)&&v>=0.1) t10=t[i]; if(v>=0.9){t90=t[i];break;} }
  let ts=0; const tol=0.02*Math.abs(amp);
  for(let i=n-1;i>=0;i--){ if(Math.abs(y[i]-yf)>tol){ ts=i<n-1?t[i+1]:NaN; break; } }
  return {Mp,tp:Mp>0.05?tp:NaN,tr:t90-t10,ts};
}

function makeControls(host,pre,defs,onChange){
  const v={};
  const api={v,set(id,val){ const d=defs.find(x=>x.id===id); if(d&&d._set) d._set(val); },fire};
  defs.forEach(d=>{
    const row=document.createElement('div'); row.className='crow'; d._row=row; const id=`${pre}-${d.id}`;
    if(d.type==='seg'){
      v[d.id]=d.value;
      row.innerHTML=`<div class="clab"><span>${d.label}</span></div><div class="seg" role="radiogroup" aria-label="${d.label.replace(/<[^>]+>/g,'')}">${d.options.map(([val,txt])=>`<button type="button" role="radio" id="${id}-${val}" data-v="${val}" aria-checked="${val===d.value}">${txt}</button>`).join('')}</div>`;
      const bs=row.querySelectorAll('button'); bs.forEach(b=>b.onclick=()=>{ v[d.id]=b.dataset.v; bs.forEach(x=>x.setAttribute('aria-checked',String(x===b))); fire(); });
      d._set=val=>{ v[d.id]=val; bs.forEach(x=>x.setAttribute('aria-checked',String(x.dataset.v===val))); };
    } else if(d.type==='check'){
      v[d.id]=!!d.value; row.innerHTML=`<label class="chk"><input type="checkbox" id="${id}" ${d.value?'checked':''}> ${d.label}</label>`;
      const inp=row.querySelector('input'); inp.onchange=()=>{ v[d.id]=inp.checked; fire(); }; d._set=val=>{ v[d.id]=!!val; inp.checked=!!val; };
    } else if(d.type==='num'){
      v[d.id]=d.value; row.className='crow num'; row.innerHTML=`<label for="${id}">${d.label}</label><input type="number" id="${id}" value="${d.value}" step="${d.step||'any'}">`;
      const inp=row.querySelector('input'); inp.oninput=()=>{ const x=parseFloat(inp.value); v[d.id]=isFinite(x)?x:0; fire(); }; d._set=val=>{ v[d.id]=val; inp.value=val; };
    } else if(d.type==='buttons'){
      row.innerHTML=`<div class="clab"><span>${d.label}</span></div><div class="btns">${d.items.map((it,i)=>`<button type="button" class="btn" id="${id}-${i}" data-i="${i}">${it[0]}</button>`).join('')}</div>`;
      row.querySelectorAll('button').forEach(b=>b.onclick=()=>{ d.items[+b.dataset.i][1](api); fire(); });
    } else {
      const toPos=x=>d.log?Math.round(1000*Math.log(x/d.min)/Math.log(d.max/d.min)):x;
      const fromPos=p=>d.log?+fsigNum(d.min*Math.pow(d.max/d.min,p/1000)):+p;
      v[d.id]=d.value;
      row.innerHTML=`<div class="clab"><label for="${id}">${d.label}</label><output for="${id}"></output></div><input type="range" id="${id}" min="${d.log?0:d.min}" max="${d.log?1000:d.max}" step="${d.log?1:d.step}" value="${toPos(d.value)}">`;
      const inp=row.querySelector('input'), out=row.querySelector('output');
      const show=()=>{ out.innerHTML=(d.log?fsig(v[d.id],3):fmt(v[d.id],d.dec??2))+(d.unit?` <span class="u">${d.unit}</span>`:''); };
      inp.oninput=()=>{ v[d.id]=fromPos(inp.value); show(); fire(); };
      d._set=val=>{ v[d.id]=val; inp.value=toPos(val); show(); }; show();
    }
    host.appendChild(row);
  });
  function vis(){ defs.forEach(d=>{ if(d.showIf) d._row.hidden=!d.showIf(v); }); }
  function fire(){ vis(); onChange(v); }
  vis(); return api;
}

function explHTML(code){
  const a=EXPL['m'+String(code).replace('.','')]; if(!a) return '';
  return `<section class="expl"><h2>Qué significa cada fórmula</h2><div class="egrid">${a.map(e=>`<div class="ecard"><div class="en">${e.n}</div><div class="eq">${e.f}</div><p>${e.d}</p><table class="vt">${e.v.map(r=>`<tr><td class="sym">${r[0]}</td><td>${r[1]}</td><td class="un">${r[2]}</td></tr>`).join('')}</table></div>`).join('')}</div></section>`;
}

function layout(o){
  const plots=(o.plots||[]).map(p=>`<figure class="plot ${p.cls||''}" id="${p.id}-f"><figcaption><b>${p.cap}</b>${p.sub?`<span>${p.sub}</span>`:''}</figcaption><canvas id="${p.id}" role="img" aria-label="${p.cap}"></canvas><div class="legend"></div></figure>`).join('');
  const qs=(o.practice||[]).map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
  return `<article class="mod">
  <header class="mh"><div class="eyebrow">Unidad ${o.unit} · Subtemática ${o.code}</div><h1>${o.title}</h1><p class="lead">${o.lead}</p></header>
  <div class="case"><b>Caso</b><p>${o.caso}</p></div>
  <section class="theory"><div class="txt">${o.theory}</div><div class="formulas"><div class="ft">Fórmulas clave</div>${o.formulas}</div></section>
  ${explHTML(o.code)}${o.before||''}
  <section class="lab"><div class="lt"><h2>Simulador</h2><span>Mueve los parámetros y mira cómo cambia la respuesta.</span></div><div class="ctl" id="ctl"></div><div class="plots ${o.plotsCls||''}">${plots}<div id="kpis" class="kpis"></div></div></section>
  <section class="calc"><h2>Cálculo con tus valores</h2><div id="calc"></div></section>
  ${o.after||''}
  <section class="practice"><h2>Para practicar</h2>${qs}</section>
  </article>`;
}

MODS.m11={unit:1,code:'1.1',title:'Introducción a los sistemas de control',nav:'Introducción a los sistemas de control',
init(root){
  root.innerHTML=layout({unit:1,code:'1.1',title:this.title,
    lead:'Un sistema de control mide una variable, la compara con el valor deseado y corrige. La diferencia entre lazo abierto y lazo cerrado se nota cuando aparece una perturbación.',
    caso:'Incubadora neonatal. La temperatura del aire de la cúpula debe mantenerse en 36,5 °C. A los 20 minutos se abre una portezuela o baja la temperatura de la sala. Comparamos un calefactor con potencia fija (lazo abierto) contra uno que mide con un termistor y corrige (lazo cerrado).',
    theory:`<p>En <b>lazo abierto</b> el controlador entrega una acción calculada de antemano y nunca mira el resultado. Funciona mientras nada cambie. En <b>lazo cerrado</b> un sensor realimenta la salida, se calcula el error <span class="m">e = r − y</span> y el controlador actúa sobre ese error.</p>
    <p>Elementos que siempre vas a identificar: referencia o setpoint, comparador, controlador, actuador, planta (el proceso), sensor y perturbaciones. En equipos médicos la realimentación es además un requisito de seguridad: sin medir no hay alarma.</p>
    <ul><li>Con control <b>P</b> el error frente a una perturbación se reduce en un factor <span class="m">1 + K·K<sub>p</sub></span>, pero no desaparece.</li><li>Con control <b>PI</b> la acción integral acumula el error hasta anularlo.</li></ul>`,
    formulas: eq(`<span class="m">e</span>(<span class="m">t</span>) = <span class="m">r</span>(<span class="m">t</span>) − <span class="m">y</span>(<span class="m">t</span>)`,'error')+
      eq(`<span class="m">τ</span> ${fr('d<span class="m">T</span>','d<span class="m">t</span>')} = −(<span class="m">T</span> − <span class="m">T</span><sub>amb</sub>) + <span class="m">K·Q</span>`,'modelo de la cúpula')+
      eq(`<span class="m">G</span>(<span class="m">s</span>) = ${fr('<span class="m">K</span>','<span class="m">τs</span> + 1')}`,'planta de 1er orden')+
      eq(`<span class="m">e</span><sub>ss</sub> = ${fr('Δ<span class="m">T</span><sub>amb</sub>','1 + <span class="m">K·K</span><sub>p</sub>')}`,'error con control P')+
      eq(`<span class="m">τ</span><sub>lc</sub> = ${fr('<span class="m">τ</span>','1 + <span class="m">K·K</span><sub>p</sub>')}`,'el lazo cerrado es más rápido'),
    before:`<div class="diagram"><svg viewBox="0 0 900 190" fill="none" stroke="currentColor" font-family="IBM Plex Sans, sans-serif" font-size="13" role="img" aria-label="Diagrama de bloques de la incubadora en lazo cerrado">
      <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" stroke="none"/></marker></defs>
      <g style="color:var(--ink)">
      <text x="8" y="66" fill="currentColor" stroke="none">Referencia</text><text x="8" y="84" fill="currentColor" stroke="none" font-family="IBM Plex Mono, monospace" font-size="12">36,5 °C</text>
      <line x1="88" y1="72" x2="128" y2="72" marker-end="url(#ar)"/>
      <circle cx="142" cy="72" r="13"/><text x="124" y="64" fill="currentColor" stroke="none" font-size="11">+</text><text x="146" y="102" fill="currentColor" stroke="none" font-size="12">−</text>
      <line x1="155" y1="72" x2="200" y2="72" marker-end="url(#ar)"/><text x="160" y="64" fill="currentColor" stroke="none" font-size="12">e</text>
      <rect x="200" y="48" width="130" height="48" rx="6"/><text x="265" y="69" text-anchor="middle" fill="currentColor" stroke="none">Controlador</text><text x="265" y="86" text-anchor="middle" fill="currentColor" stroke="none" font-size="11.5" opacity=".7">P o PI</text>
      <line x1="330" y1="72" x2="380" y2="72" marker-end="url(#ar)"/><text x="340" y="64" fill="currentColor" stroke="none" font-size="12">Q (W)</text>
      <rect x="380" y="48" width="150" height="48" rx="6"/><text x="455" y="69" text-anchor="middle" fill="currentColor" stroke="none">Actuador</text><text x="455" y="86" text-anchor="middle" fill="currentColor" stroke="none" font-size="11.5" opacity=".7">resistencia calefactora</text>
      <line x1="530" y1="72" x2="590" y2="72" marker-end="url(#ar)"/>
      <rect x="590" y="48" width="150" height="48" rx="6" style="stroke:var(--accent)"/><text x="665" y="69" text-anchor="middle" fill="currentColor" stroke="none">Planta</text><text x="665" y="86" text-anchor="middle" fill="currentColor" stroke="none" font-size="11.5" opacity=".7">aire de la cúpula</text>
      <line x1="665" y1="14" x2="665" y2="46" marker-end="url(#ar)" stroke-dasharray="4 3"/><text x="675" y="24" fill="currentColor" stroke="none" font-size="11.5">Perturbación: puerta abierta, sala fría</text>
      <line x1="740" y1="72" x2="880" y2="72" marker-end="url(#ar)"/><text x="790" y="64" fill="currentColor" stroke="none">T (°C)</text>
      <line x1="820" y1="72" x2="820" y2="150"/><line x1="820" y1="150" x2="530" y2="150" marker-end="url(#ar)"/>
      <rect x="380" y="128" width="150" height="44" rx="6"/><text x="455" y="148" text-anchor="middle" fill="currentColor" stroke="none">Sensor</text><text x="455" y="164" text-anchor="middle" fill="currentColor" stroke="none" font-size="11.5" opacity=".7">termistor NTC</text>
      <line x1="380" y1="150" x2="142" y2="150"/><line x1="142" y1="150" x2="142" y2="87" marker-end="url(#ar)"/>
      </g></svg></div>`,
    plots:[{id:'p1',cap:'Temperatura de la cúpula',sub:'perturbación a los 20 min'},{id:'p2',cap:'Potencia del calefactor',cls:'short'}],
    practice:[
      ['¿Por qué el lazo abierto no recupera los 36,5 °C después de la perturbación?','Porque la potencia está fija en 21 W. Nadie mide que la temperatura bajó, así que el sistema se estabiliza en un nuevo equilibrio: 36,5 °C menos la caída del ambiente.'],
      ['Con K = 0,5 °C/W y Kp = 6 W/°C, ¿qué error queda si el ambiente baja 4 °C?','e = 4/(1 + 0,5·6) = 4/4 = 1 °C. La cúpula queda en 35,5 °C.'],
      ['¿Qué pasa con la potencia si se usa PI en lugar de P?','La integral sigue subiendo la potencia hasta que el error es cero. Al final Q = (36,5 − T<sub>amb</sub>)/K, que para una sala a 22 °C son 29 W.']]
  });
  const ctl=makeControls($('#ctl',root),'m11',[
    {type:'seg',id:'mode',label:'Controlador del lazo cerrado',options:[['P','P'],['PI','PI']],value:'P'},
    {id:'Kp',label:'Ganancia proporcional K<sub>p</sub>',min:0,max:20,step:0.5,value:6,unit:'W/°C',dec:1},
    {id:'Ki',label:'Ganancia integral K<sub>i</sub>',min:0,max:2,step:0.05,value:0.4,unit:'W/(°C·min)',dec:2,showIf:v=>v.mode==='PI'},
    {id:'dT',label:'Caída de temperatura ambiente',min:0,max:8,step:0.5,value:4,unit:'°C',dec:1},
    {id:'tau',label:'Constante de tiempo τ',min:5,max:40,step:1,value:15,unit:'min',dec:0}],upd);
  function upd(v){
    const K=0.5,Ta0=26,Tr=36.5,Q0=(Tr-Ta0)/K,Qmax=80,td=20,Tend=120,dt=0.05;
    const t=[],To=[],Tc=[],Qc=[],Qo=[]; let a=Tr,c=Tr,I=0;
    for(let i=0;i<=Tend/dt;i++){ const ti=i*dt, Ta=ti>=td?Ta0-v.dT:Ta0; const e=Tr-c;
      const Qraw=Q0+v.Kp*e+(v.mode==='PI'?v.Ki*I:0), Q=clamp(Qraw,0,Qmax);
      t.push(ti); To.push(a); Tc.push(c); Qc.push(Q); Qo.push(Q0);
      if(v.mode==='PI'&&(Q===Qraw||Math.sign(e)!==Math.sign(Qraw-Q))) I+=e*dt;
      a+=dt*(-(a-Ta)+K*Q0)/v.tau; c+=dt*(-(c-Ta)+K*Q)/v.tau; }
    P(root,'p1',{series:[{x:t,y:To,color:'s6',label:'Lazo abierto (Q fijo)',dash:[6,4]},{x:t,y:Tc,color:'s2',label:'Lazo cerrado ('+v.mode+')'}],hlines:[{y:Tr,color:'s3',label:'setpoint 36,5 °C'}],vlines:[{x:td,color:'s4',label:'perturbación'}],xlabel:'tiempo (min)',ylabel:'T (°C)'});
    P(root,'p2',{series:[{x:t,y:Qo,color:'s6',dash:[6,4],label:'Lazo abierto'},{x:t,y:Qc,color:'s1',label:'Lazo cerrado'}],xlabel:'tiempo (min)',ylabel:'Q (W)',yzero:true});
    const Ta1=Ta0-v.dT, ess=v.mode==='P'?v.dT/(1+K*v.Kp):0, Qf=v.mode==='P'?Q0+v.Kp*ess:(Tr-Ta1)/K, sat=Qf>Qmax;
    $('#kpis',root).innerHTML=kpi('T final lazo abierto',fmt(Tr-v.dT,2)+' °C')+kpi('T final lazo cerrado',fmt(Tc[Tc.length-1],2)+' °C')+kpi('Error final (cerrado)',fmt(Tr-Tc[Tc.length-1],2)+' °C')+kpi('Potencia final',fmt(Qc[Qc.length-1],1)+' W');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Potencia de equilibrio antes de la perturbación',`<span class="m">Q</span><sub>0</sub> = ${fr('<span class="m">T</span><sub>r</sub> − <span class="m">T</span><sub>amb</sub>','<span class="m">K</span>')} = ${fr('36,5 − 26','0,5')} = ${B(fmt(Q0,1)+' W')}`)}
      ${step('2. Lazo abierto: nuevo equilibrio con Q fijo',`<span class="m">T</span><sub>∞</sub> = ${fmt(Ta1,1)} + 0,5·${fmt(Q0,0)} = ${B(fmt(Tr-v.dT,2)+' °C')}`)}
      ${v.mode==='P'?step('3. Lazo cerrado P: error en estado estacionario',`<span class="m">e</span><sub>ss</sub> = ${fr(fmt(v.dT,1),'1 + 0,5·'+fmt(v.Kp,1))} = ${B(fmt(ess,3)+' °C')}`):step('3. Lazo cerrado PI: la integral anula el error',`<span class="m">e</span><sub>ss</sub> = ${B('0 °C')}`)}
      ${step('4. Potencia final del lazo cerrado',v.mode==='P'?`<span class="m">Q</span> = ${fmt(Q0,0)} + ${fmt(v.Kp,1)}·${fmt(ess,3)} = ${B(fmt(Qf,1)+' W')}`:`<span class="m">Q</span> = ${fr('36,5 − '+fmt(Ta1,1),'0,5')} = ${B(fmt(Qf,1)+' W')}`)}
      ${step('5. Constante de tiempo en lazo cerrado (P)',`<span class="m">τ</span><sub>lc</sub> = ${fr(fmt(v.tau,0),'1 + 0,5·'+fmt(v.Kp,1))} = ${B(fmt(v.tau/(1+K*v.Kp),2)+' min')}`)}
      ${step('6. Reducción del error frente al lazo abierto',`${fr('<span class="m">e</span><sub>abierto</sub>','<span class="m">e</span><sub>cerrado</sub>')} = 1 + <span class="m">K·K</span><sub>p</sub> = ${B(fmt(1+K*v.Kp,2))}`)}
    </div>${sat?'<p class="note alert">La potencia requerida supera los 80 W del calefactor. El actuador se satura y el error real será mayor que el calculado.</p>':''}`;
  }
  ctl.fire();
}};

MODS.m12={unit:1,code:'1.2',title:'Modelado matemático de sistemas de control',nav:'Modelado matemático: Laplace y función de transferencia',
init(root){
  root.innerHTML=layout({unit:1,code:'1.2',title:this.title,
    lead:'La transformada de Laplace convierte la ecuación diferencial en una función de transferencia G(s). Con ella se leen la ganancia, la rapidez y la forma de la respuesta sin resolver la ecuación cada vez.',
    caso:'Dos instrumentos clínicos. Un termómetro de contacto se comporta como un sistema de primer orden. El conjunto catéter, línea y transductor de una presión arterial invasiva es un sistema de segundo orden: la prueba de lavado rápido (fast flush) que hace enfermería es, en la práctica, su respuesta al escalón.',
    theory:`<p>Pasos del modelado: plantear la ecuación física, aplicar Laplace con condiciones iniciales nulas y despejar <span class="m">G(s) = Y(s)/U(s)</span>. Las raíces del denominador son los <b>polos</b> y deciden la forma de la respuesta.</p>
    <p><b>Primer orden.</b> Un solo polo en <span class="m">s = −1/τ</span>. A los τ segundos la salida alcanza el 63,2 % del cambio; a 4τ está dentro del 2 %.</p>
    <p><b>Segundo orden.</b> Dos polos que dependen de la frecuencia natural <span class="m">ω<sub>n</sub></span> y del factor de amortiguamiento <span class="m">ζ</span>. Si ζ &lt; 1 hay sobrepaso y oscilación. En la línea arterial, ζ bajo exagera la sistólica y ζ alto la aplana. Lo recomendable es ζ entre 0,6 y 0,7 con f<sub>n</sub> alta.</p>
    <div class="tbl"><table><tr><th>f(t)</th><th>F(s)</th></tr><tr><td class="mono">escalón u(t)</td><td class="mono">1/s</td></tr><tr><td class="mono">rampa t</td><td class="mono">1/s²</td></tr><tr><td class="mono">e^(−at)</td><td class="mono">1/(s+a)</td></tr><tr><td class="mono">sen(ωt)</td><td class="mono">ω/(s²+ω²)</td></tr><tr><td class="mono">dy/dt</td><td class="mono">sY(s) − y(0)</td></tr></table></div>`,
    formulas: eq(`<span class="m">G</span>(<span class="m">s</span>) = ${fr('<span class="m">K</span>','<span class="m">τs</span> + 1')}`,'1er orden')+
      eq(`<span class="m">y</span>(<span class="m">t</span>) = <span class="m">K</span>(1 − e<sup>−<span class="m">t/τ</span></sup>)`,'respuesta al escalón')+
      eq(`<span class="m">G</span>(<span class="m">s</span>) = ${fr('<span class="m">ω</span><sub>n</sub>²','<span class="m">s</span>² + 2<span class="m">ζω</span><sub>n</sub><span class="m">s</span> + <span class="m">ω</span><sub>n</sub>²')}`,'2º orden')+
      eq(`<span class="m">M</span><sub>p</sub> = e<sup>−<span class="m">ζπ</span>/√(1−<span class="m">ζ</span>²)</sup>`,'sobrepaso')+
      eq(`<span class="m">t</span><sub>p</sub> = ${fr('<span class="m">π</span>','<span class="m">ω</span><sub>d</sub>')} &nbsp; <span class="m">t</span><sub>s</sub> ≈ ${fr('4','<span class="m">ζω</span><sub>n</sub>')} &nbsp; <span class="m">ω</span><sub>d</sub> = <span class="m">ω</span><sub>n</sub>√(1−<span class="m">ζ</span>²)`)+
      eq(`<span class="m">ζ</span> = ${fr('−ln(<span class="m">AR</span>)',sq('<span class="m">π</span>² + ln²(<span class="m">AR</span>)'))}`,'desde la prueba de lavado'),
    plots:[{id:'p1',cap:'Respuesta al escalón'},{id:'p2',cap:'Polos en el plano s',cls:'short'}],
    practice:[
      ['Un termómetro con τ = 12 s pasa de 25 °C a medir a un paciente con 37 °C. ¿Cuánto marca a los 12 s?','25 + 12·(1 − e<sup>−1</sup>) = 25 + 12·0,632 = 32,6 °C. Hay que esperar unos 4τ = 48 s para estar dentro del 2 %.'],
      ['En la prueba de lavado se miden dos picos sucesivos de 24 y 8 mmHg. ¿Cuánto vale ζ?','AR = 8/24 = 0,333; ln(AR) = −1,099; ζ = 1,099/√(9,87 + 1,21) = 0,33. Sistema subamortiguado: sobrestima la sistólica.'],
      ['¿Qué le pasa al sobrepaso si se agregan burbujas de aire a la línea?','El aire aumenta la complianza, baja f<sub>n</sub> y en general aumenta el amortiguamiento. La onda se aplana y se subestima la sistólica.']]
  });
  const ctl=makeControls($('#ctl',root),'m12',[
    {type:'seg',id:'mode',label:'Sistema',options:[['1','1er orden: termómetro'],['2','2º orden: catéter']],value:'2'},
    {id:'tau',label:'Constante de tiempo τ',min:1,max:60,step:1,value:12,unit:'s',dec:0,showIf:v=>v.mode==='1'},
    {id:'fn',label:'Frecuencia natural f<sub>n</sub>',min:2,max:40,step:0.5,value:12,unit:'Hz',dec:1,showIf:v=>v.mode==='2'},
    {id:'z',label:'Amortiguamiento ζ',min:0.05,max:1.5,step:0.01,value:0.25,dec:2,showIf:v=>v.mode==='2'}],upd);
  function upd(v){
    if(v.mode==='1'){
      const T=6*v.tau,N=600,t=[],y=[]; for(let i=0;i<=N;i++){const ti=T*i/N; t.push(ti); y.push(25+12*(1-Math.exp(-ti/v.tau)));}
      P(root,'p1',{series:[{x:t,y,color:'s1',label:'Lectura del termómetro'}],hlines:[{y:37,color:'s3',label:'37 °C real'}],bands:[{y0:36.9,y1:37.1}],points:[{x:v.tau,y:25+12*0.632,shape:'dot',color:'s2',text:'63,2 % en t = τ'}],xlabel:'tiempo (s)',ylabel:'T (°C)'});
      P(root,'p2',{series:[],points:[{x:-1/v.tau,y:0,shape:'x',color:'s2',size:6,text:'s = −1/τ'}],xlim:[-Math.max(0.3,2/v.tau),0.1],ylim:[-1,1],axes0:true,xlabel:'Re(s)',ylabel:'Im(s)',under:rhpShade});
      const t01=v.tau*Math.log(12/0.1);
      $('#kpis',root).innerHTML=kpi('Lectura a t = τ',fmt(25+12*0.632,2)+' °C')+kpi('95 % (3τ)',fmt(3*v.tau,0)+' s')+kpi('2 % (4τ)',fmt(4*v.tau,0)+' s')+kpi('Error < 0,1 °C',fmt(t01,1)+' s');
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Ecuación del sensor',`<span class="m">τ</span>${fr('d<span class="m">T</span><sub>s</sub>','d<span class="m">t</span>')} + <span class="m">T</span><sub>s</sub> = <span class="m">T</span><sub>paciente</sub>`)}
        ${step('2. Laplace con condición inicial nula',`<span class="m">G</span>(<span class="m">s</span>) = ${fr('1',fmt(v.tau,0)+'<span class="m">s</span> + 1')} &nbsp; polo en ${B(fmt(-1/v.tau,4)+' s⁻¹')}`)}
        ${step('3. Respuesta a un salto de 12 °C',`<span class="m">T</span>(<span class="m">t</span>) = 25 + 12(1 − e<sup>−<span class="m">t</span>/${fmt(v.tau,0)}</sup>)`)}
        ${step('4. Tiempo para que el error sea menor a 0,1 °C',`<span class="m">t</span> = <span class="m">τ</span>·ln(${fr('12','0,1')}) = ${fmt(v.tau,0)}·4,787 = ${B(fmt(t01,1)+' s')}`)}
      </div>`;
      return;
    }
    const wn=2*PI*v.fn, z=v.z; const T=Math.min(Math.max(5/(z*wn),6/wn),3);
    const r=simTF([wn*wn],[1,2*z*wn,wn*wn],()=>1,T,2500); const tm=r.t.map(x=>x*1000);
    const si=stepInfo(r.t,r.y,1);
    const rts=polyRoots([1,2*z*wn,wn*wn]);
    P(root,'p1',{series:[{x:tm,y:r.y,color:'s2',label:'Salida del transductor (normalizada)'}],hlines:[{y:1,color:'s6'}],bands:[{y0:0.98,y1:1.02}],xlabel:'tiempo (ms)',ylabel:'y(t)'});
    const R=Math.max(...rts.map(cabs))*1.3;
    P(root,'p2',{series:[],points:rts.map(p=>({x:p.re,y:p.im,shape:'x',color:'s2',size:6})),xlim:[-R,R*0.25],ylim:[-R*0.75,R*0.75],axes0:true,equal:true,xlabel:'Re(s) (rad/s)',ylabel:'Im(s)',under:rhpShade});
    const wd=wn*Math.sqrt(Math.max(0,1-z*z)), Mp=z<1?Math.exp(-z*PI/Math.sqrt(1-z*z)):0, AR=z<1?Math.exp(-2*PI*z/Math.sqrt(1-z*z)):0;
    const cls=z<0.4?pill('bad','subamortiguado: sobreestima la sistólica'):z<=0.75?pill('ok','amortiguamiento óptimo'):z<1?pill('warn','algo sobreamortiguado'):pill('warn','sobreamortiguado: aplana la onda');
    $('#kpis',root).innerHTML=kpi('Sobrepaso medido',fmt(si.Mp,1)+' %')+kpi('Tiempo pico',isNaN(si.tp)?'—':fmt(si.tp*1000,1)+' ms')+kpi('Establecimiento 2 %',isNaN(si.ts)?'> '+fmt(T*1000,0)+' ms':fmt(si.ts*1000,1)+' ms')+kpi('Tiempo de subida',fmt(si.tr*1000,1)+' ms');
    $('#calc',root).innerHTML=`<p style="margin:0 0 8px">${cls}</p><div class="steps">
      ${step('1. Frecuencia natural en rad/s',`<span class="m">ω</span><sub>n</sub> = 2<span class="m">π</span>·${fmt(v.fn,1)} = ${B(fmt(wn,2)+' rad/s')}`)}
      ${step('2. Función de transferencia',`<span class="m">G</span>(<span class="m">s</span>) = ${fr(fmt(wn*wn,0),'<span class="m">s</span>² + '+fmt(2*z*wn,2)+'<span class="m">s</span> + '+fmt(wn*wn,0))}`)}
      ${step('3. Polos',`<span class="m">s</span> = −<span class="m">ζω</span><sub>n</sub> ± j<span class="m">ω</span><sub>d</sub> = ${B(polesTxt(rts,2))}`)}
      ${z<1?step('4. Sobrepaso teórico',`<span class="m">M</span><sub>p</sub> = e<sup>−${fmt(z,2)}π/√(1−${fmt(z*z,3)})</sup> = ${B(fmt(Mp*100,1)+' %')}`):step('4. Sobrepaso teórico',`ζ ≥ 1, no hay sobrepaso: ${B('0 %')}`)}
      ${z<1?step('5. Tiempo pico',`<span class="m">t</span><sub>p</sub> = ${fr('π',fmt(wd,2))} = ${B(fmt(PI/wd*1000,2)+' ms')}`):''}
      ${step('6. Tiempo de establecimiento (2 %)',`<span class="m">t</span><sub>s</sub> ≈ ${fr('4',fmt(z,2)+'·'+fmt(wn,1))} = ${B(fmt(4/(z*wn)*1000,1)+' ms')}`)}
      ${z<1?step('7. Relación entre picos sucesivos (prueba de lavado)',`<span class="m">AR</span> = e<sup>−2πζ/√(1−ζ²)</sup> = ${B(fmt(AR,3))}`):''}
    </div><p class="note">La fórmula de t<sub>s</sub> es una aproximación; el valor de la tarjeta sale de la simulación y puede diferir un poco.</p>`;
  }
  ctl.fire();
}};

MODS.m13={unit:1,code:'1.3',title:'Modelado de sistemas mecánicos y eléctricos',nav:'Sistemas mecánicos y eléctricos (MRA y RLC)',
init(root){
  root.innerHTML=layout({unit:1,code:'1.3',title:this.title,
    lead:'El sistema masa-resorte-amortiguador (MRA) y el circuito RLC en serie obedecen la misma ecuación. Lo que aprendas en uno sirve para el otro.',
    caso:'Camilla con suspensión dentro de una ambulancia. La masa es el paciente con la camilla, el resorte y el amortiguador son la suspensión. Se aplica un empuje (escalón) o una vibración de la vía (fuerza senoidal) y se observa el desplazamiento que siente el paciente.',
    theory:`<p>Por la segunda ley de Newton, la suma de fuerzas sobre la masa es <span class="m">m·ẍ</span>. El resorte se opone con <span class="m">k·x</span> y el amortiguador con <span class="m">b·ẋ</span>. Aplicando Laplace se obtiene una función de transferencia de segundo orden.</p>
    <p>En el circuito RLC en serie, la ley de voltajes de Kirchhoff da <span class="m">L·q̈ + R·q̇ + q/C = v</span>. Comparando término a término: masa ↔ inductancia, amortiguador ↔ resistencia, resorte ↔ inverso de la capacitancia, fuerza ↔ voltaje, desplazamiento ↔ carga.</p>
    <p>Si la vibración de la vía tiene una frecuencia cercana a la natural, la amplitud crece (resonancia). Por eso la suspensión de equipos de transporte se diseña con <span class="m">ζ</span> alto.</p>`,
    formulas: eq(`<span class="m">m</span>ẍ + <span class="m">b</span>ẋ + <span class="m">k</span>x = <span class="m">F</span>(<span class="m">t</span>)`)+
      eq(`<span class="m">G</span>(<span class="m">s</span>) = ${fr('<span class="m">X</span>(<span class="m">s</span>)','<span class="m">F</span>(<span class="m">s</span>)')} = ${fr('1','<span class="m">ms</span>² + <span class="m">bs</span> + <span class="m">k</span>')}`)+
      eq(`<span class="m">ω</span><sub>n</sub> = ${sq(fr('<span class="m">k</span>','<span class="m">m</span>'))} &nbsp;&nbsp; <span class="m">ζ</span> = ${fr('<span class="m">b</span>','2'+sq('<span class="m">km</span>'))} &nbsp;&nbsp; <span class="m">b</span><sub>c</sub> = 2${sq('<span class="m">km</span>')}`)+
      eq(`<span class="m">x</span><sub>ss</sub> = ${fr('<span class="m">F</span><sub>0</sub>','<span class="m">k</span>')}`,'escalón')+
      eq(`|<span class="m">X</span>| = ${fr('<span class="m">F</span><sub>0</sub>',sq('(<span class="m">k</span> − <span class="m">mω</span>²)² + (<span class="m">bω</span>)²'))}`,'senoidal')+
      eq(`<span class="m">L</span>q̈ + <span class="m">R</span>q̇ + ${fr('q','<span class="m">C</span>')} = <span class="m">v</span>(<span class="m">t</span>)`,'RLC análogo'),
    plots:[{id:'p1',cap:'Desplazamiento de la camilla'}],
    after:`<section class="calc"><h2>Analogía fuerza–voltaje con tus valores</h2><div class="tbl" id="rlc"></div></section>`,
    practice:[
      ['Con m = 80 kg, k = 8000 N/m y b = 600 N·s/m, ¿el sistema es sub o sobreamortiguado?','b<sub>c</sub> = 2√(8000·80) = 1600 N·s/m. ζ = 600/1600 = 0,375: subamortiguado, oscila antes de quedarse quieto.'],
      ['¿Cuánto debe valer b para que la camilla no tenga sobrepaso?','Al menos el amortiguamiento crítico, b = 1600 N·s/m con los datos anteriores.'],
      ['¿Qué componente del RLC equivale a un resorte de 8000 N/m?','Un capacitor de C = 1/k = 1,25×10⁻⁴ F (125 µF).']]
  });
  const ctl=makeControls($('#ctl',root),'m13',[
    {type:'seg',id:'inp',label:'Entrada',options:[['step','Escalón de fuerza'],['sin','Vibración senoidal']],value:'step'},
    {id:'m',label:'Masa m (paciente + camilla)',min:20,max:150,step:1,value:80,unit:'kg',dec:0},
    {id:'k',label:'Rigidez del resorte k',min:1000,max:30000,step:100,value:8000,unit:'N/m',dec:0},
    {id:'b',label:'Amortiguamiento b',min:0,max:4000,step:10,value:600,unit:'N·s/m',dec:0},
    {id:'F0',label:'Amplitud de la fuerza F<sub>0</sub>',min:50,max:1000,step:10,value:300,unit:'N',dec:0},
    {id:'f',label:'Frecuencia de la vibración',min:0.1,max:5,step:0.05,value:1.6,unit:'Hz',dec:2,showIf:v=>v.inp==='sin'}],upd);
  function upd(v){
    const wn=Math.sqrt(v.k/v.m), z=v.b/(2*Math.sqrt(v.k*v.m)), bc=2*Math.sqrt(v.k*v.m), w=2*PI*v.f;
    const zs=Math.max(z,0.02); let T=clamp(8/(zs*wn),2,15); if(v.inp==='sin') T=clamp(Math.max(8/v.f,6/(zs*wn)),4,25);
    const uf=v.inp==='step'?()=>v.F0:t=>v.F0*Math.sin(w*t);
    const r=simTF([1],[v.m,v.b,v.k],uf,T,4000); const ycm=r.y.map(x=>x*100);
    const xss=v.F0/v.k, amp=v.F0/Math.sqrt((v.k-v.m*w*w)**2+(v.b*w)**2), rr=w/wn, MF=1/Math.sqrt((1-rr*rr)**2+(2*z*rr)**2);
    P(root,'p1',{series:[{x:r.t,y:ycm,color:'s1',label:'x(t)'}],hlines:v.inp==='step'?[{y:xss*100,color:'s6',label:'x_ss = F0/k'}]:[{y:amp*100,color:'s4',label:'amplitud estacionaria'},{y:-amp*100,color:'s4'}],xlabel:'tiempo (s)',ylabel:'x (cm)',axes0:true});
    const si=v.inp==='step'?stepInfo(r.t,r.y,xss):null;
    const typ=z<1e-9?'sin amortiguamiento':z<1?'subamortiguado':Math.abs(z-1)<0.01?'críticamente amortiguado':'sobreamortiguado';
    $('#kpis',root).innerHTML=kpi('ω<sub>n</sub> / f<sub>n</sub>',fmt(wn,2)+' rad/s · '+fmt(wn/2/PI,2)+' Hz')+kpi('ζ',fmt(z,3)+' · '+typ)+(v.inp==='step'?kpi('Sobrepaso',fmt(si.Mp,1)+' %')+kpi('Establecimiento',isNaN(si.ts)?'> ventana':fmt(si.ts,2)+' s'):kpi('Relación ω/ω<sub>n</sub>',fmt(rr,2))+kpi('Factor de amplificación',fmt(MF,2)));
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Función de transferencia',`<span class="m">G</span>(<span class="m">s</span>) = ${fr('1',fmt(v.m,0)+'<span class="m">s</span>² + '+fmt(v.b,0)+'<span class="m">s</span> + '+fmt(v.k,0))}`)}
      ${step('2. Frecuencia natural',`<span class="m">ω</span><sub>n</sub> = √(${fmt(v.k,0)}/${fmt(v.m,0)}) = ${B(fmt(wn,3)+' rad/s')}`)}
      ${step('3. Amortiguamiento crítico',`<span class="m">b</span><sub>c</sub> = 2√(${fmt(v.k,0)}·${fmt(v.m,0)}) = ${B(fmt(bc,1)+' N·s/m')}`)}
      ${step('4. Factor de amortiguamiento',`<span class="m">ζ</span> = ${fr(fmt(v.b,0),fmt(bc,1))} = ${B(fmt(z,3))} → ${typ}`)}
      ${v.inp==='step'?step('5. Desplazamiento final',`<span class="m">x</span><sub>ss</sub> = ${fr(fmt(v.F0,0),fmt(v.k,0))} = ${B(fmt(xss*100,3)+' cm')}`):step('5. Amplitud estacionaria a '+fmt(v.f,2)+' Hz',`|<span class="m">X</span>| = ${fr(fmt(v.F0,0),'√(('+fmt(v.k,0)+' − '+fmt(v.m*w*w,0)+')² + ('+fmt(v.b*w,0)+')²)')} = ${B(fmt(amp*100,3)+' cm')}`)}
      ${v.inp==='sin'?step('6. Frente a la deflexión estática F0/k',`${fr('|X|','F<sub>0</sub>/k')} = ${B(fmt(MF,2))} ${MF>1.5?'(cerca de resonancia)':''}`):''}
    </div>`;
    $('#rlc',root).innerHTML=`<table><tr><th>Mecánico</th><th>Valor</th><th>Eléctrico análogo</th><th>Valor</th></tr>
      <tr><td>Masa m</td><td class="mono">${fmt(v.m,0)} kg</td><td>Inductancia L</td><td class="mono">${fmt(v.m,0)} H</td></tr>
      <tr><td>Amortiguador b</td><td class="mono">${fmt(v.b,0)} N·s/m</td><td>Resistencia R</td><td class="mono">${fmt(v.b,0)} Ω</td></tr>
      <tr><td>Resorte k</td><td class="mono">${fmt(v.k,0)} N/m</td><td>Capacitancia C = 1/k</td><td class="mono">${sci(1/v.k,3)} F</td></tr>
      <tr><td>Fuerza F</td><td class="mono">${fmt(v.F0,0)} N</td><td>Voltaje v</td><td class="mono">${fmt(v.F0,0)} V</td></tr>
      <tr><td>Desplazamiento x</td><td class="mono">m</td><td>Carga q</td><td class="mono">C</td></tr>
      <tr><td>Velocidad ẋ</td><td class="mono">m/s</td><td>Corriente i</td><td class="mono">A</td></tr></table>
      <p class="note">El circuito con estos valores tiene la misma ω<sub>n</sub> = 1/√(LC) = ${fmt(1/Math.sqrt(v.m/v.k),3)} rad/s y el mismo ζ = (R/2)√(C/L) = ${fmt(v.b/2*Math.sqrt(1/v.k/v.m),3)}. La curva de arriba sería la carga del capacitor.</p>`;
  }
  ctl.fire();
}};

MODS.m21={unit:2,code:'2.1',title:'Modelado de sistemas de fluidos y térmicos',nav:'Modelado de fluidos y sistemas térmicos',
init(root){
  root.innerHTML=layout({unit:2,code:'2.1',title:this.title,
    lead:'Un tanque que se llena por un tubo y una bolsa de sangre que se calienta tienen la misma estructura: una capacidad que almacena y una resistencia que deja escapar. Ambos son sistemas de primer orden.',
    caso:'Perfusión y transfusión. (a) Reservorio de suero que descarga por un catéter: la ley de Poiseuille da la resistencia hidráulica y explica la alarma de oclusión. (b) Calentador de sangre: una bolsa sale del refrigerador a 4 °C y debe llegar a 37 °C sin pasar de 42 °C, límite a partir del cual hay riesgo de hemólisis.',
    theory:`<p><b>Fluidos.</b> El balance de masa dice que lo que se acumula es lo que entra menos lo que sale: <span class="m">A·dh/dt = q<sub>in</sub> − q<sub>out</sub></span>. En flujo laminar el caudal que sale es la presión dividida por la resistencia hidráulica, y esa resistencia crece con la cuarta potencia del inverso del radio. Un catéter un 20 % más estrecho tiene una resistencia 2,4 veces mayor.</p>
    <p><b>Térmico.</b> El balance de energía dice que el calor acumulado es el que entra menos el que se pierde por convección (ley de enfriamiento de Newton). La capacidad térmica es <span class="m">m·c<sub>p</sub></span> y la resistencia térmica es <span class="m">1/(h·A)</span>.</p>
    <div class="tbl"><table><tr><th>Variable</th><th>Eléctrico</th><th>Hidráulico</th><th>Térmico</th></tr>
    <tr><td>Esfuerzo</td><td>voltaje V</td><td>presión P</td><td>temperatura T</td></tr>
    <tr><td>Flujo</td><td>corriente i</td><td>caudal q</td><td>calor Q</td></tr>
    <tr><td>Resistencia</td><td>R</td><td>R<sub>h</sub> = ΔP/q</td><td>R<sub>t</sub> = 1/(hA)</td></tr>
    <tr><td>Capacidad</td><td>C</td><td>C<sub>h</sub> = A/(ρg)</td><td>C<sub>t</sub> = m·c<sub>p</sub></td></tr>
    <tr><td>τ</td><td>RC</td><td>R<sub>h</sub>·C<sub>h</sub></td><td>R<sub>t</sub>·C<sub>t</sub></td></tr></table></div>`,
    formulas: eq(`<span class="m">R</span><sub>h</sub> = ${fr('8<span class="m">μL</span>','<span class="m">π r</span>⁴')}`,'Poiseuille')+
      eq(`<span class="m">A</span>${fr('d<span class="m">h</span>','d<span class="m">t</span>')} = <span class="m">q</span><sub>in</sub> − ${fr('<span class="m">ρ g h</span>','<span class="m">R</span><sub>h</sub>')}`)+
      eq(`<span class="m">τ</span> = ${fr('<span class="m">A R</span><sub>h</sub>','<span class="m">ρ g</span>')} &nbsp;&nbsp; <span class="m">h</span><sub>∞</sub> = ${fr('<span class="m">q</span><sub>in</sub><span class="m">R</span><sub>h</sub>','<span class="m">ρ g</span>')}`)+
      eq(`<span class="m">m c</span><sub>p</sub>${fr('d<span class="m">T</span>','d<span class="m">t</span>')} = <span class="m">Q</span> − <span class="m">hA</span>(<span class="m">T</span> − <span class="m">T</span><sub>amb</sub>)`)+
      eq(`<span class="m">τ</span> = ${fr('<span class="m">m c</span><sub>p</sub>','<span class="m">hA</span>')} &nbsp;&nbsp; <span class="m">T</span><sub>∞</sub> = <span class="m">T</span><sub>amb</sub> + ${fr('<span class="m">Q</span>','<span class="m">hA</span>')}`)+
      eq(`${fr('<span class="m">T</span>(<span class="m">s</span>)','<span class="m">Q</span>(<span class="m">s</span>)')} = ${fr('1/(<span class="m">hA</span>)','<span class="m">τs</span> + 1')}`),
    plots:[{id:'p1',cap:'Respuesta del sistema'}],
    practice:[
      ['Si el radio del catéter se reduce a la mitad, ¿cuánto cambia la resistencia hidráulica?','Aumenta 2⁴ = 16 veces. Con el mismo caudal de entrada, el nivel y la presión de la línea finales también serían 16 veces mayores.'],
      ['Una bolsa de 250 mL (m·c<sub>p</sub> ≈ 1046 J/°C) con hA = 0,8 W/°C. ¿Cuál es τ?','τ = 1046/0,8 ≈ 1308 s ≈ 21,8 min. El calentamiento es lento: llegar al 95 % toma unos 65 min.'],
      ['¿Qué potencia mantiene la bolsa a 37 °C en una sala a 22 °C con hA = 0,8 W/°C?','Q = hA·(37 − 22) = 0,8·15 = 12 W.']]
  });
  const ctl=makeControls($('#ctl',root),'m21',[
    {type:'seg',id:'mode',label:'Sistema',options:[['flu','Fluidos: suero'],['ter','Térmico: sangre']],value:'flu'},
    {id:'r',label:'Radio interno del catéter r',min:0.2,max:1,step:0.01,value:0.5,unit:'mm',dec:2,showIf:v=>v.mode==='flu'},
    {id:'L',label:'Longitud del catéter L',min:10,max:200,step:1,value:100,unit:'cm',dec:0,showIf:v=>v.mode==='flu'},
    {id:'mu',label:'Viscosidad μ',min:0.7,max:4,step:0.05,value:1,unit:'mPa·s',dec:2,showIf:v=>v.mode==='flu'},
    {id:'A',label:'Área del reservorio A',min:1,max:20,step:0.5,value:5,unit:'cm²',dec:1,showIf:v=>v.mode==='flu'},
    {id:'q',label:'Caudal de entrada q<sub>in</sub>',min:10,max:500,step:5,value:100,unit:'mL/h',dec:0,showIf:v=>v.mode==='flu'},
    {id:'occ',label:'Estrechamiento por oclusión (a mitad de la prueba)',min:0,max:50,step:1,value:20,unit:'%',dec:0,showIf:v=>v.mode==='flu'},
    {id:'vol',label:'Volumen de la bolsa',min:100,max:500,step:10,value:250,unit:'mL',dec:0,showIf:v=>v.mode==='ter'},
    {id:'hA',label:'Conductancia térmica hA',min:0.2,max:2,step:0.05,value:0.8,unit:'W/°C',dec:2,showIf:v=>v.mode==='ter'},
    {id:'Q0',label:'Potencia del calentador Q',min:0,max:40,step:0.5,value:12,unit:'W',dec:1,showIf:v=>v.mode==='ter'},
    {id:'Ta',label:'Temperatura ambiente',min:15,max:30,step:0.5,value:22,unit:'°C',dec:1,showIf:v=>v.mode==='ter'},
    {id:'T0',label:'Temperatura inicial de la bolsa',min:4,max:25,step:0.5,value:4,unit:'°C',dec:1,showIf:v=>v.mode==='ter'}],upd);
  function upd(v){
    if(v.mode==='flu'){
      const rho=1000,g=9.81, r=v.r/1000, L=v.L/100, mu=v.mu/1000, A=v.A/1e4, q=v.q/1e6/3600;
      const R0=8*mu*L/(PI*r**4), tau0=A*R0/(rho*g), h0=q*R0/(rho*g);
      const fac=1/Math.pow(1-v.occ/100,4), R1=R0*fac, tau1=tau0*fac, h1=h0*fac;
      const t1=5*tau0, Tend=t1+5*tau1, N=800, t=[],h=[],Pm=[]; const h_t1=h0*(1-Math.exp(-5));
      for(let i=0;i<=N;i++){ const ti=Tend*i/N; const hv=ti<t1?h0*(1-Math.exp(-ti/tau0)):h1+(h_t1-h1)*Math.exp(-(ti-t1)/tau1); t.push(ti/60); h.push(hv*100); Pm.push(rho*g*hv/133.32); }
      P(root,'p1',{series:[{x:t,y:h,color:'s1',label:'Nivel h (cm)'}],hlines:[{y:h0*100,color:'s6',label:'h∞ normal'},...(v.occ>0?[{y:h1*100,color:'s2',label:'h∞ con oclusión'}]:[])],vlines:v.occ>0?[{x:t1/60,color:'s4',label:'oclusión'}]:[],xlabel:'tiempo (min)',ylabel:'h (cm)',yzero:true});
      const P0=rho*g*h0/133.32, P1=rho*g*h1/133.32;
      $('#kpis',root).innerHTML=kpi('τ normal',fmt(tau0/60,1)+' min')+kpi('Presión de línea normal',fmt(P0,1)+' mmHg')+kpi('Presión con oclusión',fmt(P1,1)+' mmHg')+kpi('Aumento de R<sub>h</sub>','×'+fmt(fac,2));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Resistencia hidráulica (Poiseuille)',`<span class="m">R</span><sub>h</sub> = ${fr('8·'+sci(mu)+'·'+fmt(L,2),'π·('+sci(r)+')⁴')} = ${B(sci(R0,3)+' Pa·s/m³')}`)}
        ${step('2. Capacitancia hidráulica',`<span class="m">C</span><sub>h</sub> = ${fr('<span class="m">A</span>','ρg')} = ${fr(sci(A),'1000·9,81')} = ${B(sci(A/(rho*g),3)+' m³/Pa')}`)}
        ${step('3. Constante de tiempo',`<span class="m">τ</span> = <span class="m">R</span><sub>h</sub><span class="m">C</span><sub>h</sub> = ${B(fmt(tau0,0)+' s = '+fmt(tau0/60,1)+' min')}`)}
        ${step('4. Nivel final',`<span class="m">h</span><sub>∞</sub> = ${fr(sci(q)+'·'+sci(R0),'9810')} = ${B(fmt(h0*100,2)+' cm')}`)}
        ${step('5. Presión en la línea',`<span class="m">P</span> = ρ<span class="m">gh</span> = ${fmt(rho*g*h0,0)} Pa = ${B(fmt(P0,2)+' mmHg')}`)}
        ${step('6. Con oclusión del '+fmt(v.occ,0)+' % del radio',`<span class="m">R</span><sub>h</sub>' = ${fr('<span class="m">R</span><sub>h</sub>','(1 − '+fmt(v.occ/100,2)+')⁴')} = ×${fmt(fac,2)} → <span class="m">P</span> = ${B(fmt(P1,1)+' mmHg')}`)}
      </div><p class="note">La presión de la línea sube en la misma proporción que la resistencia. Por eso el perfusor detecta la oclusión con un sensor de presión: es más rápido y confiable que esperar a ver el nivel.</p>`;
      return;
    }
    const mc=v.vol/1000*4186, tau=mc/v.hA, Tinf=v.Ta+v.Q0/v.hA, Tend=5*tau, N=600, t=[],T=[];
    for(let i=0;i<=N;i++){ const ti=Tend*i/N; t.push(ti/60); T.push(Tinf+(v.T0-Tinf)*Math.exp(-ti/tau)); }
    P(root,'p1',{series:[{x:t,y:T,color:'s2',label:'Temperatura de la sangre'}],hlines:[{y:37,color:'s3',label:'37 °C objetivo'},{y:42,color:'s2',dash:[2,3],label:'42 °C límite'}],xlabel:'tiempo (min)',ylabel:'T (°C)'});
    const Qreq=v.hA*(37-v.Ta); const t36=Tinf>36&&v.T0<36?-tau*Math.log((Tinf-36)/(Tinf-v.T0)):NaN;
    $('#kpis',root).innerHTML=kpi('τ',fmt(tau/60,1)+' min')+kpi('T final',fmt(Tinf,1)+' °C')+kpi('Potencia para 37 °C',fmt(Qreq,1)+' W')+kpi('Tiempo hasta 36 °C',isNaN(t36)?'no llega':fmt(t36/60,1)+' min');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Capacidad térmica (agua equivalente)',`<span class="m">m c</span><sub>p</sub> = ${fmt(v.vol/1000,3)}·4186 = ${B(fmt(mc,1)+' J/°C')}`)}
      ${step('2. Constante de tiempo',`<span class="m">τ</span> = ${fr(fmt(mc,1),fmt(v.hA,2))} = ${B(fmt(tau,0)+' s = '+fmt(tau/60,1)+' min')}`)}
      ${step('3. Ganancia de la planta',`<span class="m">K</span> = ${fr('1','<span class="m">hA</span>')} = ${B(fmt(1/v.hA,3)+' °C/W')}`)}
      ${step('4. Temperatura final',`<span class="m">T</span><sub>∞</sub> = ${fmt(v.Ta,1)} + ${fr(fmt(v.Q0,1),fmt(v.hA,2))} = ${B(fmt(Tinf,2)+' °C')}`)}
      ${step('5. Respuesta en el tiempo',`<span class="m">T</span>(<span class="m">t</span>) = ${fmt(Tinf,1)} + (${fmt(v.T0,1)} − ${fmt(Tinf,1)})e<sup>−<span class="m">t</span>/${fmt(tau,0)}</sup>`)}
      ${step('6. Potencia necesaria para 37 °C',`<span class="m">Q</span> = ${fmt(v.hA,2)}·(37 − ${fmt(v.Ta,1)}) = ${B(fmt(Qreq,2)+' W')}`)}
    </div>${Tinf>42?'<p class="note alert">Con esta potencia la sangre terminaría por encima de 42 °C. En lazo abierto no hay nada que lo impida: hace falta un controlador y una alarma independiente.</p>':''}`;
  }
  ctl.fire();
}};

MODS.m22={unit:2,code:'2.2',title:'Análisis de la respuesta transitoria y estacionaria',nav:'Respuesta transitoria y estacionaria',
init(root){
  root.innerHTML=layout({unit:2,code:'2.2',title:this.title,
    lead:'La respuesta transitoria dice cómo llega el sistema (rapidez, sobrepaso); la estacionaria dice a dónde llega (error final). El error final depende del tipo de sistema y de la entrada.',
    caso:'Dos lazos con control proporcional. Incubadora (planta tipo 0) siguiendo un cambio de setpoint en escalón. Bomba de jeringa con motor (planta tipo 1, la posición integra la velocidad) siguiendo una rampa: el volumen infundido que debe crecer de forma lineal con el tiempo.',
    theory:`<p>El <b>tipo</b> del sistema es el número de integradores puros (polos en <span class="m">s = 0</span>) de la función de lazo abierto <span class="m">G<sub>la</sub>(s) = K<sub>p</sub>·G(s)</span>. Con realimentación unitaria, el teorema del valor final da el error en estado estacionario.</p>
    <div class="tbl"><table><tr><th>Tipo</th><th>Escalón</th><th>Rampa</th><th>Parábola</th></tr>
    <tr><td>0</td><td class="mono">1/(1+K<sub>p</sub>)</td><td class="mono">∞</td><td class="mono">∞</td></tr>
    <tr><td>1</td><td class="mono">0</td><td class="mono">1/K<sub>v</sub></td><td class="mono">∞</td></tr>
    <tr><td>2</td><td class="mono">0</td><td class="mono">0</td><td class="mono">1/K<sub>a</sub></td></tr></table></div>
    <p class="note">Ojo con la notación: la constante de error de posición también se escribe K<sub>p</sub>. Aquí la llamamos K<sub>pos</sub> para no confundirla con la ganancia del controlador.</p>`,
    formulas: eq(`<span class="m">e</span><sub>ss</sub> = lím<sub><span class="m">s</span>→0</sub> ${fr('<span class="m">s R</span>(<span class="m">s</span>)','1 + <span class="m">G</span><sub>la</sub>(<span class="m">s</span>)')}`,'valor final')+
      eq(`<span class="m">K</span><sub>pos</sub> = lím<sub><span class="m">s</span>→0</sub> <span class="m">G</span><sub>la</sub>(<span class="m">s</span>) &nbsp; <span class="m">K</span><sub>v</sub> = lím<sub><span class="m">s</span>→0</sub> <span class="m">s G</span><sub>la</sub>(<span class="m">s</span>)`)+
      eq(`Tipo 0: <span class="m">τ</span><sub>lc</sub> = ${fr('<span class="m">τ</span>','1 + <span class="m">K K</span><sub>p</sub>')}`)+
      eq(`Tipo 1: <span class="m">ω</span><sub>n</sub> = ${sq(fr('<span class="m">K K</span><sub>p</sub>','<span class="m">τ</span>'))} &nbsp; <span class="m">ζ</span> = ${fr('1','2'+sq('<span class="m">K K</span><sub>p</sub><span class="m">τ</span>'))}`),
    plots:[{id:'p1',cap:'Referencia y salida'},{id:'p2',cap:'Error e(t) = r(t) − y(t)',cls:'short'}],
    practice:[
      ['Planta tipo 0 con K = 0,5 y Kp = 4. ¿Qué error queda ante un escalón unitario?','K<sub>pos</sub> = 0,5·4 = 2; e<sub>ss</sub> = 1/(1+2) = 0,333 (33 %).'],
      ['¿Por qué la bomba de jeringa sigue una rampa con error constante y no creciente?','Porque es tipo 1: tiene un integrador. El error ante rampa vale 1/K<sub>v</sub>, finito. Para anularlo se necesitaría un segundo integrador (control PI).'],
      ['En la planta tipo 1, ¿qué pasa con el sobrepaso si se sube Kp?','ζ = 1/(2√(K·Kp·τ)) baja, así que el sobrepaso aumenta. Se gana precisión ante rampa pero se pierde suavidad.']]
  });
  const ctl=makeControls($('#ctl',root),'m22',[
    {type:'seg',id:'pl',label:'Planta',options:[['t0','Tipo 0: incubadora'],['t1','Tipo 1: bomba de jeringa']],value:'t0'},
    {type:'seg',id:'in',label:'Entrada',options:[['step','Escalón'],['ramp','Rampa']],value:'step'},
    {id:'Kp',label:'Ganancia del controlador K<sub>p</sub>',min:0.2,max:20,step:0.1,value:4,dec:1},
    {id:'tau',label:'Constante de tiempo de la planta τ',min:0.2,max:20,step:0.1,value:10,dec:1}],upd);
  let lastPl='t0';
  function upd(v){
    if(v.pl!==lastPl){ ctl.set('tau',v.pl==='t0'?10:0.5); lastPl=v.pl; }
    const K=v.pl==='t0'?0.5:1, KK=K*v.Kp, tau=v.tau;
    const den=v.pl==='t0'?[tau,1+KK]:[tau,1,KK];
    const rts=polyRoots(den); const smin=Math.min(...rts.map(z=>Math.abs(z.re)));
    let T=clamp(7/smin,1,200); if(v.in==='ramp') T=Math.max(T,v.pl==='t0'?4*tau:10*tau);
    const uf=v.in==='step'?()=>1:t=>t;
    const r=simTF([KK],den,uf,T,3000); const ref=r.t.map(uf), e=ref.map((x,i)=>x-r.y[i]);
    const unit=v.pl==='t0'?'min':'s';
    P(root,'p1',{series:[{x:r.t,y:ref,color:'s6',dash:[6,4],label:'referencia r(t)'},{x:r.t,y:r.y,color:'s1',label:'salida y(t)'}],xlabel:'tiempo ('+unit+')',ylabel:v.pl==='t0'?'ΔT (°C)':'volumen (mL)',yzero:true});
    P(root,'p2',{series:[{x:r.t,y:e,color:'s2',label:'error'}],xlabel:'tiempo ('+unit+')',axes0:true,yzero:true});
    let ess, Kpos, Kv;
    if(v.pl==='t0'){ Kpos=KK; Kv=0; ess=v.in==='step'?1/(1+KK):Infinity; } else { Kpos=Infinity; Kv=KK; ess=v.in==='step'?0:1/KK; }
    const st=v.in==='step'?stepInfo(r.t,r.y,v.pl==='t0'?KK/(1+KK):1):null;
    const wn=Math.sqrt(KK/tau), z=1/(2*Math.sqrt(KK*tau));
    $('#kpis',root).innerHTML=kpi('Error estacionario teórico',fmt(ess,4))+kpi('Error al final de la simulación',fmt(e[e.length-1],4))+(st?kpi('Sobrepaso',fmt(st.Mp,1)+' %')+kpi('Establecimiento 2 %',isNaN(st.ts)?'> ventana':fmt(st.ts,2)+' '+unit):kpi('K<sub>v</sub>',fmt(Kv,3))+kpi('Polos lazo cerrado',polesTxt(rts,2)));
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Función de lazo abierto',`<span class="m">G</span><sub>la</sub>(<span class="m">s</span>) = ${v.pl==='t0'?fr(fmt(v.Kp,1)+'·0,5',fmt(tau,1)+'<span class="m">s</span> + 1'):fr(fmt(v.Kp,1)+'·1','<span class="m">s</span>('+fmt(tau,1)+'<span class="m">s</span> + 1)')} → tipo ${B(v.pl==='t0'?'0':'1')}`)}
      ${step('2. Constantes de error',`<span class="m">K</span><sub>pos</sub> = ${B(fmt(Kpos,3))} &nbsp; <span class="m">K</span><sub>v</sub> = ${B(fmt(Kv,3))}`)}
      ${step('3. Error en estado estacionario ('+(v.in==='step'?'escalón':'rampa')+')',v.in==='step'?`<span class="m">e</span><sub>ss</sub> = ${fr('1','1 + '+fmt(Kpos,3))} = ${B(fmt(ess,4))}`:`<span class="m">e</span><sub>ss</sub> = ${fr('1','<span class="m">K</span><sub>v</sub>')} = ${B(fmt(ess,4))}`)}
      ${step('4. Función de lazo cerrado',`<span class="m">T</span>(<span class="m">s</span>) = ${fr(fmt(KK,2),v.pl==='t0'?fmt(tau,1)+'<span class="m">s</span> + '+fmt(1+KK,2):fmt(tau,1)+'<span class="m">s</span>² + <span class="m">s</span> + '+fmt(KK,2))}`)}
      ${v.pl==='t0'?step('5. Nueva constante de tiempo',`<span class="m">τ</span><sub>lc</sub> = ${fr(fmt(tau,1),'1 + '+fmt(KK,2))} = ${B(fmt(tau/(1+KK),3)+' '+unit)}`):step('5. Parámetros de 2º orden',`<span class="m">ω</span><sub>n</sub> = ${B(fmt(wn,3)+' rad/s')} &nbsp; <span class="m">ζ</span> = ${B(fmt(z,3))}`)}
      ${v.pl==='t1'&&z<1?step('6. Sobrepaso esperado',`<span class="m">M</span><sub>p</sub> = ${B(fmt(100*Math.exp(-z*PI/Math.sqrt(1-z*z)),1)+' %')}`):''}
    </div>`;
  }
  ctl.fire();
}};

MODS.m23={unit:2,code:'2.3',title:'Ejemplos y aplicaciones: calentador de sangre con PID',nav:'Ejemplo aplicado: calentador de sangre',
init(root){
  root.innerHTML=layout({unit:2,code:'2.3',title:this.title,
    lead:'Un proceso térmico real tiene cosas que el modelo ideal no muestra: el calentador tiene potencia máxima, el sensor está lejos y mide con ruido. Aquí se juntan las tres.',
    caso:'Calentador de sangre para transfusión. Bolsa de 250 mL a temperatura de sala (22 °C), m·c<sub>p</sub> = 1046,5 J/°C, hA = 0,8 W/°C, setpoint 37 °C. El sensor está aguas abajo y agrega un retardo muerto θ. La temperatura nunca debe pasar de 42 °C.',
    theory:`<p>Con solo <b>P</b> queda error estacionario: para sostener 37 °C se necesitan 12 W, y un controlador P solo los entrega si hay error. La <b>I</b> lo elimina. La <b>D</b> anticipa y reduce el sobrepaso, pero amplifica el ruido del sensor; por eso se calcula sobre la medición filtrada y no sobre el error.</p>
    <p>El <b>retardo muerto</b> agrega fase negativa (<span class="m">e<sup>−θs</sup></span>) y limita cuánto se puede subir la ganancia antes de oscilar. La <b>saturación</b> del actuador hace que la integral siga creciendo sin efecto (windup); el simulador usa integración condicional como anti-windup.</p>`,
    formulas: eq(`<span class="m">m c</span><sub>p</sub>${fr('d<span class="m">T</span>','d<span class="m">t</span>')} = <span class="m">Q</span>(<span class="m">t</span> − <span class="m">θ</span>) − <span class="m">hA</span>(<span class="m">T</span> − <span class="m">T</span><sub>amb</sub>)`)+
      eq(`<span class="m">G</span>(<span class="m">s</span>) = ${fr('<span class="m">K</span> e<sup>−<span class="m">θs</span></sup>','<span class="m">τs</span> + 1')}`,'primer orden con retardo')+
      eq(`<span class="m">Q</span> = <span class="m">K</span><sub>p</sub><span class="m">e</span> + <span class="m">K</span><sub>i</sub>∫<span class="m">e</span> d<span class="m">t</span> − <span class="m">K</span><sub>d</sub>${fr('d<span class="m">T</span><sub>f</sub>','d<span class="m">t</span>')}`)+
      eq(`0 ≤ <span class="m">Q</span> ≤ <span class="m">Q</span><sub>máx</sub>`,'saturación')+
      eq(`Solo P: <span class="m">T</span><sub>∞</sub> = ${fr('<span class="m">T</span><sub>amb</sub> + <span class="m">K K</span><sub>p</sub>·37','1 + <span class="m">K K</span><sub>p</sub>')}`),
    plots:[{id:'p1',cap:'Temperatura de la sangre'},{id:'p2',cap:'Potencia aplicada',cls:'short'}],
    practice:[
      ['Con Kp = 2 W/°C y sin integral, ¿dónde se estabiliza la sangre?','K = 1,25 °C/W, K·Kp = 2,5. T∞ = (22 + 2,5·37)/3,5 = 32,7 °C. Quedan 4,3 °C de error.'],
      ['Sube θ a 150 s con el PID por defecto. ¿Qué observas y por qué?','Aparece sobrepaso y oscilación: el controlador reacciona a una medición vieja. El retardo resta margen de fase.'],
      ['¿Por qué un proceso térmico necesita ganancias integrales tan pequeñas comparadas con el MRA?','Porque τ es de decenas de minutos. Una integral rápida acumula demasiado antes de que la temperatura alcance a responder y produce sobrepaso.']]
  });
  const ctl=makeControls($('#ctl',root),'m23',[
    {type:'buttons',id:'pre',label:'Ajustes rápidos',items:[['Solo P',a=>{a.set('Kp',2);a.set('Ki',0);a.set('Kd',0);}],['PI',a=>{a.set('Kp',2);a.set('Ki',0.004);a.set('Kd',0);}],['PID',a=>{a.set('Kp',3);a.set('Ki',0.004);a.set('Kd',150);}]]},
    {id:'Kp',label:'K<sub>p</sub>',min:0,max:10,step:0.1,value:3,unit:'W/°C',dec:1},
    {id:'Ki',label:'K<sub>i</sub>',min:0,max:0.02,step:0.0005,value:0.004,unit:'W/(°C·s)',dec:4},
    {id:'Kd',label:'K<sub>d</sub>',min:0,max:600,step:10,value:150,unit:'W·s/°C',dec:0},
    {id:'th',label:'Retardo muerto θ',min:0,max:180,step:5,value:30,unit:'s',dec:0},
    {id:'Qm',label:'Potencia máxima Q<sub>máx</sub>',min:10,max:60,step:1,value:30,unit:'W',dec:0},
    {type:'check',id:'nz',label:'Ruido del sensor ±0,2 °C',value:false}],upd);
  function upd(v){
    const mc=1046.5,hA=0.8,Ta=22,Tr=37,dt=1,Tend=90*60, nd=Math.round(v.th/dt);
    const rnd=lcg(7); const buf=new Array(nd+1).fill(0);
    let T=22,I=0,Tf=22; const t=[],Tm=[],Qs=[];
    for(let i=0;i<=Tend;i+=dt){
      const meas=T+(v.nz?(rnd()-0.5)*0.4:0);
      const dTf=(meas-Tf)/10; Tf+=dt*dTf;
      const e=Tr-meas; const raw=v.Kp*e+v.Ki*I-v.Kd*dTf; const Q=clamp(raw,0,v.Qm);
      if(raw===Q||(raw>v.Qm&&e<0)||(raw<0&&e>0)) I+=e*dt;
      buf.push(Q); const Qd=buf.shift();
      t.push(i/60); Tm.push(T); Qs.push(Q);
      T+=dt*(Qd-hA*(T-Ta))/mc;
    }
    P(root,'p1',{series:[{x:t,y:Tm,color:'s2',label:'Temperatura real'}],hlines:[{y:37,color:'s3',label:'37 °C'},{y:42,color:'s2',dash:[2,3],label:'42 °C límite'}],bands:[{y0:36.5,y1:37.5}],xlabel:'tiempo (min)',ylabel:'T (°C)'});
    P(root,'p2',{series:[{x:t,y:Qs,color:'s1',label:'Q (W)'}],hlines:[{y:v.Qm,color:'s6',label:'Q máx'}],xlabel:'tiempo (min)',ylabel:'Q (W)',yzero:true});
    const n=Tm.length, last=Tm.slice(-600), ssT=last.reduce((a,b)=>a+b,0)/last.length, Tmax=Math.max(...Tm);
    let ts=NaN; for(let i=n-1;i>=0;i--){ if(Math.abs(Tm[i]-37)>0.5){ ts=i<n-1?t[i+1]:NaN; break; } if(i===0) ts=0; }
    const Mp=Math.max(0,Tmax-37);
    $('#kpis',root).innerHTML=kpi('Temperatura máxima',fmt(Tmax,2)+' °C '+(Tmax>42?pill('bad','> 42 °C'):''))+kpi('Sobrepaso',fmt(Mp,2)+' °C')+kpi('Entra a 37 ± 0,5 °C',isNaN(ts)?'no se establece':fmt(ts,1)+' min')+kpi('Error final medio',fmt(37-ssT,2)+' °C');
    const K=1/hA, tau=mc/hA, Tp=(Ta+K*v.Kp*37)/(1+K*v.Kp);
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Parámetros de la planta',`<span class="m">K</span> = ${fr('1','0,8')} = ${B('1,25 °C/W')} &nbsp; <span class="m">τ</span> = ${fr('1046,5','0,8')} = ${B(fmt(tau,0)+' s')}`)}
      ${step('2. Potencia de sostenimiento a 37 °C',`<span class="m">Q</span><sub>ss</sub> = 0,8·(37 − 22) = ${B('12 W')}`)}
      ${step('3. Si solo hubiera P con este K<sub>p</sub>',`<span class="m">T</span><sub>∞</sub> = ${fr('22 + 1,25·'+fmt(v.Kp,1)+'·37','1 + 1,25·'+fmt(v.Kp,1))} = ${B(fmt(Tp,2)+' °C')}`)}
      ${step('4. Forma estándar del PID',`<span class="m">T</span><sub>i</sub> = ${fr('<span class="m">K</span><sub>p</sub>','<span class="m">K</span><sub>i</sub>')} = ${B(v.Ki>0?fmt(v.Kp/v.Ki,0)+' s':'∞')} &nbsp; <span class="m">T</span><sub>d</sub> = ${fr('<span class="m">K</span><sub>d</sub>','<span class="m">K</span><sub>p</sub>')} = ${B(v.Kp>0?fmt(v.Kd/v.Kp,1)+' s':'—')}`)}
      ${step('5. Relación retardo / constante de tiempo',`${fr('<span class="m">θ</span>','<span class="m">τ</span>')} = ${fr(fmt(v.th,0),fmt(tau,0))} = ${B(fmt(v.th/tau,3))} ${v.th/tau>0.1?'(el retardo empieza a pesar)':'(retardo pequeño)'}`)}
      ${step('6. Potencia inicial pedida',`<span class="m">K</span><sub>p</sub>·(37 − 22) = ${fmt(v.Kp*15,1)} W → ${v.Kp*15>v.Qm?B('satura en '+fmt(v.Qm,0)+' W'):B('no satura')}`)}
    </div>${Tmax>42?'<p class="note alert">La sangre pasó de 42 °C. En un equipo real se exige un termostato de seguridad independiente del controlador.</p>':''}`;
  }
  ctl.fire();
}};

MODS.m31={unit:3,code:'3.1',title:'Lugar de las raíces',nav:'Análisis y diseño por lugar de las raíces',
init(root){
  root.innerHTML=layout({unit:3,code:'3.1',title:this.title,
    lead:'El lugar de las raíces dibuja por dónde se mueven los polos de lazo cerrado cuando la ganancia K va de 0 a infinito. Con él eliges K mirando la forma de la respuesta que quieres.',
    caso:'Brazo robótico de rehabilitación de codo movido por un motor DC con reductor: G(s) = 1/(s(s+a)(s+b)). También puedes ver el MRA (plataforma de rehabilitación) con control P y con control PD para comparar cómo un cero cambia el lugar.',
    theory:`<p>La ecuación característica es <span class="m">1 + K·G(s) = 0</span>. Para K = 0 los polos de lazo cerrado coinciden con los de lazo abierto (×) y cuando K → ∞ van hacia los ceros (○) o hacia el infinito por asíntotas.</p>
    <ul><li>Sobre el eje real, el lugar existe a la izquierda de un número impar de polos y ceros.</li>
    <li>Hay <span class="m">n − m</span> asíntotas, centradas en <span class="m">σ<sub>a</sub></span> con ángulos <span class="m">(2q+1)·180°/(n−m)</span>.</li>
    <li>Los puntos de ruptura cumplen <span class="m">dK/ds = 0</span>.</li>
    <li>El cruce con el eje jω se obtiene con Routh y marca la ganancia crítica.</li></ul>
    <p>Si quieres menos sobrepaso, busca un K cuyos polos dominantes queden sobre la línea de ζ deseado. Agregar un cero (PD) jala el lugar hacia la izquierda y lo vuelve más estable.</p>`,
    formulas: eq(`1 + <span class="m">K</span>${fr('<span class="m">N</span>(<span class="m">s</span>)','<span class="m">D</span>(<span class="m">s</span>)')} = 0 &nbsp;⇔&nbsp; <span class="m">D</span>(<span class="m">s</span>) + <span class="m">K N</span>(<span class="m">s</span>) = 0`)+
      eq(`<span class="m">σ</span><sub>a</sub> = ${fr('Σ polos − Σ ceros','<span class="m">n</span> − <span class="m">m</span>')}`)+
      eq(`<span class="m">θ</span><sub>a</sub> = ${fr('(2<span class="m">q</span>+1)·180°','<span class="m">n</span> − <span class="m">m</span>')}`)+
      eq(`${fr('d<span class="m">K</span>','d<span class="m">s</span>')} = 0 &nbsp;⇒&nbsp; <span class="m">N D</span>′ − <span class="m">D N</span>′ = 0`,'ruptura')+
      eq(`|<span class="m">K G</span>(<span class="m">s</span>)| = 1, &nbsp; ∠<span class="m">G</span>(<span class="m">s</span>) = ±180°`,'condiciones'),
    plots:[{id:'p1',cap:'Lugar de las raíces',sub:'× polos · ○ ceros · ● polos para tu K',cls:'tall'},{id:'p2',cap:'Respuesta al escalón en lazo cerrado',cls:'short'}],
    practice:[
      ['Para G = 1/(s(s+1)(s+5)), ¿dónde están las asíntotas?','n − m = 3. σ<sub>a</sub> = (0 − 1 − 5)/3 = −2. Ángulos de 60°, 180° y 300°.'],
      ['¿Para qué K se vuelve inestable ese brazo?','Ecuación s³ + 6s² + 5s + K = 0. Por Routh, K<sub>crít</sub> = 6·5 = 30, con oscilación en ω = √5 ≈ 2,24 rad/s.'],
      ['¿Por qué el MRA con control P nunca es inestable?','Tiene 2 polos y ningún cero: las asíntotas son verticales en σ = −b/(2m). Los polos solo suben y bajan, nunca cruzan al semiplano derecho.']]
  });
  const ctl=makeControls($('#ctl',root),'m31',[
    {type:'seg',id:'pl',label:'Planta',options:[['arm','Brazo'],['mra','MRA + P'],['pd','MRA + PD']],value:'arm'},
    {id:'a',label:'Polo a del motor',min:0.5,max:10,step:0.1,value:1,dec:1,showIf:v=>v.pl==='arm'},
    {id:'b',label:'Polo b de la carga',min:0.5,max:15,step:0.1,value:5,dec:1,showIf:v=>v.pl==='arm'},
    {id:'bm',label:'b/m (amortiguamiento por masa)',min:0,max:10,step:0.1,value:2,unit:'s⁻¹',dec:1,showIf:v=>v.pl!=='arm'},
    {id:'km',label:'k/m (rigidez por masa)',min:1,max:50,step:0.5,value:10,unit:'s⁻²',dec:1,showIf:v=>v.pl!=='arm'},
    {id:'z',label:'Cero del PD en s = −z',min:0.5,max:20,step:0.1,value:4,dec:1,showIf:v=>v.pl==='pd'},
    {id:'K',label:'Ganancia K',min:0.01,max:1000,value:10,log:true}],upd);
  function upd(v){
    let N,D,name;
    if(v.pl==='arm'){ N=[1]; D=polymul([1,0],polymul([1,v.a],[1,v.b])); name=`<span class="m">s</span>(<span class="m">s</span>+${fmt(v.a,1)})(<span class="m">s</span>+${fmt(v.b,1)})`; }
    else if(v.pl==='mra'){ N=[1]; D=[1,v.bm,v.km]; name=`<span class="m">s</span>² + ${fmt(v.bm,1)}<span class="m">s</span> + ${fmt(v.km,1)}`; }
    else { N=[1,v.z]; D=[1,v.bm,v.km]; name=`<span class="m">s</span>² + ${fmt(v.bm,1)}<span class="m">s</span> + ${fmt(v.km,1)}`; }

  }

const ART=(()=>{ const N=512,H=10,v=[];
  for(let i=0;i<N;i++){ const p=i/N; const up=p<0.14?Math.exp(-(((p-0.14)/0.045)**2)):Math.exp(-(((p-0.14)/0.11)**2)); const dic=0.3*Math.exp(-(((p-0.43)/0.05)**2)); const base=0.12*Math.cos(PI*(p-0.14))**2; v.push(up+dic+base); }
  const a0=v.reduce((s,x)=>s+x,0)/N, c=[];
  for(let k=1;k<=H;k++){ let re=0,im=0; for(let i=0;i<N;i++){ const th=2*PI*k*i/N; re+=v[i]*Math.cos(th); im+=v[i]*Math.sin(th);} re*=2/N; im*=2/N; c.push({A:Math.hypot(re,im),ph:-Math.atan2(im,re)}); }
  const ev=p=>c.reduce((s,ck,k)=>s+ck.A*Math.cos(2*PI*(k+1)*p+ck.ph),a0);
  let mn=Infinity,mx=-Infinity; for(let i=0;i<500;i++){ const y=ev(i/500); mn=Math.min(mn,y); mx=Math.max(mx,y); }
  const sc=40/(mx-mn); return {dc:80+(a0-mn)*sc, c:c.map(ck=>({A:ck.A*sc,ph:ck.ph}))}; })();
