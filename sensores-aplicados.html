<title>Laboratorio de Sensores Biomédicos</title>

<style>
/* Layout: barra lateral con las 4 unidades del micro + área de trabajo tipo banco de laboratorio (teoría, simulador, cálculo). Colores de trazas inspirados en el monitor de signos vitales. */
:root{
  --bg:#EEF2F2; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15202A; --muted:#566778; --line:#D3DCE4;
  --accent:#0B746F; --accent-ink:#FFFFFF; --accent-soft:#DDEFED;
  --plot-bg:#FBFCFD; --grid:#E4EAF0; --axis:#8796A5; --band:rgba(33,135,90,.12); --shade:rgba(176,36,62,.08);
  --s1:#1170B5; --s2:#C8362B; --s3:#1F8656; --s4:#B07408; --s5:#6C45B3; --s6:#7A8896;
  --ok:#1E7D4F; --warn:#9A6200; --bad:#B0243E;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1016; --surface:#111920; --surface-2:#16212B; --ink:#E3EAF0; --muted:#92A3B3; --line:#24313D;
  --accent:#3CC4B9; --accent-ink:#04211F; --accent-soft:#0F2E2C;
  --plot-bg:#091016; --grid:#1A2630; --axis:#5D6F80; --band:rgba(69,211,138,.13); --shade:rgba(240,106,130,.10);
  --s1:#4DB2F4; --s2:#FF6C5C; --s3:#46D28A; --s4:#F1B23C; --s5:#B28EFF; --s6:#8D9EAE;
  --ok:#46D28A; --warn:#F1B23C; --bad:#F06A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1016; --surface:#111920; --surface-2:#16212B; --ink:#E3EAF0; --muted:#92A3B3; --line:#24313D;
  --accent:#3CC4B9; --accent-ink:#04211F; --accent-soft:#0F2E2C;
  --plot-bg:#091016; --grid:#1A2630; --axis:#5D6F80; --band:rgba(69,211,138,.13); --shade:rgba(240,106,130,.10);
  --s1:#4DB2F4; --s2:#FF6C5C; --s3:#46D28A; --s4:#F1B23C; --s5:#B28EFF; --s6:#8D9EAE;
  --ok:#46D28A; --warn:#F1B23C; --bad:#F06A82; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand b{font-family:var(--f-display);font-stretch:92%;font-weight:750;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trace{width:64px;height:22px;flex:none;color:var(--accent)}
.navsel{display:none;margin-left:auto;max-width:56vw;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font-size:13px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100% - 50px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:18px 12px 40px 16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);height:calc(100vh - 49px);overflow:auto}
.side .home{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;margin-bottom:6px}
.side h3{font-family:var(--f-display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px;font-weight:650;line-height:1.35}
.side h3 i{font-style:normal;color:var(--accent);margin-right:4px}
.side a.it{display:flex;gap:8px;padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.35}
.side a.it span:first-child{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none;padding-top:1px}
.side a:hover{background:var(--surface-2)}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.side a[aria-current="page"] span:first-child{color:var(--accent)}

main{min-width:0;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mod{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mh .eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.mh h1{font-family:var(--f-display);font-weight:780;font-stretch:90%;font-size:clamp(26px,3.4vw,38px);line-height:1.08;margin:4px 0 8px;letter-spacing:-.015em;text-wrap:balance}
.mh .lead{max-width:72ch;color:var(--muted);margin:0;font-size:16px}
h2{font-family:var(--f-display);font-weight:700;font-stretch:95%;font-size:19px;margin:0 0 10px;letter-spacing:-.005em}
h4{font-size:14px;margin:14px 0 4px}
.case{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px 8px 8px 4px;padding:12px 16px;max-width:900px}
.case b{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);flex:none;padding-top:2px}
.case p{margin:0}

.theory{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.theory .txt p{margin:0 0 10px;max-width:68ch}
.theory .txt ul{margin:0 0 10px;padding-left:20px}
.formulas{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.formulas .ft{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eq{font-family:var(--f-math);font-size:18px;line-height:1.7;overflow-x:auto;white-space:nowrap;padding:2px 0}
.eq small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);margin-left:10px;white-space:normal}
.eqd{font-size:12.5px;color:var(--muted);margin-top:-6px;font-family:var(--f-body)}
.m{font-family:var(--f-math);font-style:italic;font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:1.2px solid currentColor;padding:0 4px 1px}
.fr>span:last-child{padding:1px 4px 0}
.sq{border-top:1.2px solid currentColor;padding:0 2px;margin-left:1px}
.mat{display:inline-flex;vertical-align:middle;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:5px;padding:1px 4px;margin:0 3px}
.mat .mb{display:table}.mat .mr{display:table-row}.mat .mr>span{display:table-cell;padding:1px 7px;text-align:center;font-variant-numeric:tabular-nums}

.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.lab .lt{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:-4px}
.lab .lt h2{margin:0}
.lab .lt span{font-size:12.5px;color:var(--muted)}
.ctl{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}
.crow .clab{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px;align-items:baseline}
.crow .clab label{color:var(--ink)}
.crow output{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.crow output .u{color:var(--muted);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface-2)}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:7px 10px;font-size:12.5px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 10px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.crow.num{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.crow.num input{width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--ink);font-family:var(--f-mono)}
.plots{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}
.plots.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.plot{margin:0;min-width:0}
.plot figcaption{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plot figcaption b{color:var(--ink);font-weight:600}
.plot canvas{display:block;width:100%;height:280px;border-radius:6px}
.plot.short canvas{height:210px}
.plot.tall canvas{height:320px}
.plots .kpis,.plots .tbl{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.pt{width:8px;height:8px;border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.kpi .k{font-size:11.5px;color:var(--muted);line-height:1.3}
.kpi .v{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;letter-spacing:.02em}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}

.calc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:10px 26px}
.step{padding:8px 0;border-bottom:1px dashed var(--line);min-width:0}
.step .sl{font-size:12.5px;color:var(--muted)}
.step .se{font-family:var(--f-math);font-size:17px;overflow-x:auto;white-space:nowrap;line-height:1.75}
.step .se b{font-family:var(--f-mono);font-weight:500;font-size:14.5px;color:var(--accent)}
.note{font-size:13.5px;color:var(--muted);margin:12px 0 0;max-width:80ch}
.note.alert{color:var(--bad)}

.tbl{overflow-x:auto}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.03em}
td.mono{font-family:var(--f-mono);font-size:13px}
.routh td{font-family:var(--f-mono);text-align:right}
.routh td:first-child{text-align:left;color:var(--muted)}
.routh td.fc{font-weight:600}
.routh td.neg{color:var(--bad)}

.practice details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.practice summary{cursor:pointer;font-weight:500}
.practice details p{margin:8px 0 2px;color:var(--muted)}

.diagram{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.diagram svg{display:block;min-width:640px;width:100%;height:auto}

/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:26px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:clamp(32px,4.6vw,54px);line-height:1;margin:6px 0 12px;letter-spacing:-.02em;text-wrap:balance}
.hero p{color:var(--muted);max-width:60ch;margin:0 0 8px;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin-top:12px}
.meta b{color:var(--ink);font-weight:600}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.unit .un{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.unit h2{margin:4px 0 10px}
.unit a{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.unit a span:first-child{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;flex:none;padding-top:1px}
.unit a:hover span:last-child{color:var(--accent)}
.unit a small{display:block;color:var(--muted);font-size:12.5px}
.fsheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

@media (max-width:1020px){
  .theory{grid-template-columns:minmax(0,1fr)}
  .lab{grid-template-columns:minmax(0,1fr)}
  .ctl{position:static}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .navsel{display:block}
  .brand span{display:none}
  .units,.fsheet{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .plots.two{grid-template-columns:minmax(0,1fr)}
  .plot canvas{height:240px}
  .lab{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.expl{display:flex;flex-direction:column;gap:4px}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.ecard .en{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ecard .eq{font-size:17px;white-space:normal}
.ecard p{margin:2px 0 8px;font-size:13.5px;color:var(--muted)}
.vt{min-width:0;width:100%;font-size:13px}
.vt td{padding:4px 6px;vertical-align:top}
.vt td.sym{font-family:var(--f-math);font-style:italic;font-size:15px;white-space:nowrap;color:var(--ink);width:1%}
.vt td.un{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;width:1%}
</style>

</head>

<script>
"use strict";
/* =============== utilidades numéricas =============== */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const PI=Math.PI;
function fmt(x,d=2){
  if(x===undefined||x===null||Number.isNaN(x)) return '—';
  if(!isFinite(x)) return x>0?'∞':'−∞';
  const a=Math.abs(x);
  if(a<1e-12) return '0';
  if(a!==0&&(a>=1e6||a<Math.pow(10,-d)/2)) return sci(x,2);
  return x.toLocaleString('es-CO',{minimumFractionDigits:0,maximumFractionDigits:d}).replace('-','−');
}
function sci(x,d=2){
  if(x===0) return '0';
  const e=Math.floor(Math.log10(Math.abs(x))); const m=x/Math.pow(10,e);
  return `${m.toLocaleString('es-CO',{maximumFractionDigits:d}).replace('-','−')}×10<sup>${e}</sup>`;
}
function fsig(x,s=3){ if(!isFinite(x)||x===0) return fmt(x); const d=Math.max(0,s-1-Math.floor(Math.log10(Math.abs(x)))); return fmt(x,Math.min(d,6)); }
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sq=x=>`√<span class="sq">${x}</span>`;
const mat=rows=>`<span class="mat"><span class="mb">${rows.map(r=>`<span class="mr">${r.map(c=>`<span>${c}</span>`).join('')}</span>`).join('')}</span></span>`;
const B=x=>`<b>${x}</b>`;

const Cx=(re,im=0)=>({re,im});
const cadd=(a,b)=>Cx(a.re+b.re,a.im+b.im), csub=(a,b)=>Cx(a.re-b.re,a.im-b.im);
const cmul=(a,b)=>Cx(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);
const cdiv=(a,b)=>{const d=b.re*b.re+b.im*b.im; return Cx((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d);};
const cabs=a=>Math.hypot(a.re,a.im);
function cfmt(z,d=2){ if(Math.abs(z.im)<1e-9) return fmt(z.re,d); return `${fmt(z.re,d)} ${z.im>=0?'+':'−'} j${fmt(Math.abs(z.im),d)}`; }
function polesTxt(rs,d=2){ const out=[]; rs.forEach(z=>{ if(Math.abs(z.im)<1e-9) out.push(fmt(z.re,d)); else if(z.im>0) out.push(`${fmt(z.re,d)} ± j${fmt(z.im,d)}`); }); return out.join(' ; '); }

function polyval(p,s){ let r=Cx(0); for(const c of p) r=cadd(cmul(r,s),Cx(c)); return r; }
const polyvalR=(p,x)=>p.reduce((r,c)=>r*x+c,0);
function polymul(a,b){ const r=new Array(a.length+b.length-1).fill(0); a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y)); return r; }
function polyadd(a,b){ const n=Math.max(a.length,b.length); const r=new Array(n).fill(0); a.forEach((x,i)=>r[n-a.length+i]+=x); b.forEach((x,i)=>r[n-b.length+i]+=x); return r; }
const polyscale=(a,k)=>a.map(x=>x*k);
const polyder=p=>p.slice(0,-1).map((c,i)=>c*(p.length-1-i));
function polyRoots(p0){
  let p=p0.slice(); while(p.length>1&&Math.abs(p[0])<1e-14) p.shift();
  const roots=[]; while(p.length>1&&Math.abs(p[p.length-1])<1e-14){ p.pop(); roots.push(Cx(0)); }
  const n=p.length-1; if(n<1) return roots;
  const a=p.map(v=>v/p[0]);
  if(n===1){ roots.push(Cx(-a[1])); return roots; }

/* función de transferencia -> espacio de estados (forma canónica controlable) */
function tf2ss(num,den){
  den=den.slice(); while(Math.abs(den[0])<1e-15) den.shift();
  const n=den.length-1, a0=den[0]; const a=den.map(v=>v/a0);
  let b=num.map(v=>v/a0); while(b.length<n+1) b.unshift(0);
  const D=b[0]; const A=[]; for(let i=0;i<n;i++){ A.push(new Array(n).fill(0)); if(i<n-1) A[i][i+1]=1; }
  for(let j=0;j<n;j++) A[n-1][j]=-a[n-j];
  const Bv=new Array(n).fill(0); Bv[n-1]=1;
  const Cv=[]; for(let j=0;j<n;j++) Cv.push(b[n-j]-a[n-j]*D);
  return {A,B:Bv,C:Cv,D,n};
}
function deriv(ss,x,u){ const n=ss.n, dx=new Array(n); for(let i=0;i<n;i++){ let s=ss.B[i]*u; const r=ss.A[i]; for(let j=0;j<n;j++) s+=r[j]*x[j]; dx[i]=s; } return dx; }
function rk4(ss,x,u,dt){ const n=ss.n; const k1=deriv(ss,x,u);
  const x2=x.map((v,i)=>v+dt/2*k1[i]), k2=deriv(ss,x2,u);
  const x3=x.map((v,i)=>v+dt/2*k2[i]), k3=deriv(ss,x3,u);
  const x4=x.map((v,i)=>v+dt*k3[i]), k4=deriv(ss,x4,u);
  return x.map((v,i)=>v+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i])); }
const outp=(ss,x,u)=>ss.C.reduce((s,c,i)=>s+c*x[i],0)+ss.D*u;
function simTF(num,den,uf,T,N=2500,x0){
  const ss=tf2ss(num,den); const dt=T/N; let x=x0?x0.slice():new Array(ss.n).fill(0);
  const t=[],y=[];
  for(let i=0;i<=N;i++){ const ti=i*dt, u=uf(ti); t.push(ti); y.push(outp(ss,x,u)); if(ss.n) x=rk4(ss,x,uf(ti+dt/2),dt); }
  return {t,y};
}
function stepInfo(t,y,yf,y0=0){
  const n=y.length; if(yf===undefined) yf=y[n-1];
  const amp=yf-y0; let pk=-Infinity,tp=NaN;
  for(let i=0;i<n;i++){ const v=(y[i]-y0)*Math.sign(amp||1); if(v>pk){pk=v;tp=t[i];} }
  const Mp=Math.abs(amp)>1e-12&&pk>Math.abs(amp)?(pk-Math.abs(amp))/Math.abs(amp)*100:0;
  let t10=NaN,t90=NaN; for(let i=0;i<n;i++){ const v=(y[i]-y0)/(amp||1); if(isNaN(t10)&&v>=0.1) t10=t[i]; if(v>=0.9){t90=t[i];break;} }
  let ts=0; const tol=0.02*Math.abs(amp);
  for(let i=n-1;i>=0;i--){ if(Math.abs(y[i]-yf)>tol){ ts=i<n-1?t[i+1]:NaN; break; } }
  return {Mp,tp:Mp>0.05?tp:NaN,tr:t90-t10,ts};
}
function lcg(seed){ let s=seed>>>0; return ()=>{ s=(1664525*s+1013904223)>>>0; return s/4294967296; }; }

    if(lab){ g.fillStyle=colr(c||'s6'); g.font=`11px ${fm}`; if(isH){ g.textAlign='right'; g.textBaseline='bottom'; g.fillText(lab,ml+pw-4,Y(v)-2);} else { g.textAlign='left'; g.textBaseline='top'; g.fillText(lab,X(v)+4,mt+4);} } };

function makeControls(host,pre,defs,onChange){
  const v={};
  const api={v,set(id,val){ const d=defs.find(x=>x.id===id); if(d&&d._set) d._set(val); },fire};
  defs.forEach(d=>{
    const row=document.createElement('div'); row.className='crow'; d._row=row; const id=`${pre}-${d.id}`;
    if(d.type==='seg'){
      v[d.id]=d.value;
      row.innerHTML=`<div class="clab"><span>${d.label}</span></div><div class="seg" role="radiogroup" aria-label="${d.label.replace(/<[^>]+>/g,'')}">${d.options.map(([val,txt])=>`<button type="button" role="radio" id="${id}-${val}" data-v="${val}" aria-checked="${val===d.value}">${txt}</button>`).join('')}</div>`;
      const bs=row.querySelectorAll('button'); bs.forEach(b=>b.onclick=()=>{ v[d.id]=b.dataset.v; bs.forEach(x=>x.setAttribute('aria-checked',String(x===b))); fire(); });
      d._set=val=>{ v[d.id]=val; bs.forEach(x=>x.setAttribute('aria-checked',String(x.dataset.v===val))); };
    } else if(d.type==='check'){
      v[d.id]=!!d.value; row.innerHTML=`<label class="chk"><input type="checkbox" id="${id}" ${d.value?'checked':''}> ${d.label}</label>`;
      const inp=row.querySelector('input'); inp.onchange=()=>{ v[d.id]=inp.checked; fire(); }; d._set=val=>{ v[d.id]=!!val; inp.checked=!!val; };
    } else if(d.type==='num'){
      v[d.id]=d.value; row.className='crow num'; row.innerHTML=`<label for="${id}">${d.label}</label><input type="number" id="${id}" value="${d.value}" step="${d.step||'any'}">`;
      const inp=row.querySelector('input'); inp.oninput=()=>{ const x=parseFloat(inp.value); v[d.id]=isFinite(x)?x:0; fire(); }; d._set=val=>{ v[d.id]=val; inp.value=val; };
    } else if(d.type==='buttons'){
      row.innerHTML=`<div class="clab"><span>${d.label}</span></div><div class="btns">${d.items.map((it,i)=>`<button type="button" class="btn" id="${id}-${i}" data-i="${i}">${it[0]}</button>`).join('')}</div>`;
      row.querySelectorAll('button').forEach(b=>b.onclick=()=>{ d.items[+b.dataset.i][1](api); fire(); });
    } else {
      const toPos=x=>d.log?Math.round(1000*Math.log(x/d.min)/Math.log(d.max/d.min)):x;
      const fromPos=p=>d.log?+fsigNum(d.min*Math.pow(d.max/d.min,p/1000)):+p;
      v[d.id]=d.value;
      row.innerHTML=`<div class="clab"><label for="${id}">${d.label}</label><output for="${id}"></output></div><input type="range" id="${id}" min="${d.log?0:d.min}" max="${d.log?1000:d.max}" step="${d.log?1:d.step}" value="${toPos(d.value)}">`;
      const inp=row.querySelector('input'), out=row.querySelector('output');
      const show=()=>{ out.innerHTML=(d.log?fsig(v[d.id],3):fmt(v[d.id],d.dec??2))+(d.unit?` <span class="u">${d.unit}</span>`:''); };
      inp.oninput=()=>{ v[d.id]=fromPos(inp.value); show(); fire(); };
      d._set=val=>{ v[d.id]=val; inp.value=toPos(val); show(); }; show();
    }
    host.appendChild(row);
  });
  function vis(){ defs.forEach(d=>{ if(d.showIf) d._row.hidden=!d.showIf(v); }); }
  function fire(){ vis(); onChange(v); }
  vis(); return api;
}

function gaussGen(seed){ const r=lcg(seed); return ()=>{ let u=r()||1e-9, v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*PI*v); }; }
function biquad(x,c){ const y=new Array(x.length); let x1=0,x2=0,y1=0,y2=0; for(let i=0;i<x.length;i++){ const yi=c.b[0]*x[i]+c.b[1]*x1+c.b[2]*x2-c.a[1]*y1-c.a[2]*y2; x2=x1;x1=x[i];y2=y1;y1=yi;y[i]=yi; } return y; }
function lpCoef(fc,fs,Q=0.7071){ const w=2*PI*fc/fs, al=Math.sin(w)/(2*Q), c=Math.cos(w), a0=1+al; return {b:[(1-c)/2/a0,(1-c)/a0,(1-c)/2/a0],a:[1,-2*c/a0,(1-al)/a0]}; }
function notchCoef(f0,fs,Q=30){ const w=2*PI*f0/fs, al=Math.sin(w)/(2*Q), c=Math.cos(w), a0=1+al; return {b:[1/a0,-2*c/a0,1/a0],a:[1,-2*c/a0,(1-al)/a0]}; }
const power=a=>a.reduce((s,x)=>s+x*x,0)/a.length;
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const stdev=a=>{ const m=mean(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/Math.max(1,a.length-1)); };
function pulseShape(p){ p=((p%1)+1)%1; const up=p<0.15?Math.exp(-(((p-0.15)/0.05)**2)):Math.exp(-(((p-0.15)/0.16)**2)); return (up+0.25*Math.exp(-(((p-0.45)/0.06)**2)))/1.0; }
function ecgBeat(t,A){ const g=(c,w,h)=>h*Math.exp(-(((t-c)/w)**2)); return g(0.2,0.025,0.15*A)+g(0.33,0.01,-0.1*A)+g(0.35,0.012,A)+g(0.37,0.01,-0.2*A)+g(0.6,0.045,0.3*A); }
const NTC=(T,R25,beta)=>R25*Math.exp(beta*(1/(T+273.15)-1/298.15));

  function upd(v){
    const n=+v.n, Vr=+v.vr, S=0.01*v.G, LSB=Vr/Math.pow(2,n), res=LSB/S, Tmax=Vr/S;
    const q=T=>{ const V=clamp(T*S,0,Vr-LSB); return Math.floor(V/LSB+0.5)*LSB/S; };
    const t=[],yi=[],yq=[]; for(let i=0;i<=1200;i++){ const T=30+15*i/1200; t.push(T); yi.push(T); yq.push(q(T+v.off)); }
    P(root,'p1',{series:[{x:t,y:yi,color:'s6',dash:[6,4],label:'ideal'},{x:t,y:yq,color:'s1',label:'lectura digital'}],xlabel:'temperatura real (°C)',ylabel:'lectura (°C)'});
    const g=gaussGen(11), xs=[],rd=[]; for(let i=0;i<60;i++){ xs.push(i+1); rd.push(q(37+v.off+v.sd*g())); }
    const m=mean(rd), s=stdev(rd);
    P(root,'p2',{series:[{x:xs,y:rd,dots:true,r:3,color:'s2',label:'lecturas'}],hlines:[{y:37,color:'s3',label:'37,0 real'},{y:m,color:'s2',dash:[3,3],label:'promedio'}],xlabel:'n.º de lectura',ylabel:'°C'});
    $('#kpis',root).innerHTML=kpi('Resolución',fmt(res,4)+' °C')+kpi('Temperatura máxima medible',fmt(Tmax,1)+' °C')+kpi('Exactitud (error del promedio)',fmt(Math.abs(m-37),3)+' °C')+kpi('Precisión (σ)',fmt(s,3)+' °C');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Sensibilidad total',`<span class="m">S·G</span> = 10 mV/°C · ${fmt(v.G,1)} = ${B(fmt(S*1000,1)+' mV/°C')}`)}
      ${step('2. Tamaño del LSB',`LSB = ${fr(fmt(Vr,1)+' V','2<sup>'+n+'</sup>')} = ${B(fmt(LSB*1000,4)+' mV')}`)}
      ${step('3. Resolución en temperatura',`${fr(fmt(LSB*1000,4)+' mV',fmt(S*1000,1)+' mV/°C')} = ${B(fmt(res,4)+' °C')}`)}
      ${step('4. Rango antes de saturar',`<span class="m">T</span><sub>máx</sub> = ${fr(fmt(Vr,1),fmt(S,3))} = ${B(fmt(Tmax,1)+' °C')}`)}
      ${step('5. Código del ADC para 37 °C',`${fr(fmt(37*S,3)+' V',fmt(LSB*1000,3)+' mV')} ≈ ${B(String(Math.round(Math.min(37*S,Vr)/LSB)))}`)}
      ${step('6. Lecturas a 37 °C',`<span class="m">x̄</span> = ${B(fmt(m,3)+' °C')} &nbsp; <span class="m">σ</span> = ${B(fmt(s,3)+' °C')}`)}
    </div>${Tmax<42?'<p class="note alert">El rango no cubre la fiebre alta (42 °C). Hay que bajar la ganancia o subir Vref.</p>':''}${res>0.1?'<p class="note alert">La resolución es peor que 0,1 °C, que es lo mínimo esperado en un termómetro clínico.</p>':''}`;
  }
  ctl.fire();
}};

MODS.m12={unit:1,code:'1.2',title:'Tipos de sensores',nav:'Tipos de sensores',
init(root){
  root.innerHTML=layout({unit:1,code:'1.2',title:this.title,
    lead:'Los sensores se clasifican por el principio físico que usan y por si necesitan o no energía externa. Cada principio tiene una curva de respuesta distinta: unas casi rectas, otras muy curvas pero muy sensibles.',
    caso:'Medir la temperatura corporal con tres sensores distintos (RTD Pt100, termistor NTC, termopar tipo K) y medir el movimiento del tórax con un sensor capacitivo de placas paralelas en una banda respiratoria.',
    theory:`<div class="tbl"><table><tr><th>Principio</th><th>Ejemplo biomédico</th><th>Tipo</th></tr>
    <tr><td>Resistivo</td><td>RTD, termistor, galga, potenciómetro</td><td>pasivo</td></tr>
    <tr><td>Capacitivo</td><td>banda respiratoria, presión, humedad</td><td>pasivo</td></tr>
    <tr><td>Inductivo</td><td>LVDT, pletismografía por inductancia</td><td>pasivo</td></tr>
    <tr><td>Piezoeléctrico</td><td>ultrasonido, impacto, pulso</td><td>activo</td></tr>
    <tr><td>Termoeléctrico</td><td>termopar</td><td>activo</td></tr>
    <tr><td>Óptico</td><td>oxímetro (fotodiodo), fibra óptica</td><td>pasivo/activo</td></tr>
    <tr><td>Electroquímico</td><td>glucómetro, electrodos de ECG</td><td>activo</td></tr></table></div>
    <p>Un sensor <b>activo</b> genera su propia señal (termopar, piezo). Uno <b>pasivo</b> cambia una propiedad (R, C, L) y necesita una excitación externa para leerla.</p>`,
    formulas: eq(`<span class="m">R</span>(<span class="m">T</span>) = <span class="m">R</span><sub>0</sub>(1 + <span class="m">αT</span>)`,'Pt100, α = 0,00385 /°C')+
      eq(`<span class="m">R</span>(<span class="m">T</span>) = <span class="m">R</span><sub>25</sub> e<sup><span class="m">β</span>(1/<span class="m">T</span> − 1/298,15)</sup>`,'NTC, T en K')+
      eq(`<span class="m">α</span><sub>NTC</sub> = −${fr('<span class="m">β</span>','<span class="m">T</span>²')}`)+
      eq(`<span class="m">V</span> = <span class="m">S</span><sub>AB</sub>(<span class="m">T</span> − <span class="m">T</span><sub>ref</sub>)`,'termopar K ≈ 41 µV/°C')+
      eq(`<span class="m">C</span> = ${fr('<span class="m">ε</span><sub>0</sub><span class="m">ε</span><sub>r</sub><span class="m">A</span>','<span class="m">d</span>')} &nbsp; ${fr('d<span class="m">C</span>','d<span class="m">d</span>')} = −${fr('<span class="m">C</span>','<span class="m">d</span>')}`),
    plots:[{id:'p1',cap:'Curva de transferencia del sensor elegido'},{id:'p2',cap:'Comparación de linealidad (salida normalizada, 0 a 100 °C)',cls:'short'}],
    practice:[
      ['¿Cuánto cambia la resistencia de un Pt100 entre 36 y 38 °C?','ΔR = 100·0,00385·2 = 0,77 Ω. Es poco: por eso el Pt100 se lee con puente o fuente de corriente de precisión.'],
      ['Un NTC de 10 kΩ con β = 3950, ¿qué sensibilidad relativa tiene a 37 °C?','α = −3950/310,15² = −4,1 %/°C, unas 11 veces más que un Pt100. A cambio es muy poco lineal.'],
      ['¿Por qué un termopar necesita compensación de unión fría?','Porque mide diferencia de temperatura entre la punta y los terminales. Si los terminales cambian de temperatura, cambia la lectura.']]
  });
  const ctl=makeControls($('#ctl',root),'s12',[
    {type:'seg',id:'s',label:'Sensor',options:[['pt','Pt100'],['ntc','NTC'],['tc','Termopar K'],['cap','Capacitivo']],value:'ntc'},
    {id:'T',label:'Temperatura medida',min:-20,max:120,step:0.5,value:37,unit:'°C',dec:1,showIf:v=>v.s!=='cap'},
    {id:'R25',label:'R<sub>25</sub> del NTC',min:1,max:100,step:1,value:10,unit:'kΩ',dec:0,showIf:v=>v.s==='ntc'},
    {id:'beta',label:'β del NTC',min:3000,max:4500,step:10,value:3950,unit:'K',dec:0,showIf:v=>v.s==='ntc'},
    {id:'Tr',label:'Temperatura de la unión fría',min:0,max:40,step:0.5,value:25,unit:'°C',dec:1,showIf:v=>v.s==='tc'},
    {id:'A',label:'Área de las placas A',min:1,max:20,step:0.5,value:4,unit:'cm²',dec:1,showIf:v=>v.s==='cap'},
    {id:'d',label:'Separación d (cambia al respirar)',min:0.1,max:2,step:0.01,value:0.5,unit:'mm',dec:2,showIf:v=>v.s==='cap'},
    {id:'er',label:'Permitividad relativa ε<sub>r</sub> del dieléctrico',min:1,max:10,step:0.1,value:3,dec:1,showIf:v=>v.s==='cap'}],upd);
  function upd(v){
    const xs=[],ys=[]; let pt,unitY,html,kp;
    if(v.s==='cap'){
      const e0=8.854e-12, A=v.A/1e4, C=d=>e0*v.er*A/(d/1000)*1e12;
      for(let i=0;i<=400;i++){ const d=0.1+1.9*i/400; xs.push(d); ys.push(C(d)); }
      const c0=C(v.d), sens=-c0/v.d;
      P(root,'p1',{series:[{x:xs,y:ys,color:'s1',label:'C(d)'}],points:[{x:v.d,y:c0,color:'s2',text:fmt(c0,1)+' pF'}],xlabel:'separación d (mm)',ylabel:'C (pF)',yzero:true});
      $('#kpis',root).innerHTML=kpi('Capacitancia',fmt(c0,2)+' pF')+kpi('Sensibilidad dC/dd',fmt(sens,2)+' pF/mm')+kpi('Tipo',pill('ok','pasivo, capacitivo'))+kpi('Linealidad',pill('warn','hiperbólica'));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Capacitancia',`<span class="m">C</span> = ${fr('8,854×10<sup>−12</sup>·'+fmt(v.er,1)+'·'+sci(A),sci(v.d/1000))} = ${B(fmt(c0,2)+' pF')}`)}
        ${step('2. Sensibilidad',`${fr('d<span class="m">C</span>','d<span class="m">d</span>')} = −${fr(fmt(c0,2),fmt(v.d,2))} = ${B(fmt(sens,2)+' pF/mm')}`)}
        ${step('3. Si al inspirar d sube 10 %',`Δ<span class="m">C</span> = ${B(fmt(C(v.d*1.1)-c0,2)+' pF')}`)}
      </div><p class="note">La sensibilidad crece mucho con placas cercanas. Para linealizar se usa la configuración diferencial o se mide la impedancia 1/(jωC), que sí es proporcional a d.</p>`;
    } else {
      let f,lab;
      if(v.s==='pt'){ f=T=>100*(1+0.00385*T); lab='R (Ω)'; }
      else if(v.s==='ntc'){ f=T=>NTC(T,v.R25*1000,v.beta)/1000; lab='R (kΩ)'; }
      else { f=T=>0.041*(T-v.Tr); lab='V (mV)'; }
      for(let i=0;i<=400;i++){ const T=-20+140*i/400; xs.push(T); ys.push(f(T)); }
      const y0=f(v.T), sl=(f(v.T+0.05)-f(v.T-0.05))/0.1;
      P(root,'p1',{series:[{x:xs,y:ys,color:'s1',label:lab}],points:[{x:v.T,y:y0,color:'s2',text:fmt(y0,3)}],xlabel:'temperatura (°C)',ylabel:lab});
      if(v.s==='pt'){ $('#kpis',root).innerHTML=kpi('Resistencia',fmt(y0,3)+' Ω')+kpi('Sensibilidad',fmt(sl,3)+' Ω/°C')+kpi('Sensibilidad relativa',fmt(sl/y0*100,3)+' %/°C')+kpi('Tipo',pill('ok','pasivo, muy lineal'));
        $('#calc',root).innerHTML=`<div class="steps">${step('1. Resistencia',`<span class="m">R</span> = 100(1 + 0,00385·${fmt(v.T,1)}) = ${B(fmt(y0,3)+' Ω')}`)}${step('2. Sensibilidad',`d<span class="m">R</span>/d<span class="m">T</span> = <span class="m">R</span><sub>0</sub><span class="m">α</span> = ${B('0,385 Ω/°C')}`)}${step('3. Con 1 mA de excitación',`<span class="m">V</span> = ${B(fmt(y0,2)+' mV')}, cambia 0,385 mV/°C`)}</div>`; }
      else if(v.s==='ntc'){ const Tk=v.T+273.15, al=-v.beta/Tk/Tk;
        $('#kpis',root).innerHTML=kpi('Resistencia',fmt(y0,3)+' kΩ')+kpi('Sensibilidad',fmt(sl*1000,1)+' Ω/°C')+kpi('Sensibilidad relativa',fmt(al*100,2)+' %/°C')+kpi('Tipo',pill('warn','pasivo, no lineal'));
        $('#calc',root).innerHTML=`<div class="steps">${step('1. Temperatura en kelvin',`<span class="m">T</span> = ${fmt(v.T,1)} + 273,15 = ${B(fmt(Tk,2)+' K')}`)}${step('2. Resistencia (modelo β)',`<span class="m">R</span> = ${fmt(v.R25,0)} kΩ · e<sup>${fmt(v.beta,0)}(1/${fmt(Tk,2)} − 1/298,15)</sup> = ${B(fmt(y0,3)+' kΩ')}`)}${step('3. Coeficiente de temperatura',`<span class="m">α</span> = −${fr(fmt(v.beta,0),fmt(Tk,2)+'²')} = ${B(fmt(al*100,3)+' %/°C')}`)}${step('4. Sensibilidad absoluta',`<span class="m">α·R</span> = ${B(fmt(al*y0*1000,1)+' Ω/°C')}`)}</div>`; }
      else { $('#kpis',root).innerHTML=kpi('Voltaje',fmt(y0,3)+' mV')+kpi('Sensibilidad',fmt(41,0)+' µV/°C')+kpi('Error si la unión fría sube 5 °C',fmt(-5,0)+' °C')+kpi('Tipo',pill('ok','activo'));
        $('#calc',root).innerHTML=`<div class="steps">${step('1. Voltaje termoeléctrico',`<span class="m">V</span> = 41 µV/°C·(${fmt(v.T,1)} − ${fmt(v.Tr,1)}) = ${B(fmt(y0*1000,0)+' µV')}`)}${step('2. Ganancia necesaria para 10 mV/°C',`<span class="m">G</span> = ${fr('10 mV','41 µV')} = ${B('244')}`)}</div><p class="note">El voltaje es muy pequeño: un termopar casi nunca se usa en temperatura corporal; sí en hornos, esterilizadores y autoclaves.</p>`; }
    }
    const T0=[],a=[],b=[],c=[]; const nt=T=>{ const r=NTC(T,10000,3950); return (NTC(0,10000,3950)-r)/(NTC(0,10000,3950)-NTC(100,10000,3950)); };
    for(let i=0;i<=200;i++){ const T=i/2; T0.push(T); a.push(T/100); b.push(nt(T)); c.push(T/100); }
    P(root,'p2',{series:[{x:T0,y:a,color:'s1',label:'Pt100 y termopar (casi rectos)'},{x:T0,y:b,color:'s2',label:'NTC'},{x:T0,y:c,color:'s6',dash:[4,4],label:'recta ideal'}],xlabel:'temperatura (°C)',ylabel:'salida normalizada'});
  }
  ctl.fire();
}};

MODS.m13={unit:1,code:'1.3',title:'Dispositivos basados en sensores',nav:'Dispositivos basados en sensores',
init(root){
  root.innerHTML=layout({unit:1,code:'1.3',title:this.title,
    lead:'Un dispositivo junta el sensor con su circuito de acondicionamiento, la conversión digital y la lógica de alarma. El diseño del acondicionamiento decide si el equipo es útil en el rango clínico.',
    caso:'Termómetro para incubadora o monitor con un NTC en divisor de voltaje leído por el ADC de un microcontrolador. La pregunta de diseño es qué resistencia fija poner para que el sensor sea más sensible justo alrededor de 37 °C, y cuánta corriente se puede pasar sin que el propio NTC se caliente.',
    theory:`<p>El divisor de voltaje es el acondicionamiento más simple para un sensor resistivo. La salida es máxima en pendiente cuando la resistencia fija iguala a la del sensor en el punto de operación. Por eso para 37 °C se elige <span class="m">R<sub>fija</sub> = R<sub>NTC</sub>(37 °C)</span>.</p>
    <p><b>Autocalentamiento.</b> La corriente que atraviesa el NTC disipa potencia <span class="m">P = I²R</span> y lo calienta por encima del paciente. Con la constante de disipación δ (mW/°C) el error es <span class="m">P/δ</span>.</p>
    <div class="tbl"><table><tr><th>Equipo</th><th>Mensurando</th><th>Sensor</th></tr>
    <tr><td>Monitor de signos vitales</td><td>ECG, SpO₂, PANI, T</td><td>electrodos, fotodiodo, piezorresistivo, NTC</td></tr>
    <tr><td>Incubadora neonatal</td><td>T aire y piel, humedad</td><td>NTC, capacitivo</td></tr>
    <tr><td>Ventilador mecánico</td><td>flujo, presión, O₂</td><td>hilo caliente, diferencial, galvánico</td></tr>
    <tr><td>Bomba de infusión</td><td>presión de línea, burbujas</td><td>galga, ultrasonido</td></tr>
    <tr><td>Glucómetro</td><td>glucosa</td><td>electroquímico (amperométrico)</td></tr></table></div>`,
    formulas: eq(`<span class="m">V</span><sub>out</sub> = <span class="m">V</span><sub>cc</sub>${fr('<span class="m">R</span><sub>fija</sub>','<span class="m">R</span><sub>fija</sub> + <span class="m">R</span><sub>NTC</sub>')}`,'NTC arriba')+
      eq(`${fr('d<span class="m">V</span>','d<span class="m">T</span>')} = −<span class="m">V</span><sub>cc</sub>${fr('<span class="m">R</span><sub>fija</sub>','(<span class="m">R</span><sub>fija</sub>+<span class="m">R</span>)²')}${fr('d<span class="m">R</span>','d<span class="m">T</span>')}`)+
      eq(`Óptimo: <span class="m">R</span><sub>fija</sub> = <span class="m">R</span><sub>NTC</sub>(<span class="m">T</span><sub>0</sub>)`)+
      eq(`Δ<span class="m">T</span><sub>auto</sub> = ${fr('<span class="m">I</span>²<span class="m">R</span>','<span class="m">δ</span>')}`)+
      eq(`Resolución = ${fr('LSB','|d<span class="m">V</span>/d<span class="m">T</span>|')}`),
    plots:[{id:'p1',cap:'Voltaje del divisor vs. temperatura'}],
    practice:[
      ['NTC de 10 kΩ (β = 3950). ¿Qué R fija maximiza la sensibilidad a 37 °C?','R(37 °C) = 10k·e<sup>3950(1/310,15 − 1/298,15)</sup> ≈ 5,98 kΩ. Se usa el valor comercial más cercano, 6,2 kΩ.'],
      ['Con 3,3 V y R = 6 kΩ, ¿cuánto se autocalienta un NTC con δ = 1,5 mW/°C?','I = 3,3/12k = 0,275 mA; P = I²·6k = 0,45 mW; ΔT = 0,3 °C. Es mucho para un termómetro clínico: hay que bajar la excitación.'],
      ['¿Por qué un ADC de 12 bits mejora el termómetro aunque el sensor sea el mismo?','Porque el LSB baja de 3,2 mV a 0,8 mV y la resolución en °C mejora 4 veces.']]
  });
  const ctl=makeControls($('#ctl',root),'s13',[
    {type:'seg',id:'vcc',label:'Alimentación',options:[['3.3','3,3 V'],['5','5 V']],value:'3.3'},
    {id:'Rf',label:'Resistencia fija',min:1,max:100,value:10,log:true,unit:'kΩ'},
    {id:'R25',label:'R<sub>25</sub> del NTC',min:1,max:100,step:1,value:10,unit:'kΩ',dec:0},
    {id:'beta',label:'β',min:3000,max:4500,step:10,value:3950,unit:'K',dec:0},
    {type:'seg',id:'n',label:'ADC',options:[['10','10 bits'],['12','12 bits']],value:'10'},
    {id:'dl',label:'Constante de disipación δ',min:0.5,max:5,step:0.1,value:1.5,unit:'mW/°C',dec:1}],upd);
  function upd(v){
    const Vcc=+v.vcc, Rf=v.Rf*1000, R=T=>NTC(T,v.R25*1000,v.beta), Ropt=R(37);
    const Vo=(T,rf)=>Vcc*rf/(rf+R(T));
    const t=[],a=[],b=[]; for(let i=0;i<=300;i++){ const T=20+25*i/300; t.push(T); a.push(Vo(T,Rf)); b.push(Vo(T,Ropt)); }
    const sens=(Vo(37.05,Rf)-Vo(36.95,Rf))/0.1, sOpt=(Vo(37.05,Ropt)-Vo(36.95,Ropt))/0.1;
    const LSB=Vcc/Math.pow(2,+v.n), res=LSB/Math.abs(sens);
    const I=Vcc/(Rf+Ropt), Pw=I*I*Ropt, dT=Pw*1000/v.dl;
    P(root,'p1',{series:[{x:t,y:b,color:'s6',dash:[6,4],label:'R fija óptima ('+fmt(Ropt/1000,2)+' kΩ)'},{x:t,y:a,color:'s1',label:'tu diseño'}],vlines:[{x:37,color:'s3',label:'37 °C'}],points:[{x:37,y:Vo(37,Rf),color:'s2'}],xlabel:'temperatura (°C)',ylabel:'V_out (V)'});
    $('#kpis',root).innerHTML=kpi('Sensibilidad a 37 °C',fmt(sens*1000,2)+' mV/°C')+kpi('Frente al óptimo',fmt(sens/sOpt*100,1)+' %')+kpi('Resolución',fmt(res,3)+' °C')+kpi('Autocalentamiento',fmt(dT,3)+' °C');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Resistencia del NTC a 37 °C',`<span class="m">R</span> = ${fmt(v.R25,0)} kΩ·e<sup>${fmt(v.beta,0)}(1/310,15 − 1/298,15)</sup> = ${B(fmt(Ropt/1000,3)+' kΩ')}`)}
      ${step('2. Voltaje a 37 °C',`<span class="m">V</span> = ${fmt(Vcc,1)}·${fr(fmt(Rf/1000,2),fmt(Rf/1000,2)+' + '+fmt(Ropt/1000,2))} = ${B(fmt(Vo(37,Rf),4)+' V')}`)}
      ${step('3. Sensibilidad en el punto de operación',`|d<span class="m">V</span>/d<span class="m">T</span>| = ${B(fmt(Math.abs(sens)*1000,2)+' mV/°C')}`)}
      ${step('4. Resolución con el ADC',`${fr(fmt(LSB*1000,3)+' mV',fmt(Math.abs(sens)*1000,2)+' mV/°C')} = ${B(fmt(res,3)+' °C')}`)}
      ${step('5. Corriente y potencia en el NTC',`<span class="m">I</span> = ${B(fmt(I*1000,3)+' mA')} &nbsp; <span class="m">P</span> = <span class="m">I</span>²<span class="m">R</span> = ${B(fmt(Pw*1000,3)+' mW')}`)}
      ${step('6. Error por autocalentamiento',`Δ<span class="m">T</span> = ${fr(fmt(Pw*1000,3),fmt(v.dl,1))} = ${B(fmt(dT,3)+' °C')}`)}
    </div>${dT>0.1?'<p class="note alert">El autocalentamiento supera 0,1 °C. Sube la resistencia fija, baja la alimentación o excita el divisor solo en el instante de medir.</p>':''}`;
  }
  ctl.fire();
}};

MODS.m21={unit:2,code:'2.1',title:'Calibración',nav:'Calibración',
init(root){
  root.innerHTML=layout({unit:2,code:'2.1',title:this.title,
    lead:'Calibrar es comparar las lecturas del sensor con un patrón de referencia y obtener la ecuación que corrige los errores sistemáticos. El método de mínimos cuadrados da la recta que mejor se ajusta.',
    caso:'Calibración de un transductor de presión para monitor de signos vitales, de 0 a 300 mmHg, contra un manómetro patrón. Se aplican N presiones conocidas y se anota la lectura del equipo.',
    theory:`<p>El sensor real tiene error de <b>offset</b> (marca algo con presión cero), error de <b>ganancia</b> (pendiente distinta de 1), <b>no linealidad</b> (la curva no es recta) y <b>ruido</b>. La calibración corrige los dos primeros; la no linealidad y el ruido quedan como error residual y definen la incertidumbre.</p>
    <p>Con los pares (patrón x<sub>i</sub>, lectura y<sub>i</sub>) se ajusta <span class="m">y = m·x + b</span>. Luego la ecuación de corrección es la inversa: <span class="m">x = (y − b)/m</span>. El coeficiente R² indica qué tan bien explica la recta los datos, pero el dato que importa en clínica es el residuo máximo.</p>
    <p>La norma de esfigmomanómetros pide error máximo de ±3 mmHg; ese es el criterio que usa el simulador.</p>`,
    formulas: eq(`<span class="m">m</span> = ${fr('<span class="m">N</span>Σ<span class="m">xy</span> − Σ<span class="m">x</span>Σ<span class="m">y</span>','<span class="m">N</span>Σ<span class="m">x</span>² − (Σ<span class="m">x</span>)²')}`)+
      eq(`<span class="m">b</span> = ${fr('Σ<span class="m">y</span> − <span class="m">m</span>Σ<span class="m">x</span>','<span class="m">N</span>')}`)+
      eq(`<span class="m">R</span>² = 1 − ${fr('Σ(<span class="m">y</span><sub>i</sub> − <span class="m">ŷ</span><sub>i</sub>)²','Σ(<span class="m">y</span><sub>i</sub> − <span class="m">ȳ</span>)²')}`)+
      eq(`<span class="m">s</span> = ${sq(fr('Σ<span class="m">r</span><sub>i</sub>²','<span class="m">N</span> − 2'))}`,'error típico')+
      eq(`No linealidad = ${fr('máx|<span class="m">r</span><sub>i</sub>|','FS')}·100 %`),
    plots:[{id:'p1',cap:'Lectura del equipo vs. patrón'},{id:'p2',cap:'Residuos después de calibrar',cls:'short'}],
    practice:[
      ['Un equipo marca 3 mmHg a presión cero y 309 mmHg con 300 mmHg. ¿Cuál es la ecuación de corrección con dos puntos?','m = (309 − 3)/300 = 1,02; b = 3. Corrección: P = (lectura − 3)/1,02.'],
      ['¿Por qué no basta con dos puntos?','Con dos puntos la recta pasa exactamente por ellos y no se detecta no linealidad ni ruido. Con más puntos se ven los residuos y se estima la incertidumbre.'],
      ['R² = 0,9999 pero el residuo máximo es 4 mmHg. ¿El equipo pasa?','No. R² alto solo dice que la tendencia es recta; el error clínico de 4 mmHg supera el ±3 mmHg permitido.']]
  });
  const ctl=makeControls($('#ctl',root),'s21',[
    {id:'ge',label:'Error de ganancia',min:-10,max:10,step:0.5,value:4,unit:'%',dec:1},
    {id:'of',label:'Error de offset',min:-10,max:10,step:0.5,value:3,unit:'mmHg',dec:1},
    {id:'nl',label:'No linealidad (curvatura)',min:0,max:3,step:0.1,value:0.8,unit:'% FS',dec:1},
    {id:'sd',label:'Ruido σ',min:0,max:3,step:0.1,value:0.8,unit:'mmHg',dec:1},
    {id:'N',label:'Número de puntos de calibración',min:3,max:15,step:1,value:7,dec:0}],upd);
  function upd(v){
    const FS=300, N=Math.round(v.N), g=gaussGen(5), xs=[],ys=[];
    for(let i=0;i<N;i++){ const x=FS*i/(N-1), u=x/FS; xs.push(x); ys.push(x*(1+v.ge/100)+v.of+4*v.nl/100*FS*u*(1-u)+v.sd*g()); }
    let Sx=0,Sy=0,Sxy=0,Sxx=0; for(let i=0;i<N;i++){ Sx+=xs[i];Sy+=ys[i];Sxy+=xs[i]*ys[i];Sxx+=xs[i]*xs[i]; }
    const m=(N*Sxy-Sx*Sy)/(N*Sxx-Sx*Sx), b=(Sy-m*Sx)/N, yb=Sy/N;
    const res=ys.map((y,i)=>y-(m*xs[i]+b)); const SSr=res.reduce((s,r)=>s+r*r,0), SSt=ys.reduce((s,y)=>s+(y-yb)**2,0);
    const R2=1-SSr/SSt, s=N>2?Math.sqrt(SSr/(N-2)):0, rmax=Math.max(...res.map(Math.abs)), errP=res.map(r=>r/m), emax=rmax/m;
    const lx=[0,FS];
    P(root,'p1',{series:[{x:lx,y:lx,color:'s6',dash:[6,4],label:'ideal (lectura = patrón)'},{x:lx,y:lx.map(x=>m*x+b),color:'s1',label:'recta ajustada'}],points:xs.map((x,i)=>({x,y:ys[i],shape:'dot',color:'s2',size:4})),legend:[{color:'s2',label:'puntos medidos'}],xlabel:'presión patrón (mmHg)',ylabel:'lectura (mmHg)'});
    P(root,'p2',{series:[{x:xs,y:errP,color:'s2',width:1.2,dash:[3,3]}],points:xs.map((x,i)=>({x,y:errP[i],shape:'dot',color:'s2',size:4})),hlines:[{y:3,color:'s4',label:'+3 mmHg'},{y:-3,color:'s4',label:'−3 mmHg'},{y:0,color:'s6'}],xlabel:'presión patrón (mmHg)',ylabel:'error corregido (mmHg)'});
    const ok=emax<=3;
    $('#kpis',root).innerHTML=kpi('Pendiente m',fmt(m,4))+kpi('Offset b',fmt(b,2)+' mmHg')+kpi('R²',fmt(R2,5))+kpi('Error máximo tras calibrar',fmt(emax,2)+' mmHg '+(ok?pill('ok','cumple'):pill('bad','no cumple')));
    const rows=xs.map((x,i)=>`<tr><td class="mono">${fmt(x,1)}</td><td class="mono">${fmt(ys[i],2)}</td><td class="mono">${fmt((ys[i]-b)/m,2)}</td><td class="mono">${fmt(errP[i],2)}</td></tr>`).join('');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Sumatorias',`Σ<span class="m">x</span> = ${fmt(Sx,1)} &nbsp; Σ<span class="m">y</span> = ${fmt(Sy,1)} &nbsp; Σ<span class="m">xy</span> = ${fmt(Sxy,0)} &nbsp; Σ<span class="m">x</span>² = ${fmt(Sxx,0)}`)}
      ${step('2. Pendiente',`<span class="m">m</span> = ${fr(N+'·'+fmt(Sxy,0)+' − '+fmt(Sx,1)+'·'+fmt(Sy,1),N+'·'+fmt(Sxx,0)+' − '+fmt(Sx,1)+'²')} = ${B(fmt(m,5))}`)}
      ${step('3. Intercepto',`<span class="m">b</span> = ${fr(fmt(Sy,1)+' − '+fmt(m,4)+'·'+fmt(Sx,1),String(N))} = ${B(fmt(b,3)+' mmHg')}`)}
      ${step('4. Ecuación de corrección',`<span class="m">P</span><sub>real</sub> = ${fr('lectura − '+fmt(b,3),fmt(m,5))}`)}
      ${step('5. Calidad del ajuste',`<span class="m">R</span>² = ${B(fmt(R2,6))} &nbsp; <span class="m">s</span> = ${B(fmt(s,3)+' mmHg')}`)}
      ${step('6. No linealidad respecto a FS',`${fr(fmt(rmax,2),'300')}·100 = ${B(fmt(rmax/FS*100,3)+' % FS')}`)}
    </div><div class="tbl" style="margin-top:10px"><table><tr><th>Patrón</th><th>Lectura</th><th>Lectura corregida</th><th>Error</th></tr>${rows}</table></div>`;
  }
  ctl.fire();
}};

MODS.m22={unit:2,code:'2.2',title:'Relación señal a ruido y muestreo',nav:'Relación señal a ruido',
init(root){
  root.innerHTML=layout({unit:2,code:'2.2',title:this.title,
    lead:'La relación señal a ruido (SNR) compara la potencia de lo que queremos medir con la de lo que estorba. Se mejora filtrando lo que está fuera de la banda de la señal y muestreando lo bastante rápido para no crear frecuencias falsas.',
    caso:'Electrocardiograma de un monitor contaminado por ruido muscular (blanco) y por la red eléctrica de 60 Hz. Se aplica un filtro pasa bajas y un filtro notch. En el segundo modo se ve el efecto de muestrear por debajo de Nyquist.',
    theory:`<p>La SNR se expresa en decibelios. Con potencias: <span class="m">10·log(P<sub>s</sub>/P<sub>n</sub>)</span>; con amplitudes RMS: <span class="m">20·log(V<sub>s</sub>/V<sub>n</sub>)</span>. Cada 6 dB equivale a duplicar la relación de amplitudes.</p>
    <p>El ruido de 60 Hz entra por acople capacitivo con la red. Se reduce con buen apantallamiento, amplificador de instrumentación con alto CMRR, pierna derecha activa y, al final, un notch. El ruido blanco se reduce con pasa bajas, pero si la frecuencia de corte es muy baja se deforma el QRS.</p>
    <p><b>Teorema de Nyquist.</b> Para reconstruir una señal hay que muestrear a más del doble de su máxima frecuencia. Si no, aparece una frecuencia falsa (alias) en <span class="m">|f − k·f<sub>s</sub>|</span>.</p>
    <div class="tbl"><table><tr><th>Señal</th><th>Banda útil</th><th>f<sub>s</sub> típica</th></tr><tr><td>ECG diagnóstico</td><td>0,05–150 Hz</td><td>500 Hz</td></tr><tr><td>PPG / oximetría</td><td>0,5–10 Hz</td><td>100 Hz</td></tr><tr><td>Respiración</td><td>0,1–2 Hz</td><td>25–50 Hz</td></tr><tr><td>Flujo de ventilador</td><td>0–20 Hz</td><td>100–200 Hz</td></tr><tr><td>Temperatura</td><td>&lt; 0,1 Hz</td><td>1 Hz</td></tr><tr><td>EMG</td><td>20–500 Hz</td><td>1–2 kHz</td></tr></table></div>`,
    formulas: eq(`SNR<sub>dB</sub> = 10 log<sub>10</sub>${fr('<span class="m">P</span><sub>señal</sub>','<span class="m">P</span><sub>ruido</sub>')} = 20 log<sub>10</sub>${fr('<span class="m">V</span><sub>s,rms</sub>','<span class="m">V</span><sub>n,rms</sub>')}`)+
      eq(`Promediar <span class="m">N</span> veces: SNR ↑ 10 log<sub>10</sub><span class="m">N</span>`)+
      eq(`<span class="m">f</span><sub>s</sub> > 2<span class="m">f</span><sub>máx</sub>`,'Nyquist')+
      eq(`<span class="m">f</span><sub>alias</sub> = |<span class="m">f</span> − <span class="m">k f</span><sub>s</sub>|`,'k entero más cercano a f/fs')+
      eq(`<span class="m">H</span><sub>notch</sub>(<span class="m">z</span>) = ${fr('1 − 2cos<span class="m">ω</span><sub>0</sub><span class="m">z</span><sup>−1</sup> + <span class="m">z</span><sup>−2</sup>','1 − 2<span class="m">r</span>cos<span class="m">ω</span><sub>0</sub><span class="m">z</span><sup>−1</sup> + <span class="m">r</span>²<span class="m">z</span><sup>−2</sup>')}`),
    plots:[{id:'p1',cap:'Señal adquirida'},{id:'p2',cap:'Señal procesada',cls:'short'}],
    practice:[
      ['Un ECG de 1 mV RMS tiene 0,1 mV RMS de ruido. ¿Cuál es la SNR?','20·log(1/0,1) = 20 dB.'],
      ['Un pulso de 30 Hz se muestrea a 50 Hz. ¿Qué frecuencia aparece?','f/fs = 0,6 → k = 1. Alias = |30 − 50| = 20 Hz.'],
      ['¿Por qué no se pone el pasa bajas en 15 Hz para limpiar más el ECG?','Porque el QRS tiene componentes hasta 40 Hz o más. Se recortaría la onda R y se alterarían mediciones del segmento ST y del QRS.']]
  });
  const ctl=makeControls($('#ctl',root),'s22',[
    {type:'seg',id:'mode',label:'Modo',options:[['ecg','Ruido en el ECG'],['nyq','Muestreo y aliasing']],value:'ecg'},
    {id:'A',label:'Amplitud de la onda R',min:0.5,max:3,step:0.1,value:1,unit:'mV',dec:1,showIf:v=>v.mode==='ecg'},
    {id:'wn',label:'Ruido blanco σ (muscular)',min:0,max:0.3,step:0.01,value:0.08,unit:'mV',dec:2,showIf:v=>v.mode==='ecg'},
    {id:'ln',label:'Interferencia de 60 Hz',min:0,max:1,step:0.02,value:0.3,unit:'mV',dec:2,showIf:v=>v.mode==='ecg'},
    {id:'fc',label:'Corte del pasa bajas',min:5,max:150,step:1,value:40,unit:'Hz',dec:0,showIf:v=>v.mode==='ecg'},
    {type:'check',id:'notch',label:'Filtro notch de 60 Hz',value:true,showIf:v=>v.mode==='ecg'},
    {id:'f',label:'Frecuencia de la señal',min:1,max:100,step:0.5,value:30,unit:'Hz',dec:1,showIf:v=>v.mode==='nyq'},
    {id:'fs',label:'Frecuencia de muestreo f<sub>s</sub>',min:10,max:300,step:1,value:50,unit:'Hz',dec:0,showIf:v=>v.mode==='nyq'}],upd);
  function upd(v){
    if(v.mode==='ecg'){
      const fs=500, T=3, n=fs*T, RR=60/72, g=gaussGen(3), t=[],cl=[],x=[];
      for(let i=0;i<n;i++){ const ti=i/fs; t.push(ti); const c=ecgBeat(ti%RR,v.A); cl.push(c); x.push(c+v.wn*g()+v.ln*Math.sin(2*PI*60*ti)); }
      const proc=a=>{ let y=biquad(a,lpCoef(v.fc,fs)); if(v.notch) y=biquad(y,notchCoef(60,fs)); return y; };
      const y=proc(x), cf=proc(cl);
      const skip=200, sl=a=>a.slice(skip);
      const nIn=sl(x).map((s,i)=>s-sl(cl)[i]), nOut=sl(y).map((s,i)=>s-sl(cf)[i]);
      const snrIn=10*Math.log10(power(sl(cl))/power(nIn)), snrOut=10*Math.log10(power(sl(cf))/power(nOut));
      const dist=Math.sqrt(power(sl(cf).map((s,i)=>s-sl(cl)[i])))/Math.sqrt(power(sl(cl)))*100;
      const Rpk=Math.max(...sl(cf));
      P(root,'p1',{series:[{x:t,y:x,color:'s2',width:1.2,label:'ECG con ruido'}],xlabel:'tiempo (s)',ylabel:'mV'});
      P(root,'p2',{series:[{x:t,y:cl,color:'s6',dash:[5,4],width:1.4,label:'ECG limpio (referencia)'},{x:t,y,color:'s3',label:'después de filtrar'}],xlabel:'tiempo (s)',ylabel:'mV'});
      $('#kpis',root).innerHTML=kpi('SNR antes',fmt(snrIn,1)+' dB')+kpi('SNR después',fmt(snrOut,1)+' dB')+kpi('Mejora',fmt(snrOut-snrIn,1)+' dB')+kpi('Pico R filtrado',fmt(Rpk,2)+' mV '+(Rpk<0.85*v.A?pill('warn','recortado'):''));
      const ps=power(sl(cl));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Potencia de la señal limpia',`<span class="m">P</span><sub>s</sub> = ${B(fmt(ps,4)+' mV²')} (V<sub>rms</sub> = ${fmt(Math.sqrt(ps),3)} mV)`)}
        ${step('2. Potencia del ruido de entrada',`<span class="m">P</span><sub>n</sub> ≈ σ² + <span class="m">A</span><sub>60</sub>²/2 = ${fmt(v.wn,2)}² + ${fmt(v.ln,2)}²/2 = ${B(fmt(v.wn**2+v.ln**2/2,4)+' mV²')}`)}
        ${step('3. SNR de entrada',`10 log(${fmt(ps,4)}/${fmt(power(nIn),4)}) = ${B(fmt(snrIn,2)+' dB')}`)}
        ${step('4. SNR de salida',`${B(fmt(snrOut,2)+' dB')}`)}
        ${step('5. Distorsión que introduce el filtro',`${B(fmt(dist,1)+' %')} de la señal`)}
        ${step('6. Ruido blanco que deja pasar el pasa bajas',`≈ ${sq(fr(fmt(v.fc,0),'250'))}·σ = ${B(fmt(Math.sqrt(v.fc/250)*v.wn,3)+' mV')}`)}
      </div><p class="note">Baja el corte del pasa bajas: la SNR sube, pero la distorsión también. Ese es el compromiso de diseño.</p>`;
      return;
    }
    const T=Math.max(4/v.f,0.2), N=1500, t=[],y=[]; for(let i=0;i<=N;i++){ const ti=T*i/N; t.push(ti); y.push(Math.sin(2*PI*v.f*ti)); }
    const ts=[],ysm=[]; for(let k=0;k*1/v.fs<=T;k++){ ts.push(k/v.fs); ysm.push(Math.sin(2*PI*v.f*k/v.fs)); }
    const k=Math.round(v.f/v.fs), fa=Math.abs(v.f-k*v.fs), al=v.fs<2*v.f;
    const sgn=(v.f-k*v.fs)>=0?1:-1; const ya=t.map(x=>sgn*Math.sin(2*PI*fa*x));
    P(root,'p1',{series:[{x:t,y,color:'s6',width:1.4,label:'señal real '+fmt(v.f,1)+' Hz'},{x:ts,y:ysm,dots:true,r:3.2,color:'s2',label:'muestras'}],xlabel:'tiempo (s)',ylabel:'amplitud'});
    P(root,'p2',{series:[{x:ts,y:ysm,color:'s2',width:1.2,dash:[3,3],label:'unir las muestras'},...(al?[{x:t,y:ya,color:'s4',label:'alias '+fmt(fa,1)+' Hz'}]:[])],xlabel:'tiempo (s)',ylabel:'amplitud'});
    $('#kpis',root).innerHTML=kpi('f<sub>s</sub> mínima',fmt(2*v.f,1)+' Hz')+kpi('Muestras por ciclo',fmt(v.fs/v.f,2))+kpi('Frecuencia aparente',fmt(al?fa:v.f,2)+' Hz')+kpi('Estado',al?pill('bad','aliasing'):pill('ok','cumple Nyquist'));
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Frecuencia de Nyquist',`<span class="m">f</span><sub>N</sub> = <span class="m">f</span><sub>s</sub>/2 = ${B(fmt(v.fs/2,1)+' Hz')}`)}
      ${step('2. Comparación',`<span class="m">f</span> = ${fmt(v.f,1)} Hz ${al?'>':'<'} ${fmt(v.fs/2,1)} Hz → ${B(al?'hay aliasing':'sin aliasing')}`)}
      ${step('3. Entero más cercano',`<span class="m">k</span> = redondear(${fmt(v.f,1)}/${fmt(v.fs,0)}) = ${B(String(k))}`)}
      ${step('4. Frecuencia alias',`|${fmt(v.f,1)} − ${k}·${fmt(v.fs,0)}| = ${B(fmt(fa,2)+' Hz')}`)}
    </div><p class="note">En la práctica se muestrea de 5 a 10 veces la frecuencia máxima y se pone un filtro antialiasing analógico antes del ADC.</p>`;
  }
  ctl.fire();
}};

MODS.m23={unit:2,code:'2.3',title:'Sensibilidad e histéresis',nav:'Sensibilidad e histéresis',
init(root){
  root.innerHTML=layout({unit:2,code:'2.3',title:this.title,
    lead:'La sensibilidad es la pendiente de la curva de salida. La histéresis es la diferencia entre la salida cuando la carga sube y cuando baja: el sensor “recuerda” de dónde viene.',
    caso:'Sensor de fuerza resistivo (FSR) en una plantilla o cuellera para detectar postura, como en los proyectos de la asignatura. Se aplica un ciclo de carga de 0 al máximo y se devuelve a cero. Los polímeros de los FSR tienen histéresis notable.',
    theory:`<ul><li><b>Sensibilidad:</b> <span class="m">S = Δy/Δx</span>. En sensores no lineales cambia según el punto de operación; se reporta la pendiente media o la local.</li>
    <li><b>Histéresis:</b> diferencia máxima entre las curvas de subida y bajada, en porcentaje del fondo de escala. Viene de fricción interna, viscoelasticidad o efectos magnéticos.</li>
    <li><b>No linealidad:</b> desviación máxima respecto a la recta que une los extremos.</li>
    <li><b>Umbral o zona muerta:</b> menor entrada que produce salida.</li></ul>
    <p>Para estimar la fuerza a partir del voltaje se usa una sola curva. Si el sensor tiene histéresis, la misma salida corresponde a dos fuerzas distintas y el error depende de si la carga venía subiendo o bajando.</p>`,
    formulas: eq(`<span class="m">S</span> = ${fr('Δ<span class="m">V</span>','Δ<span class="m">F</span>')} &nbsp; (mV/N)`)+
      eq(`<span class="m">H</span>% = ${fr('máx|<span class="m">V</span><sub>bajada</sub> − <span class="m">V</span><sub>subida</sub>|','<span class="m">V</span><sub>FS</sub>')}·100`)+
      eq(`NL% = ${fr('máx|<span class="m">V</span> − <span class="m">V</span><sub>recta</sub>|','<span class="m">V</span><sub>FS</sub>')}·100`)+
      eq(`Error en fuerza = ${fr('<span class="m">H</span>%·<span class="m">F</span><sub>máx</sub>','100')}`),
    plots:[{id:'p1',cap:'Ciclo de carga y descarga'},{id:'p2',cap:'Error al convertir voltaje en fuerza',cls:'short'}],
    practice:[
      ['Un FSR entrega 2,0 V a 100 N. ¿Cuál es su sensibilidad media?','S = 2000 mV/100 N = 20 mV/N.'],
      ['Si la histéresis es 6 % FS en un sensor de 100 N, ¿qué incertidumbre aporta?','Hasta 6 N de diferencia entre subida y bajada; ±3 N si se calibra con la curva promedio.'],
      ['¿Cómo se reduce el efecto de la histéresis en un dispositivo de postura?','Calibrando con el promedio de las dos curvas, usando umbrales con banda (histéresis en el software) y eligiendo celdas de carga metálicas si se necesita exactitud.']]
  });
  const ctl=makeControls($('#ctl',root),'s23',[
    {id:'Fm',label:'Fuerza máxima',min:10,max:200,step:5,value:100,unit:'N',dec:0},
    {id:'S',label:'Sensibilidad nominal',min:1,max:50,step:1,value:20,unit:'mV/N',dec:0},
    {id:'H',label:'Histéresis',min:0,max:15,step:0.5,value:6,unit:'% FS',dec:1},
    {id:'NL',label:'No linealidad',min:0,max:10,step:0.5,value:3,unit:'% FS',dec:1},
    {id:'dz',label:'Zona muerta',min:0,max:10,step:0.5,value:2,unit:'N',dec:1}],upd);
  function upd(v){
    const VFS=v.S*v.Fm; const base=F=>{ const x=Math.max(0,(F-v.dz)/(v.Fm-v.dz)); return x+4*v.NL/100*x*(1-x); };
    const up=F=>{ const x=F/v.Fm; return VFS*(base(F)-2*v.H/100*x*(1-x)); }, dn=F=>{ const x=F/v.Fm; return VFS*(base(F)+2*v.H/100*x*(1-x)); };
    const F=[],U=[],Dn=[],I=[]; for(let i=0;i<=300;i++){ const f=v.Fm*i/300; F.push(f); U.push(up(f)/1000); Dn.push(dn(f)/1000); I.push(v.S*f/1000); }
    P(root,'p1',{series:[{x:F,y:I,color:'s6',dash:[6,4],label:'ideal'},{x:F,y:U,color:'s1',label:'carga (subiendo)'},{x:F,y:Dn,color:'s2',label:'descarga (bajando)'}],xlabel:'fuerza (N)',ylabel:'voltaje (V)'});
    const avg=f=>(up(f)+dn(f))/2, inv=V=>{ let a=0,b=v.Fm; for(let k=0;k<50;k++){ const c=(a+b)/2; if(avg(c)<V) a=c; else b=c; } return (a+b)/2; };
    const eu=F.map(f=>inv(up(f))-f), ed=F.map(f=>inv(dn(f))-f);
    P(root,'p2',{series:[{x:F,y:eu,color:'s1',label:'subiendo'},{x:F,y:ed,color:'s2',label:'bajando'}],axes0:true,xlabel:'fuerza real (N)',ylabel:'error (N)'});
    let hmax=0,nlmax=0; F.forEach((f,i)=>{ hmax=Math.max(hmax,Math.abs(Dn[i]-U[i])); nlmax=Math.max(nlmax,Math.abs(avg(f)/1000-(avg(v.Fm)/1000)*f/v.Fm)); });
    const Sm=avg(v.Fm)/v.Fm, Sl=(avg(v.Fm*0.55)-avg(v.Fm*0.45))/(0.1*v.Fm);
    const emax=Math.max(...eu.map(Math.abs),...ed.map(Math.abs));
    $('#kpis',root).innerHTML=kpi('Sensibilidad media',fmt(Sm,2)+' mV/N')+kpi('Histéresis',fmt(hmax/(VFS/1000)*100,2)+' % FS')+kpi('No linealidad',fmt(nlmax/(VFS/1000)*100,2)+' % FS')+kpi('Error máximo en fuerza',fmt(emax,2)+' N');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Salida a fondo de escala',`<span class="m">V</span><sub>FS</sub> = ${fmt(v.S,0)} mV/N·${fmt(v.Fm,0)} N = ${B(fmt(VFS/1000,2)+' V')}`)}
      ${step('2. Sensibilidad media (extremos)',`<span class="m">S</span> = ${fr(fmt(avg(v.Fm),0)+' mV',fmt(v.Fm,0)+' N')} = ${B(fmt(Sm,2)+' mV/N')}`)}
      ${step('3. Sensibilidad local a media escala',`<span class="m">S</span><sub>50%</sub> = ${B(fmt(Sl,2)+' mV/N')}`)}
      ${step('4. Histéresis máxima',`${fr(fmt(hmax*1000,1)+' mV',fmt(VFS,0)+' mV')}·100 = ${B(fmt(hmax/(VFS/1000)*100,2)+' % FS')}`)}
      ${step('5. Equivalente en fuerza',`${fr(fmt(hmax*1000,1)+' mV',fmt(Sm,2)+' mV/N')} = ${B(fmt(hmax*1000/Sm,2)+' N')}`)}
      ${step('6. Umbral',`no hay salida por debajo de ${B(fmt(v.dz,1)+' N')}`)}
    </div>`;
  }
  ctl.fire();
}};

MODS.m31={unit:3,code:'3.1',title:'Aplicación con acelerómetros',nav:'Aplicación con acelerómetros',
init(root){
  root.innerHTML=layout({unit:3,code:'3.1',title:this.title,
    lead:'En reposo, un acelerómetro mide la gravedad. Repartida entre sus ejes, la gravedad dice cuánto está inclinado el sensor. Cuando hay movimiento, la aceleración propia del cuerpo se suma y ensucia la estimación.',
    caso:'Dispositivo cervical que alerta cuando la flexión del cuello supera un umbral durante mucho tiempo (postura de celular). El acelerómetro va en la nuca, eje x hacia adelante y eje z hacia arriba. La cabeza rota con radio de unos 15 cm respecto a C7.',
    theory:`<p>Con el sensor quieto, <span class="m">a<sub>x</sub> = g·sen θ</span> y <span class="m">a<sub>z</sub> = g·cos θ</span>. El ángulo se recupera con <span class="m">atan2</span>, que funciona en los cuatro cuadrantes y no depende de la magnitud exacta de g.</p>
    <p>Al mover la cabeza aparecen la aceleración tangencial <span class="m">r·θ̈</span> y la centrípeta <span class="m">r·θ̇²</span>. Si el movimiento es rápido, el ángulo calculado se equivoca. Un filtro pasa bajas exponencial (EMA) lo suaviza, pero agrega retardo. En dispositivos reales se combina con un giroscopio (filtro complementario o de Kalman).</p>
    <p>La salida digital viene en cuentas (LSB). Un MPU-6050 en ±2 g entrega 16 384 LSB/g.</p>`,
    formulas: eq(`<span class="m">θ</span> = atan2(<span class="m">a</span><sub>x</sub>, <span class="m">a</span><sub>z</sub>)`)+
      eq(`<span class="m">θ</span><sub>pitch</sub> = atan${fr('<span class="m">a</span><sub>x</sub>',sq('<span class="m">a</span><sub>y</sub>² + <span class="m">a</span><sub>z</sub>²'))}`,'3 ejes')+
      eq(`<span class="m">a</span><sub>t</sub> = <span class="m">r θ̈</span> &nbsp; <span class="m">a</span><sub>c</sub> = <span class="m">r θ̇</span>²`)+
      eq(`<span class="m">y</span><sub>k</sub> = <span class="m">α x</span><sub>k</sub> + (1 − <span class="m">α</span>)<span class="m">y</span><sub>k−1</sub>`,'EMA')+
      eq(`<span class="m">τ</span> ≈ <span class="m">T</span><sub>s</sub>${fr('1 − <span class="m">α</span>','<span class="m">α</span>')}`,'retardo del filtro')+
      eq(`<span class="m">S</span> = ${fr('2<sup>15</sup>','rango (g)')} LSB/g`),
    plots:[{id:'p1',cap:'Ángulo de flexión cervical'},{id:'p2',cap:'Aceleraciones medidas',cls:'short'}],
    practice:[
      ['El sensor lee a<sub>x</sub> = 0,5 g y a<sub>z</sub> = 0,866 g. ¿Cuál es la flexión?','θ = atan2(0,5; 0,866) = 30°.'],
      ['Con ±2 g y 16 bits, ¿qué resolución angular hay cerca de 0°?','1 LSB = 1/16384 g = 6,1×10⁻⁵ g ≈ 6,1×10⁻⁵ rad = 0,0035°. El límite real lo pone el ruido, no la resolución.'],
      ['Con fs = 50 Hz y α = 0,1, ¿cuánto retardo agrega el filtro?','τ = 0,02·0,9/0,1 = 0,18 s. Para una alarma de postura es aceptable; para un sistema de caídas, no.']]
  });
  const ctl=makeControls($('#ctl',root),'s31',[
    {id:'A',label:'Flexión máxima del cuello',min:5,max:60,step:1,value:35,unit:'°',dec:0},
    {id:'f',label:'Velocidad del movimiento',min:0.05,max:2,step:0.05,value:0.3,unit:'Hz',dec:2},
    {id:'nz',label:'Ruido del sensor',min:0,max:0.1,step:0.005,value:0.03,unit:'g',dec:3},
    {id:'al',label:'Coeficiente del filtro α',min:0.01,max:1,step:0.01,value:0.1,dec:2},
    {id:'th',label:'Umbral de alerta',min:10,max:45,step:1,value:25,unit:'°',dec:0},
    {type:'seg',id:'rg',label:'Rango del acelerómetro',options:[['2','±2 g'],['4','±4 g'],['8','±8 g']],value:'2'}],upd);
  function upd(v){
    const fs=50, T=Math.max(3/v.f,6), n=Math.round(T*fs), r=0.15, g0=9.81, Ar=v.A*PI/180, w=2*PI*v.f, gn=gaussGen(9), S=32768/+v.rg;
    const t=[],th=[],raw=[],flt=[],ax=[],az=[]; let y=0, above=0;
    for(let i=0;i<=n;i++){ const ti=i/fs; const q=Ar*(1-Math.cos(w*ti))/2, qd=Ar*w*Math.sin(w*ti)/2, qdd=Ar*w*w*Math.cos(w*ti)/2;
      const at=r*qdd/g0, ac=r*qd*qd/g0;
      let gx=Math.sin(q)+at*Math.cos(q)-ac*Math.sin(q)+v.nz*gn(), gz=Math.cos(q)-at*Math.sin(q)-ac*Math.cos(q)+v.nz*gn();
      gx=Math.round(clamp(gx,-+v.rg,+v.rg)*S)/S; gz=Math.round(clamp(gz,-+v.rg,+v.rg)*S)/S;
      const e=Math.atan2(gx,gz)*180/PI; y=i?v.al*e+(1-v.al)*y:e;
      t.push(ti); th.push(q*180/PI); raw.push(e); flt.push(y); ax.push(gx); az.push(gz); if(y>v.th) above++; }
    const err=flt.map((x,i)=>x-th[i]), emax=Math.max(...err.map(Math.abs)), rawE=Math.max(...raw.map((x,i)=>Math.abs(x-th[i])));
    P(root,'p1',{series:[{x:t,y:raw,color:'s6',width:1,label:'estimado sin filtrar'},{x:t,y:th,color:'s3',dash:[6,4],label:'ángulo real'},{x:t,y:flt,color:'s2',label:'estimado filtrado'}],hlines:[{y:v.th,color:'s4',label:'umbral'}],xlabel:'tiempo (s)',ylabel:'grados'});
    P(root,'p2',{series:[{x:t,y:ax,color:'s1',label:'a_x (g)'},{x:t,y:az,color:'s4',label:'a_z (g)'}],xlabel:'tiempo (s)',ylabel:'g'});
    const tau=(1/fs)*(1-v.al)/v.al;
    $('#kpis',root).innerHTML=kpi('Error máx. sin filtro',fmt(rawE,1)+'°')+kpi('Error máx. filtrado',fmt(emax,1)+'°')+kpi('Retardo del filtro',fmt(tau,2)+' s')+kpi('Tiempo sobre el umbral',fmt(above/(n+1)*100,0)+' %');
    const amax=r*Ar*w*w/2/g0;
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Lectura en reposo a la flexión máxima',`<span class="m">a</span><sub>x</sub> = sen ${fmt(v.A,0)}° = ${B(fmt(Math.sin(Ar),4)+' g')} &nbsp; <span class="m">a</span><sub>z</sub> = ${B(fmt(Math.cos(Ar),4)+' g')}`)}
      ${step('2. Ángulo recuperado',`atan2(${fmt(Math.sin(Ar),3)}; ${fmt(Math.cos(Ar),3)}) = ${B(fmt(v.A,1)+'°')}`)}
      ${step('3. Aceleración tangencial máxima',`<span class="m">a</span><sub>t</sub> = <span class="m">r</span>·<span class="m">A</span>·<span class="m">ω</span>²/2 = 0,15·${fmt(Ar,3)}·${fmt(w,2)}²/2 = ${B(fmt(amax*g0,3)+' m/s² = '+fmt(amax,4)+' g')}`)}
      ${step('4. Sensibilidad digital',`<span class="m">S</span> = ${fr('32768',v.rg)} = ${B(fmt(S,0)+' LSB/g')}`)}
      ${step('5. Cuentas en a<sub>x</sub> a la flexión máxima',`${fmt(Math.sin(Ar),4)}·${fmt(S,0)} = ${B(fmt(Math.round(Math.sin(Ar)*S),0)+' LSB')}`)}
      ${step('6. Retardo del filtro EMA',`<span class="m">τ</span> = 0,02·${fr(fmt(1-v.al,2),fmt(v.al,2))} = ${B(fmt(tau,3)+' s')}`)}
    </div>`;
  }
  ctl.fire();
}};
