MODS.m32={unit:3,code:'3.2',title:'Aplicación con sensores de flujo',nav:'Aplicación con sensores de flujo',
init(root){
  root.innerHTML=layout({unit:3,code:'3.2',title:this.title,
    lead:'Los sensores de flujo de aire más usados en equipos respiratorios miden una caída de presión (Venturi, orificio, neumotacógrafo) o el enfriamiento de un elemento caliente (anemómetro de hilo caliente).',
    caso:'Rama espiratoria de un ventilador mecánico o espirómetro, tubo de 22 mm. Se comparan tres principios: Venturi (ΔP proporcional a Q²), hilo caliente (ley de King) y neumotacógrafo de Fleisch (ΔP proporcional a Q mientras el flujo sea laminar).',
    theory:`<p><b>Venturi u orificio.</b> Por Bernoulli, al estrecharse el tubo la velocidad sube y la presión baja. La diferencia de presión crece con el cuadrado del caudal, así que a flujos bajos la señal es casi nula y la resolución es mala.</p>
    <p><b>Hilo caliente.</b> Un filamento se mantiene a temperatura constante; el aire que pasa lo enfría y el circuito necesita más voltaje. La ley de King relaciona voltaje y velocidad. Responde rápido y mide flujos bajos, pero depende de la temperatura y composición del gas.</p>
    <p><b>Neumotacógrafo.</b> Una malla o capilares crean una resistencia lineal mientras el número de Reynolds sea bajo (flujo laminar, Re &lt; 2000). A flujos altos aparece un término cuadrático y se pierde la linealidad.</p>`,
    formulas: eq(`<span class="m">Q</span> = <span class="m">C</span><sub>d</sub><span class="m">A</span><sub>2</sub>${sq(fr('2Δ<span class="m">P</span>','<span class="m">ρ</span>(1 − <span class="m">β</span>⁴)'))}, &nbsp; <span class="m">β</span> = ${fr('<span class="m">D</span><sub>2</sub>','<span class="m">D</span><sub>1</sub>')}`,'Venturi')+
      eq(`<span class="m">E</span>² = <span class="m">A</span> + <span class="m">B·U</span><sup><span class="m">n</span></sup>`,'King, n ≈ 0,5')+
      eq(`Δ<span class="m">P</span> = <span class="m">R·Q</span> + <span class="m">k·Q</span>²`,'neumotacógrafo')+
      eq(`<span class="m">Re</span> = ${fr('<span class="m">ρ v D</span>','<span class="m">μ</span>')}`,'aire: ρ = 1,2 kg/m³, μ = 1,8×10⁻⁵ Pa·s')+
      eq(`<span class="m">v</span> = ${fr('<span class="m">Q</span>','<span class="m">A</span>')}`),
    plots:[{id:'p1',cap:'Curva del sensor'}],
    practice:[
      ['En un Venturi, si el flujo se duplica, ¿qué pasa con ΔP?','Se multiplica por 4, porque ΔP ∝ Q².'],
      ['60 L/min en un tubo de 22 mm: ¿flujo laminar o turbulento?','A = 3,8×10⁻⁴ m², v = 2,63 m/s, Re = 1,2·2,63·0,022/1,8×10⁻⁵ ≈ 3860. Turbulento: por eso el neumotacógrafo usa capilares de diámetro pequeño.'],
      ['¿Por qué el hilo caliente necesita compensación de temperatura?','Porque mide pérdida de calor, que depende de la diferencia entre el filamento y el gas. Si el gas espirado está más caliente, el sensor marcaría menos flujo.']]
  });
  const ctl=makeControls($('#ctl',root),'s32',[
    {type:'seg',id:'mode',label:'Principio',options:[['ven','Venturi'],['hw','Hilo caliente'],['pn','Neumotacógrafo']],value:'ven'},
    {id:'Q',label:'Flujo',min:0,max:200,step:1,value:60,unit:'L/min',dec:0},
    {id:'D1',label:'Diámetro del tubo D₁',min:10,max:40,step:1,value:22,unit:'mm',dec:0,showIf:v=>v.mode==='ven'},
    {id:'D2',label:'Diámetro de la garganta D₂',min:4,max:20,step:0.5,value:10,unit:'mm',dec:1,showIf:v=>v.mode==='ven'},
    {id:'A',label:'Constante A de King',min:0.5,max:5,step:0.1,value:2,unit:'V²',dec:1,showIf:v=>v.mode==='hw'},
    {id:'B',label:'Constante B de King',min:0.3,max:3,step:0.1,value:1.4,dec:1,showIf:v=>v.mode==='hw'},
    {id:'R',label:'Resistencia lineal R',min:0.5,max:5,step:0.1,value:1.5,unit:'cmH₂O/(L/s)',dec:1,showIf:v=>v.mode==='pn'},
    {id:'k',label:'Término turbulento k',min:0,max:1,step:0.02,value:0.2,unit:'cmH₂O/(L/s)²',dec:2,showIf:v=>v.mode==='pn'}],upd);
  function upd(v){
    const rho=1.2, mu=1.8e-5, Qs=v.Q/60000, Dt=(v.mode==='ven'?v.D1:22)/1000, At=PI*Dt*Dt/4, vel=Qs/At, Re=rho*vel*Dt/mu;
    const xs=[],ys=[],lin=[];
    if(v.mode==='ven'){
      if(v.D2>=v.D1){ $('#calc',root).innerHTML='<p class="note alert">La garganta debe ser más angosta que el tubo.</p>'; return; }
      const A2=PI*(v.D2/1000)**2/4, be=v.D2/v.D1, Cd=0.98, dP=Q=>{ const q=Q/60000; return (rho/2)*(q/(Cd*A2))**2*(1-be**4); };
      for(let i=0;i<=300;i++){ const Q=200*i/300; xs.push(Q); ys.push(dP(Q)); }
      const p0=dP(v.Q), sens=(dP(v.Q+0.5)-dP(Math.max(0,v.Q-0.5)))/(v.Q>0.5?1:0.5), s10=(dP(10.5)-dP(9.5));
      P(root,'p1',{series:[{x:xs,y:ys,color:'s1',label:'ΔP (Pa)'}],points:[{x:v.Q,y:p0,color:'s2',text:fmt(p0,1)+' Pa'}],xlabel:'flujo (L/min)',ylabel:'ΔP (Pa)',yzero:true});
      $('#kpis',root).innerHTML=kpi('ΔP',fmt(p0,2)+' Pa ('+fmt(p0/98.07,3)+' cmH₂O)')+kpi('Sensibilidad aquí',fmt(sens,3)+' Pa/(L/min)')+kpi('Sensibilidad a 10 L/min',fmt(s10,3)+' Pa/(L/min)')+kpi('Reynolds en el tubo',fmt(Re,0)+' '+(Re<2000?pill('ok','laminar'):pill('warn','turbulento')));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Caudal en m³/s',`<span class="m">Q</span> = ${fmt(v.Q,0)}/60000 = ${B(sci(Qs,3)+' m³/s')}`)}
        ${step('2. Área de la garganta y β',`<span class="m">A</span><sub>2</sub> = π(${fmt(v.D2,1)} mm)²/4 = ${B(sci(A2,3)+' m²')} &nbsp; <span class="m">β</span> = ${B(fmt(be,3))}`)}
        ${step('3. Velocidad en la garganta',`<span class="m">v</span><sub>2</sub> = ${fr('<span class="m">Q</span>','<span class="m">C</span><sub>d</sub><span class="m">A</span><sub>2</sub>')} = ${B(fmt(Qs/(Cd*A2),2)+' m/s')}`)}
        ${step('4. Caída de presión',`Δ<span class="m">P</span> = ${fr('1,2','2')}·${fmt(Qs/(Cd*A2),2)}²·(1 − ${fmt(be,3)}⁴) = ${B(fmt(p0,2)+' Pa')}`)}
        ${step('5. Relación de sensibilidades',`a ${fmt(v.Q,0)} L/min es ${B(fmt(s10>0?sens/s10:0,1)+' veces')} la de 10 L/min`)}
      </div><p class="note">Un Venturi necesita un sensor de presión diferencial muy sensible para flujos bajos. Por eso los espirómetros de Venturi a veces usan dos sensores de distinto rango.</p>`;
    } else if(v.mode==='hw'){
      const n=0.5, E=U=>Math.sqrt(v.A+v.B*Math.pow(U,n));
      for(let i=0;i<=300;i++){ const Q=200*i/300, U=Q/60000/At; xs.push(Q); ys.push(E(U)); }
      const e0=E(vel), dEdU=v.B*n*Math.pow(Math.max(vel,1e-3),n-1)/(2*e0);
      P(root,'p1',{series:[{x:xs,y:ys,color:'s1',label:'E (V)'}],points:[{x:v.Q,y:e0,color:'s2',text:fmt(e0,3)+' V'}],xlabel:'flujo (L/min)',ylabel:'voltaje del puente (V)'});
      $('#kpis',root).innerHTML=kpi('Velocidad del aire',fmt(vel,2)+' m/s')+kpi('Voltaje',fmt(e0,3)+' V')+kpi('Sensibilidad dE/dU',fmt(dEdU*1000,1)+' mV/(m/s)')+kpi('Voltaje a flujo cero',fmt(Math.sqrt(v.A),3)+' V');
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Velocidad en el tubo de 22 mm',`<span class="m">v</span> = ${fr(sci(Qs,3),sci(At,3))} = ${B(fmt(vel,3)+' m/s')}`)}
        ${step('2. Ley de King',`<span class="m">E</span> = √(${fmt(v.A,1)} + ${fmt(v.B,1)}·${fmt(vel,2)}<sup>0,5</sup>) = ${B(fmt(e0,4)+' V')}`)}
        ${step('3. Sensibilidad',`${fr('d<span class="m">E</span>','d<span class="m">U</span>')} = ${fr('<span class="m">nB U</span><sup>n−1</sup>','2<span class="m">E</span>')} = ${B(fmt(dEdU,4)+' V/(m/s)')}`)}
        ${step('4. Inversión para obtener la velocidad',`<span class="m">U</span> = (${fr('<span class="m">E</span>² − <span class="m">A</span>','<span class="m">B</span>')})<sup>1/n</sup> = ${B(fmt(Math.pow((e0*e0-v.A)/v.B,1/n),3)+' m/s')}`)}
      </div><p class="note">Al contrario del Venturi, el hilo caliente es más sensible a flujos bajos.</p>`;
    } else {
      const dP=Q=>{ const q=Q/60; return v.R*q+v.k*q*q; };
      for(let i=0;i<=300;i++){ const Q=200*i/300; xs.push(Q); ys.push(dP(Q)); lin.push(v.R*Q/60); }
      const p0=dP(v.Q), pl=v.R*v.Q/60, err=p0>0?(p0-pl)/pl*100:0;
      P(root,'p1',{series:[{x:xs,y:lin,color:'s6',dash:[6,4],label:'solo término lineal'},{x:xs,y:ys,color:'s1',label:'ΔP real'}],points:[{x:v.Q,y:p0,color:'s2',text:fmt(p0,2)+' cmH₂O'}],xlabel:'flujo (L/min)',ylabel:'ΔP (cmH₂O)',yzero:true});
      $('#kpis',root).innerHTML=kpi('ΔP',fmt(p0,3)+' cmH₂O')+kpi('Error si se asume lineal',fmt(err,1)+' %')+kpi('Reynolds en el tubo',fmt(Re,0))+kpi('Régimen',Re<2000?pill('ok','laminar'):pill('warn','turbulento'));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Flujo en L/s',`<span class="m">Q</span> = ${fmt(v.Q,0)}/60 = ${B(fmt(v.Q/60,3)+' L/s')}`)}
        ${step('2. Caída de presión',`Δ<span class="m">P</span> = ${fmt(v.R,1)}·${fmt(v.Q/60,3)} + ${fmt(v.k,2)}·${fmt(v.Q/60,3)}² = ${B(fmt(p0,3)+' cmH₂O')}`)}
        ${step('3. Flujo que se calcularía asumiendo linealidad',`<span class="m">Q</span> = Δ<span class="m">P</span>/<span class="m">R</span> = ${B(fmt(p0/v.R*60,1)+' L/min')}`)}
        ${step('4. Número de Reynolds',`<span class="m">Re</span> = ${fr('1,2·'+fmt(vel,2)+'·0,022','1,8×10<sup>−5</sup>')} = ${B(fmt(Re,0))}`)}
      </div>`;
    }
  }
  ctl.fire();
}};

/* ---------- 3.3 ---------- */
MODS.m33={unit:3,code:'3.3',title:'Sensores de fuerza y transductores',nav:'Fuerza y transductores (automóviles)',
init(root){
  root.innerHTML=layout({unit:3,code:'3.3',title:this.title,
    lead:'Las galgas extensiométricas cambian su resistencia al deformarse y se leen con un puente de Wheatstone. Los piezoeléctricos generan carga cuando se les aplica fuerza, pero solo detectan cambios: la carga se fuga con el tiempo.',
    caso:'Dos aplicaciones de la industria automotriz que pasaron a la biomédica. (a) Celda de carga con galgas en el asiento del vehículo para detectar ocupante y decidir si dispara el airbag; la misma celda se usa en plataformas de fuerza y básculas clínicas. (b) Sensor piezoeléctrico de impacto, usado también para detectar pulso o caídas.',
    theory:`<p><b>Galga.</b> El cambio relativo de resistencia es el factor de galga por la deformación unitaria. Con deformaciones de cientos de microdeformaciones (µε) los cambios son de décimas de ohmio, por eso se usa el puente y un amplificador de instrumentación. Configuraciones: cuarto de puente (1 galga activa, algo no lineal), medio puente (2 galgas) y puente completo (4 galgas, el doble de sensible que el medio y compensa temperatura).</p>
    <p><b>Viga en voladizo.</b> La deformación en la raíz es <span class="m">ε = 6FL/(E b h²)</span>. Hay que revisar que el esfuerzo no pase el límite elástico del material.</p>
    <p><b>Piezoeléctrico.</b> Genera <span class="m">q = d<sub>33</sub>F</span>. Con su capacitancia y la resistencia de entrada forma un pasa altas de constante <span class="m">τ = RC</span>. Una fuerza constante produce un pico que luego decae a cero.</p>`,
    formulas: eq(`${fr('Δ<span class="m">R</span>','<span class="m">R</span>')} = <span class="m">GF·ε</span>`)+
      eq(`<span class="m">ε</span> = ${fr('6<span class="m">FL</span>','<span class="m">E b h</span>²')}`,'viga en voladizo')+
      eq(`¼: <span class="m">V</span><sub>o</sub> = <span class="m">V</span><sub>ex</sub>${fr('<span class="m">GFε</span>','4 + 2<span class="m">GFε</span>')} &nbsp; ½: <span class="m">V</span><sub>ex</sub>${fr('<span class="m">GFε</span>','2')} &nbsp; 1: <span class="m">V</span><sub>ex</sub><span class="m">GFε</span>`)+
      eq(`<span class="m">q</span> = <span class="m">d</span><sub>33</sub><span class="m">F</span> &nbsp; <span class="m">V</span><sub>0</sub> = ${fr('<span class="m">q</span>','<span class="m">C</span>')}`)+
      eq(`<span class="m">V</span>(<span class="m">t</span>) = <span class="m">V</span><sub>0</sub>e<sup>−<span class="m">t</span>/<span class="m">RC</span></sup>`),
    plots:[{id:'p1',cap:'Salida del transductor'}],
    practice:[
      ['GF = 2,1 y ε = 500 µε en cuarto de puente con 5 V. ¿Cuánto vale la salida?','V ≈ 5·2,1·500×10⁻⁶/4 = 1,31 mV. Con ganancia 200 se obtienen 262 mV.'],
      ['¿Por qué el puente completo compensa la temperatura?','Porque las cuatro galgas cambian igual con la temperatura y esos cambios se cancelan; solo la flexión produce desbalance.'],
      ['Un piezo con C = 1 nF y R = 10 MΩ. ¿Cuánto dura la señal de una fuerza sostenida?','τ = 10 ms. A los 50 ms ya cayó a menos del 1 %. No sirve para pesar a un ocupante, sí para detectar un choque.']]
  });
  const ctl=makeControls($('#ctl',root),'s33',[
    {type:'seg',id:'mode',label:'Sensor',options:[['g','Galga (celda de carga)'],['pz','Piezoeléctrico']],value:'g'},
    {id:'F',label:'Fuerza aplicada',min:0,max:1500,step:10,value:400,unit:'N',dec:0,showIf:v=>v.mode==='g'},
    {id:'L',label:'Longitud de la viga L',min:5,max:30,step:0.5,value:10,unit:'cm',dec:1,showIf:v=>v.mode==='g'},
    {id:'b',label:'Ancho b',min:1,max:5,step:0.1,value:2.5,unit:'cm',dec:1,showIf:v=>v.mode==='g'},
    {id:'h',label:'Espesor h',min:3,max:15,step:0.5,value:8,unit:'mm',dec:1,showIf:v=>v.mode==='g'},
    {id:'GF',label:'Factor de galga',min:1.8,max:2.2,step:0.01,value:2.1,dec:2,showIf:v=>v.mode==='g'},
    {type:'seg',id:'br',label:'Puente',options:[['q','¼'],['h','½'],['f','Completo']],value:'q',showIf:v=>v.mode==='g'},
    {id:'Vex',label:'Excitación',min:2.5,max:10,step:0.5,value:5,unit:'V',dec:1,showIf:v=>v.mode==='g'},
    {id:'G',label:'Ganancia del amplificador',min:1,max:1000,value:200,log:true,showIf:v=>v.mode==='g'},
    {id:'d',label:'Coeficiente d₃₃',min:20,max:500,step:5,value:300,unit:'pC/N',dec:0,showIf:v=>v.mode==='pz'},
    {id:'C',label:'Capacitancia C',min:100,max:5000,step:50,value:1000,unit:'pF',dec:0,showIf:v=>v.mode==='pz'},
    {id:'R',label:'Resistencia de entrada R',min:1,max:1000,value:10,log:true,unit:'MΩ',showIf:v=>v.mode==='pz'},
    {id:'Fp',label:'Fuerza del impacto',min:1,max:100,step:1,value:20,unit:'N',dec:0,showIf:v=>v.mode==='pz'},
    {id:'tp',label:'Duración de la fuerza',min:1,max:500,step:1,value:100,unit:'ms',dec:0,showIf:v=>v.mode==='pz'}],upd);
  function upd(v){
    if(v.mode==='g'){
      const E=70e9, L=v.L/100, b=v.b/100, h=v.h/1000, eps=F=>6*F*L/(E*b*h*h);
      const Vb=e=>{ const x=v.GF*e; return v.br==='q'?v.Vex*x/(4+2*x):v.br==='h'?v.Vex*x/2:v.Vex*x; };
      const Vl=e=>{ const x=v.GF*e; return v.br==='q'?v.Vex*x/4:v.br==='h'?v.Vex*x/2:v.Vex*x; };
      const xs=[],ys=[],yl=[]; for(let i=0;i<=200;i++){ const F=1500*i/200; xs.push(F); ys.push(Vb(eps(F))*v.G); yl.push(Vl(eps(F))*v.G); }
      const e0=eps(v.F), vb=Vb(e0), vo=vb*v.G, sig=E*e0/1e6, nl=e0>0?(Vl(e0)-vb)/vb*100:0;
      P(root,'p1',{series:[{x:xs,y:yl,color:'s6',dash:[6,4],label:'aproximación lineal'},{x:xs,y:ys,color:'s1',label:'salida amplificada (V)'}],points:[{x:v.F,y:vo,color:'s2',text:fmt(vo,3)+' V'}],hlines:[{y:5,color:'s2',dash:[2,3],label:'límite del ADC 5 V'}],xlabel:'fuerza (N)',ylabel:'voltaje (V)',yzero:true});
      $('#kpis',root).innerHTML=kpi('Deformación',fmt(e0*1e6,1)+' µε')+kpi('Salida del puente',fmt(vb*1000,3)+' mV')+kpi('Salida amplificada',fmt(vo,3)+' V')+kpi('Esfuerzo en la viga',fmt(sig,1)+' MPa '+(sig>270?pill('bad','> límite'):''));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Deformación en la raíz de la viga',`<span class="m">ε</span> = ${fr('6·'+fmt(v.F,0)+'·'+fmt(L,3),'70×10<sup>9</sup>·'+fmt(b,3)+'·('+sci(h,2)+')²')} = ${B(fmt(e0*1e6,1)+' µε')}`)}
        ${step('2. Cambio de resistencia (galga de 350 Ω)',`Δ<span class="m">R</span> = 350·${fmt(v.GF,2)}·${sci(e0,3)} = ${B(fmt(350*v.GF*e0,4)+' Ω')}`)}
        ${step('3. Salida del puente',`${v.br==='q'?'¼ de puente':v.br==='h'?'½ puente':'puente completo'}: ${B(fmt(vb*1000,4)+' mV')}`)}
        ${step('4. Salida amplificada',`${fmt(vb*1000,3)} mV · ${fsig(v.G)} = ${B(fmt(vo,3)+' V')}`)}
        ${step('5. Sensibilidad del transductor',`${B(fmt(vo/Math.max(v.F,1)*1000,3)+' mV/N')}`)}
        ${step('6. No linealidad del puente',`${B(fmt(nl,3)+' %')} ${v.br==='q'?'(solo el cuarto de puente la tiene)':''}`)}
        ${step('7. Esfuerzo (aluminio, límite ≈ 270 MPa)',`<span class="m">σ</span> = <span class="m">Eε</span> = ${B(fmt(sig,1)+' MPa')}`)}
      </div>${vo>5?'<p class="note alert">La salida pasa de 5 V y satura el ADC. Baja la ganancia.</p>':''}${sig>270?'<p class="note alert">La viga se deformaría de forma permanente. Aumenta el espesor.</p>':''}`;
      return;
    }
    const q=v.d*1e-12*v.Fp, C=v.C*1e-12, V0=q/C, tau=v.R*1e6*C, tp=v.tp/1000, T=Math.max(tp*2.2,tp+5*tau), N=3000, dt=T/N;
    const t=[],Vv=[],Fv=[]; let V=0, Fprev=0;
    for(let i=0;i<=N;i++){ const ti=i*dt; const F=ti>=0.1*T&&ti<0.1*T+tp?v.Fp:0; V+=(v.d*1e-12*(F-Fprev))/C; V-=dt*V/tau; Fprev=F; t.push(ti*1000); Vv.push(V); Fv.push(F); }
    const sc=V0/v.Fp;
    P(root,'p1',{series:[{x:t,y:Fv.map(f=>f*sc),color:'s6',dash:[6,4],label:'fuerza (escalada)'},{x:t,y:Vv,color:'s2',label:'voltaje del piezo (V)'}],axes0:true,xlabel:'tiempo (ms)',ylabel:'V'});
    const left=Math.exp(-tp/tau)*100;
    $('#kpis',root).innerHTML=kpi('Carga generada',fmt(q*1e9,3)+' nC')+kpi('Voltaje inicial',fmt(V0,2)+' V')+kpi('Constante de tiempo',fmt(tau*1000,2)+' ms')+kpi('Señal que queda al final del pulso',fmt(left,1)+' %');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Carga',`<span class="m">q</span> = ${fmt(v.d,0)} pC/N · ${fmt(v.Fp,0)} N = ${B(fmt(q*1e12,0)+' pC')}`)}
      ${step('2. Voltaje en circuito abierto',`<span class="m">V</span><sub>0</sub> = ${fr(fmt(q*1e12,0)+' pC',fmt(v.C,0)+' pF')} = ${B(fmt(V0,3)+' V')}`)}
      ${step('3. Constante de tiempo',`<span class="m">τ</span> = ${fsig(v.R)} MΩ · ${fmt(v.C,0)} pF = ${B(fmt(tau*1000,3)+' ms')}`)}
      ${step('4. Frecuencia de corte del pasa altas',`<span class="m">f</span><sub>c</sub> = ${fr('1','2π<span class="m">τ</span>')} = ${B(fmt(1/(2*PI*tau),3)+' Hz')}`)}
      ${step('5. Al final del pulso de '+fmt(v.tp,0)+' ms',`<span class="m">V</span>/<span class="m">V</span><sub>0</sub> = e<sup>−${fmt(tp,3)}/${fmt(tau,4)}</sup> = ${B(fmt(left,2)+' %')}`)}
    </div><p class="note">Para medir fuerzas lentas con un piezo se usa un amplificador de carga, que fija τ en segundos o minutos con un capacitor de realimentación.</p>`;
  }
  ctl.fire();
}};

MODS.m41={unit:4,code:'4.1',title:'Sistema cardiovascular',nav:'Sistema cardiovascular',
init(root){
  root.innerHTML=layout({unit:4,code:'4.1',title:this.title,
    lead:'Del sistema cardiovascular se mide la actividad eléctrica (ECG), la perfusión (fotopletismografía y oximetría) y la presión. Cada una usa un principio distinto y tiene sus propios errores típicos.',
    caso:'(a) Oxímetro de pulso: luz roja (660 nm) e infrarroja (940 nm), un fotodiodo y el cociente de cocientes R. (b) Presión arterial invasiva: transductor piezorresistivo con puente de Wheatstone, sensibilidad estándar 5 µV/V/mmHg, que debe estar a la altura del eje flebostático.',
    theory:`<p><b>Oximetría.</b> La hemoglobina oxigenada absorbe menos luz roja que la desoxigenada; en infrarrojo pasa lo contrario. La parte pulsátil (AC) se debe a la sangre arterial y la continua (DC) a tejido, venas y hueso. El cociente <span class="m">R = (AC/DC)<sub>rojo</sub> / (AC/DC)<sub>IR</sub></span> se convierte en SpO₂ con una curva de calibración empírica. El movimiento y la baja perfusión son las causas más comunes de error.</p>
    <p><b>Presión invasiva.</b> La presión del catéter deforma una membrana con galgas piezorresistivas en puente completo. Antes de medir se hace el cero abierto a la atmósfera y se nivela el transductor con la aurícula derecha. Cada centímetro de desnivel equivale a 0,74 mmHg de error (columna de solución salina).</p>`,
    formulas: eq(`<span class="m">R</span> = ${fr('AC<sub>rojo</sub>/DC<sub>rojo</sub>','AC<sub>IR</sub>/DC<sub>IR</sub>')}`)+
      eq(`SpO₂ ≈ 110 − 25<span class="m">R</span>`,'calibración empírica')+
      eq(`IP = ${fr('AC<sub>IR</sub>','DC<sub>IR</sub>')}·100 %`,'índice de perfusión')+
      eq(`<span class="m">V</span><sub>o</sub> = 5 µV/V/mmHg · <span class="m">V</span><sub>ex</sub> · <span class="m">P</span>`)+
      eq(`Δ<span class="m">P</span> = <span class="m">ρgh</span> ≈ 0,74 mmHg/cm`),
    plots:[{id:'p1',cap:'Señal del sensor'},{id:'p2',cap:'Detalle',cls:'short'}],
    practice:[
      ['Si R = 0,5, ¿cuál es la SpO₂ estimada?','110 − 25·0,5 = 97,5 %.'],
      ['El transductor quedó 10 cm por debajo del eje flebostático. ¿Qué error aparece?','La columna de líquido suma 10·0,74 = 7,4 mmHg: el monitor marca la presión 7 mmHg más alta.'],
      ['¿Qué salida da el transductor con 5 V y 120 mmHg?','5 µV/V/mmHg · 5 V · 120 = 3 mV. Por eso se necesita un amplificador de instrumentación.']]
  });
  const ctl=makeControls($('#ctl',root),'s41',[
    {type:'seg',id:'mode',label:'Medición',options:[['ox','Oximetría (PPG)'],['pa','Presión invasiva']],value:'ox'},
    {id:'sp',label:'SpO₂ real del paciente',min:70,max:100,step:0.5,value:97,unit:'%',dec:1,showIf:v=>v.mode==='ox'},
    {id:'hr',label:'Frecuencia cardíaca',min:40,max:180,step:1,value:75,unit:'lpm',dec:0,showIf:v=>v.mode==='ox'},
    {id:'pi',label:'Índice de perfusión',min:0.2,max:10,step:0.1,value:2,unit:'%',dec:1,showIf:v=>v.mode==='ox'},
    {id:'mo',label:'Artefacto de movimiento',min:0,max:3,step:0.1,value:0,unit:'% DC',dec:1,showIf:v=>v.mode==='ox'},
    {id:'h',label:'Altura del transductor respecto al eje',min:-20,max:20,step:1,value:0,unit:'cm',dec:0,showIf:v=>v.mode==='pa'},
    {id:'vex',label:'Excitación del puente',min:2,max:10,step:0.5,value:5,unit:'V',dec:1,showIf:v=>v.mode==='pa'},
    {id:'G',label:'Ganancia del amplificador',min:10,max:2000,value:500,log:true,showIf:v=>v.mode==='pa'}],upd);
  function upd(v){
    if(v.mode==='ox'){
      const fs=100, T=5, n=fs*T, f0=v.hr/60, R=(110-v.sp)/25, pir=v.pi/100, prd=R*pir, g=gaussGen(4);
      const t=[],red=[],ir=[]; let ph=0.3, m1=0, m2=0;
      for(let i=0;i<n;i++){ const ti=i/fs; const p=pulseShape(f0*ti); const mo=v.mo/100*(0.6*Math.sin(2*PI*0.7*ti+1)+0.4*Math.sin(2*PI*1.9*ti));
        t.push(ti); red.push(1*(1-prd*p+mo+0.0005*g())); ir.push(1.2*(1-pir*p+mo*0.9+0.0005*g())); }
      const ac=a=>Math.max(...a)-Math.min(...a), Rr=(ac(red)/mean(red))/(ac(ir)/mean(ir)), spE=clamp(110-25*Rr,0,100);
      P(root,'p1',{series:[{x:t,y:red.map(x=>x/mean(red)),color:'s2',label:'rojo 660 nm (normalizado)'},{x:t,y:ir.map(x=>x/mean(ir)),color:'s5',label:'infrarrojo 940 nm (normalizado)'}],xlabel:'tiempo (s)',ylabel:'luz transmitida / DC'});
      const sps=[],Rs=[]; for(let i=0;i<=100;i++){ const r=0.3+2*i/100; Rs.push(r); sps.push(110-25*r); }
      P(root,'p2',{series:[{x:Rs,y:sps,color:'s1',label:'curva de calibración'}],points:[{x:R,y:v.sp,shape:'ring',color:'s3',size:5,text:'real'},{x:Rr,y:110-25*Rr,shape:'dot',color:'s2',size:5,text:'medido'}],xlabel:'R',ylabel:'SpO₂ (%)'});
      const err=spE-v.sp;
      $('#kpis',root).innerHTML=kpi('R medido',fmt(Rr,3))+kpi('SpO₂ mostrada',fmt(spE,1)+' %')+kpi('Error',(err>=0?'+':'')+fmt(err,1)+' puntos '+(Math.abs(err)>2?pill('bad','> 2 %'):pill('ok','≤ 2 %')))+kpi('Índice de perfusión',fmt(v.pi,1)+' % '+(v.pi<0.5?pill('warn','baja'):''));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. R esperado para la SpO₂ real',`<span class="m">R</span> = ${fr('110 − '+fmt(v.sp,1),'25')} = ${B(fmt(R,3))}`)}
        ${step('2. Componentes pulsátiles',`(AC/DC)<sub>IR</sub> = ${B(fmt(pir*100,2)+' %')} &nbsp; (AC/DC)<sub>rojo</sub> = ${fmt(R,3)}·${fmt(pir*100,2)} % = ${B(fmt(prd*100,3)+' %')}`)}
        ${step('3. Medición sobre la ventana de 5 s',`(AC/DC)<sub>rojo</sub> = ${fmt(ac(red)/mean(red)*100,3)} % &nbsp; (AC/DC)<sub>IR</sub> = ${fmt(ac(ir)/mean(ir)*100,3)} %`)}
        ${step('4. Cociente de cocientes',`<span class="m">R</span> = ${fr(fmt(ac(red)/mean(red)*100,3),fmt(ac(ir)/mean(ir)*100,3))} = ${B(fmt(Rr,3))}`)}
        ${step('5. SpO₂',`110 − 25·${fmt(Rr,3)} = ${B(fmt(spE,1)+' %')}`)}
      </div><p class="note">Sube el artefacto de movimiento con perfusión baja: el movimiento afecta a los dos canales casi igual, R tiende a 1 y la SpO₂ se va hacia 85 %, un error clásico de los oxímetros.</p>`;
      return;
    }
    const f0=75/60, T=3, n=600, t=[],Pt=[],Pm=[],Vo=[]; const dP=-v.h*0.74;
    let mx=0; for(let i=0;i<=200;i++) mx=Math.max(mx,pulseShape(i/200));
    for(let i=0;i<=n;i++){ const ti=T*i/n, p=80+40*pulseShape(f0*ti)/mx; t.push(ti); Pt.push(p); Pm.push(p+dP); Vo.push(5e-6*v.vex*(p+dP)*v.G*1000); }
    P(root,'p1',{series:[{x:t,y:Pt,color:'s6',dash:[6,4],label:'presión real'},{x:t,y:Pm,color:'s2',label:'presión mostrada'}],xlabel:'tiempo (s)',ylabel:'mmHg'});
    P(root,'p2',{series:[{x:t,y:Vo,color:'s1',label:'salida amplificada (mV)'}],xlabel:'tiempo (s)',ylabel:'mV'});
    const pam=a=>mean(a);
    $('#kpis',root).innerHTML=kpi('Real',fmt(Math.max(...Pt),0)+'/'+fmt(Math.min(...Pt),0)+' mmHg')+kpi('Mostrada',fmt(Math.max(...Pm),0)+'/'+fmt(Math.min(...Pm),0)+' mmHg')+kpi('Error por altura',(dP>=0?'+':'')+fmt(dP,1)+' mmHg')+kpi('Salida a 120 mmHg sin amplificar',fmt(5*v.vex*120/1000,3)+' mV');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Sensibilidad del transductor',`5 µV/V/mmHg · ${fmt(v.vex,1)} V = ${B(fmt(5*v.vex,1)+' µV/mmHg')}`)}
      ${step('2. Salida a 120 mmHg',`${fmt(5*v.vex,1)} µV · 120 = ${B(fmt(5*v.vex*120/1000,3)+' mV')}`)}
      ${step('3. Después del amplificador',`${fmt(5*v.vex*120/1000,3)} mV · ${fsig(v.G)} = ${B(fmt(5*v.vex*120/1000*v.G,1)+' mV')}`)}
      ${step('4. Error hidrostático',`Δ<span class="m">P</span> = <span class="m">ρgh</span> = 1000·9,81·${fmt(-v.h/100,2)} Pa = ${B(fmt(dP,2)+' mmHg')}`)}
      ${step('5. Presión arterial media mostrada',`${B(fmt(pam(Pm),1)+' mmHg')} (real ${fmt(pam(Pt),1)})`)}
    </div><p class="note">${v.h<0?'El transductor está por debajo del eje: la columna de líquido suma presión y el monitor sobreestima.':v.h>0?'El transductor está por encima del eje: el monitor subestima la presión.':'Transductor nivelado: no hay error hidrostático.'}</p>`;
  }
  ctl.fire();
}};

MODS.m42={unit:4,code:'4.2',title:'Sistema respiratorio',nav:'Sistema respiratorio',
init(root){
  root.innerHTML=layout({unit:4,code:'4.2',title:this.title,
    lead:'En el sistema respiratorio el sensor central es el de flujo. El volumen no se mide: se calcula integrando el flujo, y cualquier error pequeño del sensor se acumula con el tiempo.',
    caso:'(a) Espirometría forzada: el paciente bota todo el aire lo más rápido posible; de la curva salen la CVF, el VEF₁ y el flujo pico. (b) Respiración tranquila en un ventilador: un offset mínimo del sensor de flujo hace que el volumen calculado se desvíe. También se usa capnografía (CO₂ espirado, por absorción infrarroja) para confirmar ventilación.',
    theory:`<p><b>Espirometría.</b> La espiración forzada se aproxima con una exponencial: el volumen sube rápido y se estabiliza en la capacidad vital forzada (CVF). El VEF₁ es el volumen espirado en el primer segundo. Si VEF₁/CVF &lt; 0,70 hay patrón obstructivo (asma, EPOC): la vía aérea estrecha aumenta la constante de tiempo.</p>
    <p><b>Integración y deriva.</b> <span class="m">V(t) = ∫Q dt</span>. Si el sensor tiene un offset de 0,02 L/s, en un minuto el volumen se desvía 1,2 L. Los ventiladores reinician la integral en cada ciclo y recalibran el cero del sensor periódicamente.</p>
    <p><b>Capnografía.</b> El CO₂ absorbe infrarrojo a 4,26 µm. La presión parcial al final de la espiración (EtCO₂, normal 35–45 mmHg) refleja la ventilación alveolar.</p>`,
    formulas: eq(`<span class="m">V</span>(<span class="m">t</span>) = ∫<sub>0</sub><sup><span class="m">t</span></sup> <span class="m">Q</span>(<span class="m">τ</span>) d<span class="m">τ</span> ≈ Σ<span class="m">Q</span><sub>k</sub>Δ<span class="m">t</span>`)+
      eq(`<span class="m">V</span>(<span class="m">t</span>) = CVF(1 − e<sup>−<span class="m">t</span>/<span class="m">τ</span></sup>)`,'modelo')+
      eq(`VEF₁ = CVF(1 − e<sup>−1/<span class="m">τ</span></sup>)`)+
      eq(`Deriva = <span class="m">Q</span><sub>offset</sub>·<span class="m">t</span>`)+
      eq(`<span class="m">V̇</span><sub>E</sub> = <span class="m">V</span><sub>T</sub>·FR`,'volumen minuto'),
    plots:[{id:'p1',cap:'Volumen'},{id:'p2',cap:'Flujo',cls:'short'}],
    practice:[
      ['CVF = 4 L y τ = 0,5 s. ¿Cuánto vale VEF₁/CVF?','1 − e<sup>−2</sup> = 0,865. Normal.'],
      ['¿Con qué τ el cociente baja a 0,70?','1 − e<sup>−1/τ</sup> = 0,7 → τ = 1/ln(1/0,3) = 0,83 s.'],
      ['Un sensor tiene offset de 0,05 L/s. ¿Cuánto se desvía el volumen en 30 s sin reiniciar la integral?','0,05·30 = 1,5 L. Más que tres volúmenes corrientes.']]
  });
  const ctl=makeControls($('#ctl',root),'s42',[
    {type:'seg',id:'mode',label:'Prueba',options:[['esp','Espirometría forzada'],['vt','Respiración tranquila']],value:'esp'},
    {id:'cvf',label:'Capacidad vital forzada CVF',min:1,max:6,step:0.1,value:4.5,unit:'L',dec:1,showIf:v=>v.mode==='esp'},
    {id:'tau',label:'Constante de tiempo τ (obstrucción)',min:0.2,max:2,step:0.05,value:0.5,unit:'s',dec:2,showIf:v=>v.mode==='esp'},
    {id:'ge',label:'Error de ganancia del sensor',min:-10,max:10,step:0.5,value:0,unit:'%',dec:1,showIf:v=>v.mode==='esp'},
    {id:'fs',label:'Frecuencia de muestreo',min:5,max:200,step:1,value:100,unit:'Hz',dec:0,showIf:v=>v.mode==='esp'},
    {id:'rr',label:'Frecuencia respiratoria',min:8,max:40,step:1,value:15,unit:'rpm',dec:0,showIf:v=>v.mode==='vt'},
    {id:'vt',label:'Volumen corriente V<sub>T</sub>',min:200,max:800,step:10,value:500,unit:'mL',dec:0,showIf:v=>v.mode==='vt'},
    {id:'off',label:'Offset del sensor de flujo',min:0,max:0.1,step:0.002,value:0.02,unit:'L/s',dec:3,showIf:v=>v.mode==='vt'},
    {type:'check',id:'rst',label:'Reiniciar la integral en cada ciclo',value:false,showIf:v=>v.mode==='vt'}],upd);
  function upd(v){
    if(v.mode==='esp'){
      const tr=0.05, Qf=t=>v.cvf/v.tau*Math.exp(-t/v.tau)*(1-Math.exp(-t/tr)), T=6;
      const t=[],Vv=[],Q=[]; const dt=1/v.fs; let V=0, prev=Qf(0)*(1+v.ge/100);
      for(let i=0;i*dt<=T;i++){ const ti=i*dt, q=Qf(ti)*(1+v.ge/100); if(i) V+=(q+prev)/2*dt; prev=q; t.push(ti); Vv.push(V); Q.push(q); }
      const at=s=>{ const k=Math.min(Vv.length-1,Math.round(s*v.fs)); return Vv[k]; };
      const fev1=at(1), fvc=Vv[Vv.length-1], ratio=fev1/fvc, pef=Math.max(...Q);
      const fevT=v.cvf*(1-Math.exp(-1/v.tau));
      P(root,'p1',{series:[{x:t,y:Vv,color:'s1',label:'volumen espirado (L)'}],vlines:[{x:1,color:'s4',label:'1 s'}],points:[{x:1,y:fev1,color:'s2',text:'VEF₁ '+fmt(fev1,2)+' L'}],xlabel:'tiempo (s)',ylabel:'L',yzero:true});
      P(root,'p2',{series:[{x:Vv,y:Q,color:'s2',label:'curva flujo–volumen'}],points:Vv.length<80?Vv.map((x,i)=>({x,y:Q[i],shape:'dot',color:'s2',size:2.5})):[],xlabel:'volumen (L)',ylabel:'flujo (L/s)',yzero:true});
      $('#kpis',root).innerHTML=kpi('CVF medida',fmt(fvc,2)+' L')+kpi('VEF₁',fmt(fev1,2)+' L')+kpi('VEF₁/CVF',fmt(ratio,3)+' '+(ratio<0.7?pill('bad','obstructivo'):pill('ok','normal')))+kpi('Flujo pico',fmt(pef,2)+' L/s');
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. VEF₁ teórico',`${fmt(v.cvf,1)}(1 − e<sup>−1/${fmt(v.tau,2)}</sup>) = ${B(fmt(fevT,3)+' L')}`)}
        ${step('2. Cociente teórico',`1 − e<sup>−1/${fmt(v.tau,2)}</sup> = ${B(fmt(1-Math.exp(-1/v.tau),3))}`)}
        ${step('3. Integración numérica (trapecios)',`Δ<span class="m">t</span> = 1/${fmt(v.fs,0)} = ${B(fmt(dt*1000,1)+' ms')}; ${Vv.length} muestras`)}
        ${step('4. Efecto del error de ganancia',`CVF × (1 ${v.ge>=0?'+':'−'} ${fmt(Math.abs(v.ge),1)} %) = ${B(fmt(fvc,3)+' L')}; el cociente no cambia`)}
        ${step('5. Flujo pico medido',`${B(fmt(pef,2)+' L/s = '+fmt(pef*60,0)+' L/min')}`)}
      </div><p class="note">Baja la frecuencia de muestreo a menos de 20 Hz: el flujo pico, que dura pocos milisegundos, se subestima. Las normas de espirometría piden al menos 100 Hz.</p>`;
      return;
    }
    const Tb=60/v.rr, A=PI*v.vt/1000/Tb, fs=50, T=60, t=[],Q=[],Vv=[],Vt=[]; let V=0, Vr=0;
    for(let i=0;i<=T*fs;i++){ const ti=i/fs, q=A*Math.sin(2*PI*ti/Tb), qm=q+v.off; if(v.rst&&i&&Math.floor(ti/Tb)!==Math.floor((ti-1/fs)/Tb)) V=0; t.push(ti); Q.push(qm); Vv.push(V); Vr=(1-Math.cos(2*PI*ti/Tb))/2*v.vt/1000; Vt.push(Vr); V+=qm/fs; }
    P(root,'p1',{series:[{x:t,y:Vt,color:'s6',dash:[6,4],label:'volumen real'},{x:t,y:Vv,color:'s1',label:'volumen calculado'}],xlabel:'tiempo (s)',ylabel:'L'});
    P(root,'p2',{series:[{x:t,y:Q,color:'s2',label:'flujo medido (L/s)'}],axes0:true,xlabel:'tiempo (s)',ylabel:'L/s'});
    const drift=v.rst?v.off*Tb:v.off*60;
    $('#kpis',root).innerHTML=kpi('Volumen minuto',fmt(v.vt*v.rr/1000,2)+' L/min')+kpi('Flujo inspiratorio pico',fmt(A,3)+' L/s')+kpi('Deriva acumulada',fmt(drift,3)+' L')+kpi('Error en V<sub>T</sub> por ciclo',fmt(v.off*Tb/2*1000,0)+' mL');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Periodo respiratorio',`<span class="m">T</span> = 60/${fmt(v.rr,0)} = ${B(fmt(Tb,2)+' s')}`)}
      ${step('2. Flujo pico para el V<sub>T</sub> dado',`<span class="m">Q</span><sub>pico</sub> = ${fr('π<span class="m">V</span><sub>T</sub>','<span class="m">T</span>')} = ${fr('π·'+fmt(v.vt/1000,2),fmt(Tb,2))} = ${B(fmt(A,3)+' L/s')}`)}
      ${step('3. Volumen minuto',`${fmt(v.vt,0)} mL · ${fmt(v.rr,0)} = ${B(fmt(v.vt*v.rr/1000,2)+' L/min')}`)}
      ${step('4. Deriva en un minuto sin reinicio',`${fmt(v.off,3)} L/s · 60 s = ${B(fmt(v.off*60,2)+' L')}`)}
      ${step('5. Con reinicio por ciclo',`máximo ${fmt(v.off,3)}·${fmt(Tb,2)} = ${B(fmt(v.off*Tb,3)+' L')} por ciclo`)}
    </div>`;
  }
  ctl.fire();
}};

MODS.m43={unit:4,code:'4.3',title:'Sistemas adaptables a las dinámicas sociotecnológicas',nav:'Sistemas adaptables (vestibles y telemedicina)',
init(root){
  root.innerHTML=layout({unit:4,code:'4.3',title:this.title,
    lead:'Los sensores salieron de la UCI y llegaron al cuerpo del paciente: relojes, parches, cuelleras y plantillas que transmiten por Bluetooth a un celular. En estos equipos la batería, la cantidad de datos y la comodidad pesan tanto como la exactitud.',
    caso:'Cuellera vestible para corrección postural con un acelerómetro de 6 ejes (IMU), un microcontrolador y Bluetooth de baja energía (BLE). Se calcula cuánto dura la batería y cuántos datos genera, y se ve cómo cambia al dormir el microcontrolador entre mediciones.',
    theory:`<p>El consumo promedio es la suma ponderada del consumo de cada bloque por la fracción de tiempo que está activo (ciclo de trabajo). La autonomía es la capacidad útil de la batería dividida por la corriente promedio. Se suele tomar el 80 % de la capacidad nominal.</p>
    <ul><li>Dormir el microcontrolador y despertarlo solo para leer el sensor reduce el consumo de decenas de mA a cientos de µA.</li>
    <li>Procesar en el dispositivo y enviar solo eventos (por ejemplo, “mala postura durante 2 min”) gasta mucho menos que transmitir la señal cruda.</li>
    <li>La frecuencia de muestreo debe ser la mínima que cumpla Nyquist para el movimiento: la postura cambia a menos de 2 Hz.</li></ul>
    <p>Otros factores de diseño: biocompatibilidad del material en contacto con la piel, lavabilidad, seguridad eléctrica, privacidad de los datos y facilidad de uso para adultos mayores.</p>`,
    formulas: eq(`<span class="m">Ī</span> = Σ <span class="m">I</span><sub>k</sub>·<span class="m">D</span><sub>k</sub>`,'D = fracción de tiempo activo')+
      eq(`Autonomía = ${fr('0,8·<span class="m">C</span><sub>bat</sub>','<span class="m">Ī</span>')}`)+
      eq(`Tasa de datos = <span class="m">n</span><sub>ejes</sub>·<span class="m">b</span>·<span class="m">f</span><sub>s</sub>`,'bytes/s')+
      eq(`<span class="m">D</span><sub>BLE</sub> = ${fr('<span class="m">t</span><sub>tx</sub>','<span class="m">T</span><sub>envío</sub>')}`),
    plots:[{id:'p1',cap:'Descarga de la batería'}],

      ['Batería de 300 mAh, consumo promedio 2 mA. ¿Cuánto dura?','0,8·300/2 = 120 h = 5 días.'],

  });
  const ctl=makeControls($('#ctl',root),'s43',[
    {id:'C',label:'Capacidad de la batería',min:100,max:1000,step:10,value:300,unit:'mAh',dec:0},
    {id:'imu',label:'Consumo de la IMU',min:0.5,max:4,step:0.1,value:3.6,unit:'mA',dec:1},
    {id:'mcu',label:'MCU activo',min:2,max:30,step:0.5,value:12,unit:'mA',dec:1},
    {id:'slp',label:'MCU dormido',min:1,max:500,step:1,value:20,unit:'µA',dec:0},
    {id:'du',label:'Ciclo de trabajo del MCU',min:1,max:100,step:1,value:20,unit:'%',dec:0},
    {type:'check',id:'imuS',label:'Apagar la IMU cuando el MCU duerme',value:false},
    {id:'tx',label:'Corriente de transmisión BLE',min:3,max:20,step:0.5,value:8,unit:'mA',dec:1},
    {id:'Tt',label:'Envío cada',min:0.1,max:60,value:1,log:true,unit:'s'},
    {id:'fs',label:'Muestreo de la IMU',min:10,max:200,step:5,value:50,unit:'Hz',dec:0}],upd);
  function upd(v){
    const d=v.du/100, ttx=0.003, Dtx=Math.min(1,ttx/v.Tt);
    const parts=[['IMU',v.imu*(v.imuS?d:1)],['MCU activo',v.mcu*d],['MCU dormido',v.slp/1000*(1-d)],['BLE transmisión',v.tx*Dtx],['BLE conexión y regulador',0.05]];
    const I=parts.reduce((s,p)=>s+p[1],0), Iall=v.imu+v.mcu+v.tx*Dtx+0.05, h=0.8*v.C/I, hall=0.8*v.C/Iall;
    const Tmax=Math.min(Math.max(h,hall)*1.1,2000), t=[],a=[],b=[]; for(let i=0;i<=300;i++){ const ti=Tmax*i/300; t.push(ti); a.push(Math.max(0,100-ti*I/v.C*100)); b.push(Math.max(0,100-ti*Iall/v.C*100)); }
    P(root,'p1',{series:[{x:t,y:b,color:'s6',dash:[6,4],label:'todo encendido siempre'},{x:t,y:a,color:'s3',label:'tu configuración'}],hlines:[{y:20,color:'s2',label:'20 % (reserva)'}],xlabel:'horas',ylabel:'batería (%)',ylim:[0,105]});
    const rate=6*2*v.fs, perDay=rate*86400/1e6;
    $('#kpis',root).innerHTML=kpi('Corriente promedio',fmt(I,3)+' mA')+kpi('Autonomía',fmt(h,1)+' h ('+fmt(h/24,1)+' días)')+kpi('Si todo estuviera encendido',fmt(hall,1)+' h')+kpi('Datos crudos por día',fmt(perDay,1)+' MB');
    $('#bars',root).innerHTML=parts.map(p=>`<div style="display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 90px;gap:10px;align-items:center;margin:6px 0;font-size:13px"><span>${p[0]}</span><span style="height:12px;border-radius:3px;background:var(--surface-2);overflow:hidden"><span style="display:block;height:100%;width:${(p[1]/I*100).toFixed(1)}%;background:var(--accent)"></span></span><span style="font-family:var(--f-mono);text-align:right">${fmt(p[1]/I*100,1)} %</span></div>`).join('');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. IMU',`${fmt(v.imu,1)} mA · ${v.imuS?fmt(d,2):'1'} = ${B(fmt(parts[0][1],3)+' mA')}`)}
      ${step('2. Microcontrolador',`${fmt(v.mcu,1)}·${fmt(d,2)} + ${fmt(v.slp/1000,3)}·${fmt(1-d,2)} = ${B(fmt(parts[1][1]+parts[2][1],3)+' mA')}`)}
      ${step('3. Bluetooth',`${fmt(v.tx,1)} mA · ${fr('3 ms',fsig(v.Tt)+' s')} + 0,05 = ${B(fmt(parts[3][1]+0.05,4)+' mA')}`)}
      ${step('4. Corriente promedio',`<span class="m">Ī</span> = ${B(fmt(I,3)+' mA')}`)}
      ${step('5. Autonomía',`${fr('0,8·'+fmt(v.C,0),fmt(I,3))} = ${B(fmt(h,1)+' h')}`)}
      ${step('6. Tasa de datos crudos',`6 ejes · 2 B · ${fmt(v.fs,0)} Hz = ${B(fmt(rate,0)+' B/s')}`)}
    </div>${h<24?'<p class="note alert">No alcanza para un día de uso. Un dispositivo vestible debería durar al menos una jornada completa.</p>':''}`;
  }
  ctl.fire();
}};

function home(root){

  const fs=500,t=[],a=[],RR=60/72,g=gaussGen(2); for(let i=0;i<fs*2.5;i++){ const ti=i/fs; t.push(ti); a.push(ecgBeat(ti%RR,1)+0.06*g()+0.25*Math.sin(2*PI*60*ti)); }

function formulario(root){

  root.innerHTML=`<article class="mod"><header class="mh"><div class="eyebrow">Repaso</div><h1>Formulario de Sensores Aplicados</h1><p class="lead">Las ecuaciones de las cuatro unidades. Cada bloque enlaza con su simulador.</p></header><div class="fsheet">

  ${blk('Unidad 2 · Diseño',[eq('m = (NΣxy − ΣxΣy)/(NΣx² − (Σx)²) &nbsp; b = (Σy − mΣx)/N'),eq('R² = 1 − SS<sub>res</sub>/SS<sub>tot</sub>'),eq('SNR = 10 log(P<sub>s</sub>/P<sub>n</sub>) = 20 log(V<sub>s</sub>/V<sub>n</sub>)'),eq('f<sub>s</sub> > 2f<sub>máx</sub> &nbsp; f<sub>alias</sub> = |f − kf<sub>s</sub>|'),eq('S = ΔV/ΔF &nbsp; H% = máx|V<sub>↓</sub> − V<sub>↑</sub>|/V<sub>FS</sub>·100'),'<a href="#m21">Ir a la unidad 2 →</a>'])}
  ${blk('Unidad 3 · Integración',[eq('θ = atan2(a<sub>x</sub>, a<sub>z</sub>) &nbsp; y<sub>k</sub> = αx<sub>k</sub> + (1−α)y<sub>k−1</sub>'),eq('Q = C<sub>d</sub>A<sub>2</sub>√(2ΔP/(ρ(1−β⁴)))','Venturi'),eq('E² = A + BU<sup>n</sup>','King'),eq('Re = ρvD/μ'),eq('ΔR/R = GF·ε &nbsp; ε = 6FL/(Ebh²)'),eq('¼: V<sub>ex</sub>GFε/4 &nbsp; ½: V<sub>ex</sub>GFε/2 &nbsp; 1: V<sub>ex</sub>GFε'),eq('q = d<sub>33</sub>F &nbsp; V = q/C &nbsp; τ = RC'),'<a href="#m31">Ir a la unidad 3 →</a>'])}
  ${blk('Unidad 4 · Aplicaciones',[eq('R = (AC/DC)<sub>rojo</sub>/(AC/DC)<sub>IR</sub> &nbsp; SpO₂ ≈ 110 − 25R'),eq('V<sub>o</sub> = 5 µV/V/mmHg · V<sub>ex</sub> · P'),eq('ΔP = ρgh ≈ 0,74 mmHg/cm'),eq('V(t) = ∫Q dt &nbsp; VEF₁/CVF < 0,70 → obstructivo'),eq('V̇<sub>E</sub> = V<sub>T</sub>·FR'),eq('Ī = ΣI<sub>k</sub>D<sub>k</sub> &nbsp; Autonomía = 0,8C/Ī'),'<a href="#m41">Ir a la unidad 4 →</a>'])}
  </div></article>`;
}

/* =============== navegación =============== */
const ORDER=['inicio',...UNITS.flatMap(u=>u.mods),'formulario'];
function buildNav(){
  $('#side').innerHTML=`<a class="home" href="#inicio" data-id="inicio">Inicio</a>`+UNITS.map(u=>`<h3><i>U${u.n}</i>${u.title}</h3>`+u.mods.map(id=>`<a class="it" href="#${id}" data-id="${id}"><span>${MODS[id].code}</span><span>${MODS[id].nav}</span></a>`).join('')).join('')+`<h3>Repaso</h3><a class="it" href="#formulario" data-id="formulario"><span>Σ</span><span>Formulario completo</span></a>`;
  const sel=$('#navsel'); sel.innerHTML=`<option value="inicio">Inicio</option>`+UNITS.map(u=>`<optgroup label="Unidad ${u.n}">${u.mods.map(id=>`<option value="${id}">${MODS[id].code} ${MODS[id].nav}</option>`).join('')}</optgroup>`).join('')+`<option value="formulario">Formulario completo</option>`;
  sel.onchange=()=>{ location.hash=sel.value; };
}
function route(){
  let id=(location.hash||'').slice(1); if(!ORDER.includes(id)) id='inicio';
  const main=$('#main'); main.innerHTML='';
  if(id==='inicio') home(main); else if(id==='formulario') formulario(main); else MODS[id].init(main);
  document.querySelectorAll('.side a').forEach(a=>{ if(a.dataset.id===id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#navsel').value=id; window.scrollTo(0,0);
}
buildNav(); window.addEventListener('hashchange',route); route();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(redrawAll);
</script>
