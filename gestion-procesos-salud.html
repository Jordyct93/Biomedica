  const PA0=[{c:'Accesorios dañados (sensores, cables)',f:58},{c:'Uso inadecuado por el usuario',f:41},{c:'Falla de batería',f:27},{c:'Calibración vencida',f:14},{c:'Falla de software',f:9},{c:'Desgaste mecánico',f:7},{c:'Daño por líquidos',f:5},{c:'Otros',f:4}];
  root.innerHTML=layout({unit:3,code:'3.1',title:this.title,
    lead:'Tres herramientas que se usan juntas. El diagrama de Ishikawa organiza las posibles causas de un problema. El diagrama de Pareto prioriza las causas que más pesan. La gráfica de control dice si el proceso es estable o si apareció una causa especial.',
    caso:'El departamento de biomédica tiene un problema: el mantenimiento correctivo se demora. Primero construye el Ishikawa (6M), después clasifica 165 reportes de falla del semestre con Pareto, y finalmente vigila con una gráfica p el porcentaje diario de historias clínicas con el registro de uso del equipo incompleto.',
    theory:`<p><b>Ishikawa (espina de pescado).</b> La cabeza es el problema y las espinas son categorías de causas. En salud se usan las 6M: método, mano de obra, maquinaria, materiales, medición y medio ambiente. Se construye en equipo con lluvia de ideas y luego se profundiza cada causa con los 5 porqués.</p>
    <p><b>Pareto.</b> Se ordenan las causas de mayor a menor frecuencia y se grafica el porcentaje acumulado. Normalmente pocas causas (cerca del 20 %) explican la mayoría de los casos (cerca del 80 %).</p>
    <p><b>Gráfica de control.</b> Creada por Shewhart. Tiene una línea central y límites a ±3σ. Un punto fuera de los límites, o 7 puntos seguidos del mismo lado de la línea central, indican una causa especial que hay que investigar. La gráfica p se usa para proporciones de defectuosos.</p>`,
    formulas: eq('%<sub>i</sub> = f<sub>i</sub>/Σf · 100')+eq('%acum<sub>k</sub> = Σ<sub>i≤k</sub> %<sub>i</sub>')+eq('p̄ = Σd/Σn')+eq('LC = p̄ ± 3√(p̄(1 − p̄)/n)'),
    work:true,
    plots:[{id:'p1',cap:'Gráfica'}],
    practiceTitle:'Casos y ejercicios',
    practice:[
      ['Caso para resolver: haz los 5 porqués de “la bomba de infusión de UCI estuvo 5 días fuera de servicio”.','¿Por qué? Faltaba un repuesto. ¿Por qué? No había stock. ¿Por qué? No se sabía qué repuestos fallan más. ¿Por qué? Las órdenes de trabajo no registran la pieza cambiada. ¿Por qué? El formato no tiene ese campo. Acción: modificar el formato y armar un stock mínimo con base en un Pareto de repuestos.'],
      ['Ejercicio: con los datos de Pareto del ejemplo, ¿qué porcentaje explican las dos primeras causas?','(58 + 41)/165 = 60 %. Con la tercera llega a 76,4 % y con la cuarta a 84,8 %: con el criterio del 80 %, las cuatro primeras son los “pocos vitales”.'],
      ['Ejercicio: p̄ = 0,06 y n = 100. Calcula los límites de la gráfica p.','σ = √(0,06·0,94/100) = 0,0237. LCS = 0,06 + 0,071 = 0,131. LCI = 0,06 − 0,071 < 0 → 0.'],
      ['Pregunta: ¿qué hacer si un punto cae por debajo del límite inferior en una gráfica de defectos?','También es causa especial, pero favorable. Se investiga qué pasó ese día para repetirlo (o verificar que no fue un error de registro).']]
  });
  const ctl=makeControls($('#ctl',root),'g31',[
    {type:'seg',id:'mode',label:'Herramienta',options:[['ish','Ishikawa'],['par','Pareto'],['ctl','Gráfica p']],value:'ish'},
    {id:'n',label:'Historias auditadas por día n',min:30,max:300,step:5,value:100,dec:0,showIf:v=>v.mode==='ctl'},
    {id:'p',label:'Proporción normal de incompletas',min:1,max:20,step:0.5,value:6,unit:'%',dec:1,showIf:v=>v.mode==='ctl'},
    {id:'d',label:'Días observados',min:15,max:40,step:1,value:30,dec:0,showIf:v=>v.mode==='ctl'},
    {id:'cd',label:'Día en que cambia el proceso',min:5,max:40,step:1,value:22,dec:0,showIf:v=>v.mode==='ctl'},
    {id:'sh',label:'Aumento de la proporción tras el cambio',min:0,max:10,step:0.5,value:5,unit:'pts %',dec:1,showIf:v=>v.mode==='ctl'}],upd);
  const causes=C0.map(x=>({cat:x[0],t:x[1]})), PA=PA0.map(x=>({...x}));
  let last='', prob='Demora en el mantenimiento correctivo';
  function fish(){
    const W=900,H=380,y0=190, xs=[200,420,640];
    let s=`<line x1="30" y1="${y0}" x2="740" y2="${y0}" stroke="var(--ink)" stroke-width="2.5"/><rect x="740" y="${y0-42}" width="150" height="84" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/><foreignObject x="746" y="${y0-38}" width="138" height="76"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 12.5px var(--f-body);color:var(--ink);display:flex;align-items:center;height:100%;text-align:center">${esc(prob)}</div></foreignObject>`;
    CATS.forEach((c,i)=>{ const top=i<3, xb=xs[i%3], x1=xb-110, y1=top?40:H-40;
      s+=`<line x1="${x1}" y1="${y1}" x2="${xb+30}" y2="${y0}" stroke="var(--muted)" stroke-width="1.6"/><text x="${x1}" y="${top?y1-10:y1+20}" text-anchor="middle" fill="var(--accent)" font-size="13" font-weight="700">${c}</text>`;
      const list=causes.filter(k=>k.cat===c); list.forEach((k,j)=>{ const f=(j+1)/(list.length+1)*0.85, px=x1+(xb+30-x1)*f, py=y1+(y0-y1)*f; s+=`<line x1="${px-70}" y1="${py}" x2="${px}" y2="${py}" stroke="var(--line)"/><text x="${px-72}" y="${py-3}" text-anchor="end" fill="var(--ink)" font-size="11">${esc(k.t.length>34?k.t.slice(0,33)+'…':k.t)}</text>`; }); });
    return `<div class="diagram"><svg viewBox="0 0 ${W} ${H}" style="min-width:760px" role="img" aria-label="Diagrama de Ishikawa">${s}</svg></div>`;
  }
  function upd(v){
    const w=$('#work',root); show(root,'p1',v.mode!=='ish');
    if(v.mode==='ish'){
      const render=()=>{ w.innerHTML=`<div class="crow num" style="justify-content:flex-start;flex-wrap:wrap"><label for="g31-prob">Problema</label><input type="text" id="g31-prob" value="${esc(prob)}" style="width:min(100%,360px)"></div>${fish()}<div class="addc"><input type="text" id="g31-new" placeholder="Escribe una causa" aria-label="Nueva causa"><select id="g31-cat" aria-label="Categoría">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button type="button" class="btn" id="g31-add">Agregar causa</button></div><div class="chips">${causes.map((k,i)=>`<span class="chip">${esc(k.cat)}: ${esc(k.t)} <button type="button" data-x="${i}" aria-label="Quitar causa">×</button></span>`).join('')}</div>`;
        $('#g31-prob',root).onchange=e=>{ prob=e.target.value; render(); };
        $('#g31-add',root).onclick=()=>{ const t=$('#g31-new',root).value.trim(); if(t){ causes.push({cat:$('#g31-cat',root).value,t}); render(); } };
        w.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ causes.splice(+b.dataset.x,1); render(); });
        const cnt=CATS.map(c=>causes.filter(k=>k.cat===c).length);
        $('#kpis',root).innerHTML=kpi('Causas registradas',String(causes.length))+kpi('Categoría con más causas',CATS[cnt.indexOf(Math.max(...cnt))]);
        $('#calc',root).innerHTML=`<p class="note">El Ishikawa no calcula nada: ordena la conversación. El siguiente paso es verificar con datos cuáles causas pesan más (Pareto) y profundizar en ellas con los 5 porqués.</p>`; };
      render(); last='ish'; return;
    }
    if(v.mode==='par'){
      if(last!=='par'){ w.innerHTML='<div id="pt"></div>'; editTable($('#pt',root),'g31p',[{key:'c',label:'Causa',w:260},{key:'f',label:'Frecuencia',type:'num',step:1,w:80}],PA,()=>upd(ctl.v),{blank:()=>({c:'Nueva causa',f:1})}); }
      last='par';
      const s=PA.filter(r=>r.f>0).slice().sort((a,b)=>b.f-a.f), tot=s.reduce((a,r)=>a+r.f,0); let acc=0; const pc=s.map(r=>r.f/tot*100), cum=pc.map(x=>acc+=x);
      const vital=cum.findIndex(x=>x>=80)+1;
      P(root,'p1',{series:[...s.map((r,i)=>({x:[i+1],y:[pc[i]],bars:true,color:i<vital?'s2':'s6'})),{x:s.map((_,i)=>i+1),y:cum,color:'s1',label:'% acumulado'}],points:cum.map((c,i)=>({x:i+1,y:c,shape:'dot',color:'s1',size:3.5})),xcats:s.map(r=>r.c.length>14?r.c.slice(0,13)+'…':r.c),xlim:[0.4,s.length+0.6],ylim:[0,105],hlines:[{y:80,color:'s4',label:'80 %'}],ylabel:'%',legend:[{color:'s2',label:'pocos vitales (hasta 80 %)'},{color:'s6',label:'muchos triviales'}]});
      $('#kpis',root).innerHTML=kpi('Total de casos',fmt(tot,0))+kpi('Causas vitales',vital+' de '+s.length)+kpi('Explican',fmt(cum[vital-1],1)+' %')+kpi('Causa principal',esc(s[0]?.c||'—'));
      $('#calc',root).innerHTML=`<div class="tbl"><table><tr><th>Causa</th><th>f</th><th>%</th><th>% acumulado</th></tr>${s.map((r,i)=>`<tr><td>${esc(r.c)}</td><td class="mono">${r.f}</td><td class="mono">${fmt(r.f,0)}/${fmt(tot,0)} = ${fmt(pc[i],1)} %</td><td class="mono">${fmt(cum[i],1)} %</td></tr>`).join('')}</table></div>`;
      return;
    }
    last='ctl'; w.innerHTML='';
    const g=gaussGen(21), n=v.n, days=v.d, p0=v.p/100, p1=p0+v.sh/100; const t=[],ps=[];
    for(let i=1;i<=days;i++){ const pt=i>=v.cd?p1:p0; const d=Math.max(0,Math.round(n*pt+Math.sqrt(n*pt*(1-pt))*g())); t.push(i); ps.push(d/n); }
    const base=Math.max(5,Math.min(v.cd-1,days)), pb=ps.slice(0,base).reduce((a,b)=>a+b,0)/base, sg=Math.sqrt(pb*(1-pb)/n), U=pb+3*sg, L=Math.max(0,pb-3*sg);
    const out=ps.map((x,i)=>x>U||x<L); let run=0, runFlag=ps.map(()=>false); for(let i=0;i<days;i++){ run=ps[i]>pb?run+1:0; if(run>=7) for(let k=i-6;k<=i;k++) runFlag[k]=true; }
    P(root,'p1',{series:[{x:t,y:ps.map(x=>x*100),color:'s1',width:1.4,label:'proporción diaria'}],points:t.map((x,i)=>({x,y:ps[i]*100,shape:'dot',size:out[i]||runFlag[i]?5.5:3.5,color:out[i]?'s2':runFlag[i]?'s4':'s1'})),hlines:[{y:pb*100,color:'s3',label:'p̄'},{y:U*100,color:'s2',label:'LCS'},{y:L*100,color:'s2',label:'LCI'}],vlines:v.sh>0&&v.cd<=days?[{x:v.cd-0.5,color:'s6',label:'cambio'}]:[],xlabel:'día',ylabel:'% incompletas',yzero:true,legend:[{color:'s2',label:'fuera de límites'},{color:'s4',label:'racha de 7 sobre p̄'}]});
    const nout=out.filter(Boolean).length, first=out.findIndex(Boolean);
    $('#kpis',root).innerHTML=kpi('p̄ (línea central)',fmt(pb*100,2)+' %')+kpi('LCS / LCI',fmt(U*100,2)+' % / '+fmt(L*100,2)+' %')+kpi('Puntos fuera',String(nout))+kpi('Estado',nout||runFlag.some(Boolean)?pill('bad','fuera de control'):pill('ok','bajo control'));
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Línea central (con los primeros '+base+' días)',`p̄ = ${B(fmt(pb,4))}`)}
      ${step('2. Desviación estándar',`σ<sub>p</sub> = √(${fmt(pb,4)}·${fmt(1-pb,4)}/${n}) = ${B(fmt(sg,4))}`)}
      ${step('3. Límite superior',`${fmt(pb,4)} + 3·${fmt(sg,4)} = ${B(fmt(U,4))}`)}
      ${step('4. Límite inferior',`${fmt(pb,4)} − 3·${fmt(sg,4)} = ${fmt(pb-3*sg,4)} → ${B(fmt(L,4))}`)}
      ${step('5. Primera señal',first>=0?`día ${B(String(first+1))}`:'ninguna')}
    </div><p class="note">Los límites se calculan con el periodo estable (fase I) y luego se usan para vigilar. Si se recalculan incluyendo los días con la causa especial, los límites se ensanchan y la ocultan.</p>`;
  }
  ctl.fire();
}};

    if(last!=='pro'){ w.innerHTML='<div id="kt"></div>'; editTable($('#kt',root),'g32t',[{key:'a',label:'Actividad',w:200},{key:'t',label:'Tipo',type:'select',options:['Valor agregado','NVA necesaria','Desperdicio']},{key:'b',label:'Antes (min)',type:'num',w:70},{key:'d',label:'Después (min)',type:'num',w:70}],rows,()=>upd(ctl.v),{blank:()=>({a:'Nueva actividad',t:'Desperdicio',b:5,d:5})}); }

    const Tb=rows.reduce((a,r)=>a+r.b,0), Td=rows.reduce((a,r)=>a+r.d,0), VAb=rows.filter(r=>r.t==='Valor agregado').reduce((a,r)=>a+r.b,0), VAd=rows.filter(r=>r.t==='Valor agregado').reduce((a,r)=>a+r.d,0), Wb=rows.filter(r=>r.t==='Desperdicio').reduce((a,r)=>a+r.b,0), Wd=rows.filter(r=>r.t==='Desperdicio').reduce((a,r)=>a+r.d,0);
    const n=rows.length;
    P(root,'p1',{series:[{x:rows.map((_,i)=>i+1-0.18),y:rows.map(r=>r.b),bars:true,bw:0.34,color:'s6',label:'antes'},{x:rows.map((_,i)=>i+1+0.18),y:rows.map(r=>r.d),bars:true,bw:0.34,color:'s3',label:'después'}],xcats:rows.map(r=>r.a.length>14?r.a.slice(0,13)+'…':r.a),xlim:[0.4,n+0.6],ylabel:'minutos',yzero:true});
    const red=Tb?(Tb-Td)/Tb*100:0;
    $('#kpis',root).innerHTML=kpi('Tiempo total',fmt(Tb,0)+' → '+fmt(Td,0)+' min')+kpi('Reducción',fmt(red,1)+' %')+kpi('Valor agregado',fmt(Tb?VAb/Tb*100:0,0)+' % → '+fmt(Td?VAd/Td*100:0,0)+' %')+kpi('Desperdicio eliminado',fmt(Wb-Wd,0)+' min');
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Tiempo antes',`${rows.map(r=>fmt(r.b,0)).join(' + ')} = ${B(fmt(Tb,0)+' min')}`)}
      ${step('2. Tiempo después',`${rows.map(r=>fmt(r.d,0)).join(' + ')} = ${B(fmt(Td,0)+' min')}`)}
      ${step('3. Reducción',`${fr(fmt(Tb,0)+' − '+fmt(Td,0),fmt(Tb,0))}·100 = ${B(fmt(red,1)+' %')}`)}
      ${step('4. Proporción de valor agregado',`antes ${fr(fmt(VAb,0),fmt(Tb,0))} = ${B(fmt(Tb?VAb/Tb*100:0,1)+' %')} · después ${fr(fmt(VAd,0),fmt(Td,0))} = ${B(fmt(Td?VAd/Td*100:0,1)+' %')}`)}
      ${step('5. Otros indicadores del caso de clase',`errores 12 → 5: ${B('−58,3 %')} · reprocesos 15 → 6: ${B('−60 %')}`)}
    </div>`;
  }
  ctl.fire();
}};

MODS.m33={unit:3,code:'3.3',title:'Value Stream Mapping',nav:'Value Stream Mapping',
init(root){
  const R0=[{n:'Admisión',tc:8,w:20,r:2,va:false},{n:'Triage',tc:5,w:15,r:1,va:true},{n:'Valoración médica',tc:20,w:60,r:3,va:true},{n:'Laboratorio e imágenes',tc:45,w:90,r:2,va:true},{n:'Decisión de hospitalización',tc:10,w:30,r:2,va:true},{n:'Asignación de cama',tc:15,w:180,r:1,va:false}];
  root.innerHTML=layout({unit:3,code:'3.3',title:this.title,
    lead:'El mapa de flujo de valor (VSM) dibuja en una sola imagen todo el recorrido del paciente, con tiempos reales de cada paso y de las esperas entre pasos. Muestra cuánto del tiempo total agrega valor y dónde está el cuello de botella.',
    caso:'Ruta del paciente desde que llega a urgencias hasta que recibe cama en hospitalización (ejemplo de clase). Llegan 72 pacientes al día que terminan hospitalizados y el servicio funciona 24 horas. Cada paso tiene su tiempo de ciclo, la espera previa y el número de personas o equipos que atienden en paralelo. Todo se puede editar.',
    theory:`<p><b>Pasos para hacerlo:</b> 1) elegir la familia de pacientes (por ejemplo, urgencias que se hospitalizan); 2) caminar el proceso en el sitio (gemba) y tomar tiempos con cronómetro; 3) dibujar el estado actual; 4) calcular las métricas; 5) diseñar el estado futuro y un plan de acción.</p>
    <p><b>Métricas:</b> lead time (tiempo total), tiempo de valor agregado, eficiencia del ciclo (PCE) y takt time. Un paso cuyo tiempo de ciclo efectivo supera el takt no alcanza a atender la demanda: es el cuello de botella y ahí se forman las colas.</p>
    <p><b>Errores comunes:</b> mapear de memoria, usar tiempos estándar en lugar de reales, mapear todo el hospital a la vez y no involucrar a quienes hacen el trabajo.</p>`,
    formulas: eq('Takt = tiempo disponible/demanda')+eq('TC<sub>ef</sub> = TC/recursos')+eq('LT = Σ(TC + espera)')+eq('PCE = VA/LT · 100'),
    work:true,
    plots:[{id:'p1',cap:'Tiempo de ciclo efectivo vs. takt time'}],
    practiceTitle:'Casos y ejercicios',
    practice:[
      ['Caso para resolver: propone el estado futuro del ejemplo. ¿Qué cambiarías primero?','La espera de cama (180 min) es el mayor desperdicio y la asignación (TC efectivo 15 min con 1 persona) no es el cuello de botella por capacidad sino por información: se propone alta temprana antes de las 11 a. m., tablero visual de camas y aviso a admisiones desde la decisión médica. Luego atacar laboratorio (90 min de espera).'],
      ['Ejercicio: el servicio opera 1440 min y la demanda es 72 pacientes. ¿Cuál es el takt?','1440/72 = 20 min por paciente.'],
      ['Ejercicio: laboratorio tarda 45 min por paciente con 2 equipos. ¿Es cuello de botella con un takt de 20 min?','TC efectivo = 45/2 = 22,5 min > 20 min. Sí: necesita un tercer recurso o reducir el tiempo de ciclo.'],
      ['Ejercicio: LT = 498 min y VA = 80 min. ¿Cuál es la PCE?','80/498·100 = 16,1 %. El paciente pasa el 84 % del tiempo esperando.']]
  });
  const ctl=makeControls($('#ctl',root),'g33',[
    {id:'av',label:'Tiempo disponible por día',min:480,max:1440,step:60,value:1440,unit:'min',dec:0},
    {id:'dm',label:'Demanda',min:10,max:200,step:1,value:72,unit:'pac/día',dec:0}],upd);
  const rows=R0.map(x=>({...x}));
  $('#work',root).innerHTML='<div id="vt"></div><div id="vsm"></div>';
  editTable($('#vt',root),'g33t',[{key:'n',label:'Paso',w:180},{key:'tc',label:'TC (min)',type:'num',w:64},{key:'w',label:'Espera previa (min)',type:'num',w:64},{key:'r',label:'Recursos',type:'num',step:1,w:56},{key:'va',label:'¿Agrega valor?',type:'check'}],rows,()=>upd(ctl.v),{blank:()=>({n:'Nuevo paso',tc:10,w:10,r:1,va:true})});
  function upd(v){
    const takt=v.av/v.dm, eff=rows.map(r=>r.tc/Math.max(1,r.r)), LT=rows.reduce((a,r)=>a+r.tc+r.w,0), VA=rows.filter(r=>r.va).reduce((a,r)=>a+r.tc,0), W=rows.reduce((a,r)=>a+r.w,0);
    const bi=eff.indexOf(Math.max(...eff)), n=rows.length;
    P(root,'p1',{series:rows.map((r,i)=>({x:[i+1],y:[eff[i]],bars:true,color:eff[i]>takt?'s2':'s1'})),xcats:rows.map(r=>r.n.length>13?r.n.slice(0,12)+'…':r.n),xlim:[0.4,n+0.6],hlines:[{y:takt,color:'s4',label:'takt '+fmt(takt,1)+' min'}],ylabel:'min/paciente',yzero:true});
    $('#vsm',root).innerHTML=`<h4>Mapa del estado actual</h4><div class="vsm">${rows.map((r,i)=>`<div class="vw"><span class="tri">▲</span><small>${fmt(r.w,0)} min</small></div><div class="vb ${i===bi?'bn':''}"><b>${esc(r.n)}</b><small>TC ${fmt(r.tc,0)} min</small><small>${fmt(r.r,0)} recurso(s)</small>${r.va?'<small class="va">VA</small>':''}</div>`).join('')}</div>
      <div class="ladder"><span>Espera: ${fmt(W,0)} min</span><span>Proceso: ${fmt(LT-W,0)} min</span><span>Lead time: ${fmt(LT,0)} min (${fmt(LT/60,1)} h)</span></div>`;
    $('#kpis',root).innerHTML=kpi('Takt time',fmt(takt,1)+' min')+kpi('Lead time',fmt(LT,0)+' min ('+fmt(LT/60,1)+' h)')+kpi('PCE',fmt(VA/LT*100,1)+' %')+kpi('Cuello de botella',esc(rows[bi]?.n||'—')+' '+(eff[bi]>takt?pill('bad','> takt'):pill('ok','≤ takt')));
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Takt time',`${fr(fmt(v.av,0),fmt(v.dm,0))} = ${B(fmt(takt,2)+' min/paciente')}`)}
      ${step('2. Tiempos de ciclo efectivos',rows.map((r,i)=>`${esc(r.n)}: ${fmt(r.tc,0)}/${fmt(r.r,0)} = ${B(fmt(eff[i],1))}`).join('<br>'))}
      ${step('3. Lead time',`Σ TC + Σ espera = ${fmt(LT-W,0)} + ${fmt(W,0)} = ${B(fmt(LT,0)+' min')}`)}
      ${step('4. Tiempo de valor agregado',`${B(fmt(VA,0)+' min')}`)}
      ${step('5. Eficiencia del ciclo',`${fr(fmt(VA,0),fmt(LT,0))}·100 = ${B(fmt(VA/LT*100,1)+' %')}`)}
      ${step('6. Recursos para el cuello de botella',`⌈${fmt(rows[bi]?.tc||0,0)}/${fmt(takt,1)}⌉ = ${B(String(Math.ceil((rows[bi]?.tc||0)/takt)))}`)}
    </div>`;
  }
  ctl.fire();
}};

MODS.m41={unit:4,code:'4.1',title:'Proyecto y operación',nav:'Proyecto y operación',
init(root){
  const IT=[['Atender la consulta externa diaria','O'],['Implementar un software de historia clínica','P'],['Procesar muestras en el laboratorio','O'],['Construir una nueva UCI neonatal','P'],['Hacer el mantenimiento preventivo mensual','O','Es repetitivo: se planea cada año igual.'],['Obtener la acreditación en salud','P'],['Facturar los servicios a las EPS','O'],['Renovar los ventiladores de la UCI','P'],['Esterilizar el instrumental quirúrgico','O'],['Diseñar un programa de tecnovigilancia','P','Una vez diseñado e implementado, su ejecución pasa a ser operación.']];
  root.innerHTML=layout({unit:4,code:'4.1',title:this.title,
    lead:'La operación es el trabajo repetitivo que sostiene el servicio. Un proyecto es un esfuerzo temporal, con inicio y fin, para crear un resultado único. Las mejoras que salen de Kaizen o del VSM se ejecutan como proyectos.',
    caso:'El departamento de biomédica propone comprar e implementar un software de gestión de mantenimiento (CMMS). Cuesta una inversión inicial, genera ahorros por menos equipos fuera de servicio y menos horas administrativas, y tiene un costo anual de licencia. La gerencia pide el caso de negocio: VPN, TIR y periodo de recuperación.',
    theory:`<div class="tbl"><table><tr><th></th><th>Proyecto</th><th>Operación</th></tr><tr><td>Duración</td><td>temporal, con inicio y fin</td><td>continua</td></tr><tr><td>Resultado</td><td>único</td><td>repetitivo</td></tr><tr><td>Objetivo</td><td>cumplir el alcance y terminar</td><td>sostener el servicio</td></tr><tr><td>Equipo</td><td>temporal, a menudo matricial</td><td>estable</td></tr><tr><td>Ejemplo</td><td>instalar un tomógrafo</td><td>hacer tomografías</td></tr></table></div>
    <p><b>Restricción triple:</b> alcance, tiempo y costo están ligados; si uno cambia, los otros se mueven. La calidad queda en el centro.</p>
    <p><b>Caso de negocio:</b> antes de aprobar un proyecto se evalúa si vale la pena. Los criterios más usados son el valor presente neto (VPN), la tasa interna de retorno (TIR), el periodo de recuperación y la relación beneficio/costo.</p>`,
    formulas: eq('VPN = −I + Σ FN<sub>t</sub>/(1 + i)<sup>t</sup>')+eq('VPN(TIR) = 0')+eq('PRI: Σ FN<sub>t</sub> ≥ I')+eq('B/C = VP(beneficios)/VP(costos)'),
    work:true,
    plots:[{id:'p1',cap:'Flujo de caja acumulado (descontado)'}],
    practiceTitle:'Casos y ejercicios',
    practice:[
      ['Caso para resolver: redacta el acta de constitución resumida del proyecto CMMS.','Objetivo: implementar el CMMS para el 100 % de los equipos en 6 meses. Alcance: inventario, hojas de vida, cronograma, órdenes de trabajo e indicadores. Fuera de alcance: integración con facturación. Presupuesto: $ 120 M. Patrocinador: gerente. Director: jefe de biomédica. Riesgos: resistencia al cambio, datos incompletos del inventario.'],
      ['Ejercicio: inversión 100, flujo neto 40 por año durante 3 años, tasa 10 %. Calcula el VPN.','VPN = −100 + 40/1,1 + 40/1,21 + 40/1,331 = −100 + 36,36 + 33,06 + 30,05 = −0,53. Por muy poco no se recupera: se rechaza o se negocia el precio.'],
      ['Ejercicio: con los mismos datos, ¿cuál es el periodo de recuperación simple?','Acumulado: 40, 80, 120. Se recupera entre el año 2 y el 3: 2 + 20/40 = 2,5 años.'],
      ['Pregunta: ¿por qué la TIR del ejercicio anterior es un poco menos de 10 %?','Porque con i = 10 % el VPN es ligeramente negativo; la TIR es la tasa que lo hace exactamente cero, unos 9,7 %.']]
  });
  const ctl=makeControls($('#ctl',root),'g41',[
    {type:'seg',id:'mode',label:'Actividad',options:[['caso','Caso de negocio'],['cls','¿Proyecto u operación?']],value:'caso'},
    {id:'I',label:'Inversión inicial',min:10,max:500,step:5,value:120,unit:'$ M',dec:0,showIf:v=>v.mode==='caso'},
    {id:'A',label:'Ahorro anual',min:5,max:200,step:1,value:45,unit:'$ M',dec:0,showIf:v=>v.mode==='caso'},
    {id:'C',label:'Costo anual (licencias, soporte)',min:0,max:60,step:1,value:8,unit:'$ M',dec:0,showIf:v=>v.mode==='caso'},
    {id:'n',label:'Horizonte',min:1,max:10,step:1,value:5,unit:'años',dec:0,showIf:v=>v.mode==='caso'},
    {id:'i',label:'Tasa de descuento',min:4,max:25,step:0.5,value:12,unit:'%',dec:1,showIf:v=>v.mode==='caso'}],upd);
  let last='';
  function upd(v){
    const w=$('#work',root); show(root,'p1',v.mode==='caso');
    if(v.mode==='cls'){ if(last!=='cls'){ w.innerHTML='<h4 style="margin-top:0">Clasifica cada actividad de un hospital</h4><div id="cl"></div>'; classifier($('#cl',root),'g41c',IT,[['P','Proyecto'],['O','Operación']]); } last='cls'; $('#kpis',root).innerHTML=''; $('#calc',root).innerHTML='<p class="note">Pregunta guía: ¿tiene una fecha de fin y produce algo que antes no existía?</p>'; return; }
    last='caso'; w.innerHTML='';
    const i=v.i/100, FN=v.A-v.C; const npv=r=>{ let s=-v.I; for(let t=1;t<=v.n;t++) s+=FN/Math.pow(1+r,t); return s; };
    const VPN=npv(i); let lo=-0.99,hi=10,irr=NaN; if(npv(lo)*npv(hi)<0){ for(let k=0;k<200;k++){ const m=(lo+hi)/2; if(npv(lo)*npv(m)<=0) hi=m; else lo=m; } irr=(lo+hi)/2; }
    let acc=-v.I, accD=-v.I, pri=NaN, priD=NaN; const t=[0],cs=[-v.I],cd=[-v.I];
    for(let k=1;k<=v.n;k++){ const pa=acc; acc+=FN; const pd=accD; accD+=FN/Math.pow(1+i,k); if(isNaN(pri)&&acc>=0) pri=k-1+(-pa)/FN; if(isNaN(priD)&&accD>=0) priD=k-1+(-pd)/(FN/Math.pow(1+i,k)); t.push(k); cs.push(acc); cd.push(accD); }
    let vpA=0,vpC=0; for(let k=1;k<=v.n;k++){ vpA+=v.A/Math.pow(1+i,k); vpC+=v.C/Math.pow(1+i,k); } const BC=vpA/(v.I+vpC);
    P(root,'p1',{series:[{x:t,y:cs,color:'s6',dash:[6,4],label:'acumulado simple'},{x:t,y:cd,color:'s1',label:'acumulado descontado'}],points:t.map((x,k)=>({x,y:cd[k],shape:'dot',color:cd[k]>=0?'s3':'s2',size:4})),axes0:true,xlabel:'año',ylabel:'$ M'});
    $('#kpis',root).innerHTML=kpi('VPN',money(VPN)+' '+(VPN>=0?pill('ok','aceptar'):pill('bad','rechazar')))+kpi('TIR',isNaN(irr)?'—':fmt(irr*100,1)+' %')+kpi('Recuperación',isNaN(pri)?'no se recupera':fmt(pri,2)+' años (desc. '+(isNaN(priD)?'no':fmt(priD,2))+')')+kpi('B/C',fmt(BC,2));
    $('#calc',root).innerHTML=`<div class="steps">
      ${step('1. Flujo neto anual',`FN = ${fmt(v.A,0)} − ${fmt(v.C,0)} = ${B(money(FN))}`)}
      ${step('2. Valor presente de los flujos',`Σ ${fr(fmt(FN,0),'(1 + '+fmt(i,3)+')<sup>t</sup>')}, t = 1…${v.n} = ${B(money(VPN+v.I))}`)}
      ${step('3. VPN',`−${fmt(v.I,0)} + ${fmt(VPN+v.I,2)} = ${B(money(VPN))}`)}
      ${step('4. TIR (VPN = 0)',B(isNaN(irr)?'no existe en el rango':fmt(irr*100,2)+' %')+` frente a ${fmt(v.i,1)} % exigido`)}
      ${step('5. Periodo de recuperación simple',isNaN(pri)?'no se recupera':`${B(fmt(pri,2)+' años')}`)}
      ${step('6. Beneficio/costo',`${fr(fmt(vpA,1),fmt(v.I,0)+' + '+fmt(vpC,1))} = ${B(fmt(BC,3))}`)}
    </div><div class="tbl" style="margin-top:10px"><table><tr><th>Año</th><th>Flujo</th><th>Factor 1/(1+i)<sup>t</sup></th><th>Valor presente</th><th>Acumulado descontado</th></tr>${t.map((k,j)=>`<tr><td class="mono">${k}</td><td class="mono">${k?fmt(FN,1):fmt(-v.I,1)}</td><td class="mono">${fmt(1/Math.pow(1+i,k),4)}</td><td class="mono">${fmt(k?FN/Math.pow(1+i,k):-v.I,2)}</td><td class="mono">${fmt(cd[j],2)}</td></tr>`).join('')}</table></div>`;
  }
  ctl.fire();
}};

MODS.m42={unit:4,code:'4.2',title:'Ciclo de vida de un proyecto',nav:'Ciclo de vida del proyecto',

      ['Ejercicio: actividad con ES = 4, d = 3 y LF = 10. ¿Cuál es su holgura?','EF = 7, LS = 10 − 3 = 7. Holgura = 7 − 4 = 3 semanas.'],
      ['Ejercicio: BAC = 400, PV = 200, EV = 160, AC = 190. Interpreta.','SPI = 0,80 (atrasado 20 %). CPI = 0,84 (sobrecosto). EAC = 400/0,84 = 475: costará unos 75 M más si sigue igual.'],
      ['Pregunta: ¿qué documentos se generan en el cierre?','Acta de entrega y recibo a satisfacción, informe final, liberación de recursos, archivo del proyecto y lecciones aprendidas.']]
  });
  const ctl=makeControls($('#ctl',root),'g42',[
    {type:'seg',id:'mode',label:'Herramienta',options:[['cpm','Ruta crítica'],['evm','Valor ganado']],value:'cpm'},
    {id:'bac',label:'Presupuesto total BAC',min:50,max:1000,step:10,value:400,unit:'$ M',dec:0,showIf:v=>v.mode==='evm'},

    {id:'pr',label:'Avance real a la fecha',min:0,max:100,step:1,value:40,unit:'%',dec:0,showIf:v=>v.mode==='evm'},
    {id:'ac',label:'Costo real gastado AC',min:0,max:1000,step:5,value:190,unit:'$ M',dec:0,showIf:v=>v.mode==='evm'}],upd);
  const rows=A0.map(x=>({...x})); let last='';
  function cpm(){
    const map={}, errs=[]; rows.forEach(r=>{ const k=String(r.id).trim(); if(map[k]) errs.push('id repetido: '+k); map[k]=r; r._p=String(r.p||'').split(/[,; ]+/).map(s=>s.trim()).filter(Boolean); });
    rows.forEach(r=>r._p.forEach(p=>{ if(!map[p]) errs.push(`“${r.id}” tiene una predecesora que no existe: ${p}`); }));
    if(errs.length) return {errs};
    const order=[], st={}; let cyc=false; const visit=k=>{ if(st[k]===2) return; if(st[k]===1){ cyc=true; return; } st[k]=1; map[k]._p.forEach(visit); st[k]=2; order.push(k); };
    Object.keys(map).forEach(visit); if(cyc) return {errs:['hay un ciclo entre las predecesoras']};
    order.forEach(k=>{ const r=map[k]; r.ES=r._p.length?Math.max(...r._p.map(p=>map[p].EF)):0; r.EF=r.ES+Math.max(0,r.d); });
    const T=Math.max(...rows.map(r=>r.EF));
    [...order].reverse().forEach(k=>{ const r=map[k]; const suc=rows.filter(s=>s._p.includes(k)); r.LF=suc.length?Math.min(...suc.map(s=>s.LS)):T; r.LS=r.LF-Math.max(0,r.d); r.H=r.LS-r.ES; });
    return {T,order};
  }
  function upd(v){

      P(root,'p1',{series:[{x:[1],y:[PV],bars:true,color:'s6'},{x:[2],y:[EV],bars:true,color:'s3'},{x:[3],y:[AC],bars:true,color:'s2'},{x:[4],y:[EAC],bars:true,color:'s4'}],xcats:['PV planeado','EV ganado','AC real','EAC pronóstico'],xlim:[0.4,4.6],hlines:[{y:v.bac,color:'s1',label:'BAC'}],ylabel:'$ M',yzero:true});
      const s=x=>x>=1?pill('ok','bien'):x>=0.9?pill('warn','alerta'):pill('bad','mal');
      $('#kpis',root).innerHTML=kpi('SPI (cronograma)',fmt(SPI,3)+' '+s(SPI))+kpi('CPI (costo)',fmt(CPI,3)+' '+s(CPI))+kpi('EAC',money(EAC))+kpi('VAC',money(VAC));
      $('#calc',root).innerHTML=`<div class="steps">
        ${step('1. Valor planeado',`PV = ${fmt(v.bac,0)}·${fmt(v.pp/100,2)} = ${B(money(PV))}`)}
        ${step('2. Valor ganado',`EV = ${fmt(v.bac,0)}·${fmt(v.pr/100,2)} = ${B(money(EV))}`)}
        ${step('3. Variaciones',`SV = EV − PV = ${B(money(SV))} &nbsp; CV = EV − AC = ${B(money(CV))}`)}
        ${step('4. Índices',`SPI = ${fr(fmt(EV,1),fmt(PV,1))} = ${B(fmt(SPI,3))} &nbsp; CPI = ${fr(fmt(EV,1),fmt(AC,1))} = ${B(fmt(CPI,3))}`)}
        ${step('5. Pronóstico',`EAC = ${fr(fmt(v.bac,0),fmt(CPI,3))} = ${B(money(EAC))} &nbsp; ETC = ${B(money(ETC))}`)}
        ${step('6. Eficiencia que se necesita de aquí en adelante',`TCPI = ${fr(fmt(v.bac,0)+' − '+fmt(EV,1),fmt(v.bac,0)+' − '+fmt(AC,1))} = ${B(fmt(TCPI,3))}`)}
      </div>`; return; }
    if(last!=='cpm'){ w.innerHTML='<div id="ct"></div><div id="gantt"></div>'; editTable($('#ct',root),'g42t',[{key:'id',label:'ID',w:40},{key:'n',label:'Actividad',w:250},{key:'d',label:'Duración (sem)',type:'num',w:60},{key:'p',label:'Predecesoras',w:80}],rows,()=>upd(ctl.v),{blank:()=>({id:String.fromCharCode(65+rows.length),n:'Nueva actividad',d:1,p:''})}); }
    last='cpm';
    const r=cpm();
    if(r.errs){ $('#gantt',root).innerHTML=`<p class="note alert">${r.errs.join('. ')}</p>`; $('#kpis',root).innerHTML=''; $('#calc',root).innerHTML=''; return; }
    const crit=rows.filter(x=>x.H===0), T=r.T;
    $('#gantt',root).innerHTML=`<h4>Diagrama de Gantt</h4><div class="gantt">${rows.map(x=>`<div class="gr"><span>${esc(x.id)} · ${esc(x.n)}</span><div class="gb"><i class="${x.H===0?'cr':''}" style="left:${x.ES/T*100}%;width:${Math.max(0.5,x.d/T*100)}%"></i>${x.H>0?`<i class="sl" style="left:${x.EF/T*100}%;width:${x.H/T*100}%"></i>`:''}</div></div>`).join('')}<div class="gr"><span></span><div class="gax">${Array.from({length:Math.floor(T)+1},(_,k)=>k%Math.max(1,Math.ceil(T/12))===0?`<b style="left:${k/T*100}%">${k}</b>`:'').join('')}</div></div></div>`;
    $('#kpis',root).innerHTML=kpi('Duración del proyecto',fmt(T,1)+' semanas')+kpi('Ruta crítica',crit.map(x=>x.id).join(' → '))+kpi('Actividades críticas',crit.length+' de '+rows.length)+kpi('Mayor holgura',fmt(Math.max(...rows.map(x=>x.H)),1)+' sem');
    $('#calc',root).innerHTML=`<div class="tbl"><table><tr><th>ID</th><th>d</th><th>ES</th><th>EF = ES + d</th><th>LS = LF − d</th><th>LF</th><th>Holgura</th></tr>${rows.map(x=>`<tr${x.H===0?' style="font-weight:600"':''}><td>${esc(x.id)}</td><td class="mono">${fmt(x.d,1)}</td><td class="mono">${fmt(x.ES,1)}</td><td class="mono">${fmt(x.EF,1)}</td><td class="mono">${fmt(x.LS,1)}</td><td class="mono">${fmt(x.LF,1)}</td><td class="mono">${fmt(x.H,1)}${x.H===0?' (crítica)':''}</td></tr>`).join('')}</table></div><p class="note">ES de una actividad es el mayor EF de sus predecesoras. LF es el menor LS de sus sucesoras. Holgura = LS − ES.</p>`;
  }

}};

MODS.m43={unit:4,code:'4.3',title:'Modelo Lean Six Sigma aplicado al sector salud',nav:'Lean Six Sigma',

    plots:[{id:'p1',cap:'Resultado'}],

      ['Ejercicio: 38 errores en 2400 órdenes con 3 oportunidades. Calcula DPMO y nivel sigma.','DPMO = 38/(2400·3)·10⁶ = 5278. Y = 0,99472 → Φ⁻¹ = 2,56 → nivel ≈ 4,06 σ.'],

  });
  const ctl=makeControls($('#ctl',root),'g43',[

    {id:'U',label:'Órdenes revisadas U',min:100,max:20000,step:100,value:2400,dec:0,showIf:v=>v.mode==='dp'},
    {id:'O',label:'Oportunidades por orden O',min:1,max:10,step:1,value:3,dec:0,showIf:v=>v.mode==='dp'},

    {id:'sd',label:'Desviación estándar σ',min:1,max:20,step:0.5,value:8,unit:'min',dec:1,showIf:v=>v.mode==='cp'},

  function upd(v){

  ${blk('Unidad 1 · Gestión de calidad',[eq('CTC = C<sub>p</sub> + C<sub>e</sub> + C<sub>fi</sub> + C<sub>fe</sub>'),eq('%CNC = (C<sub>fi</sub> + C<sub>fe</sub>)/CTC·100'),eq('Eficacia = R/M·100'),eq('Eficiencia = (R/R<sub>u</sub>)/(M/R<sub>p</sub>)·100'),eq('Efectividad = (Eficacia + Eficiencia)/2'),eq('Cumplimiento = Σ puntos/(2·n)·100','autodiagnóstico ISO'),'<a href="#m11">Ir a la unidad 1 →</a>'])}
  ${blk('Unidad 2 · Gerencia estratégica',[eq('MEFI, MEFE = Σ w<sub>i</sub>·c<sub>i</sub>, Σ w<sub>i</sub> = 1'),eq('Técnicos = ⌈H<sub>tot</sub>/H<sub>prod</sub>⌉'),eq('A = λ/μ · ρ = A/c'),eq('W<sub>q</sub> = C(c,A)/(cμ − λ)'),eq('L = λ·W','Little'),'<a href="#m21">Ir a la unidad 2 →</a>'])}
  ${blk('Unidad 3 · Mejora continua',[eq('%<sub>i</sub> = f<sub>i</sub>/Σf·100','Pareto'),eq('LC = p̄ ± 3√(p̄(1 − p̄)/n)','gráfica p'),eq('Reducción = (T<sub>a</sub> − T<sub>d</sub>)/T<sub>a</sub>·100'),eq('Takt = disponible/demanda'),eq('LT = Σ(TC + espera) · PCE = VA/LT·100'),'<a href="#m31">Ir a la unidad 3 →</a>'])}
  ${blk('Unidad 4 · Proyectos y Lean Six Sigma',[eq('VPN = −I + Σ FN<sub>t</sub>/(1+i)<sup>t</sup>'),eq('H = LS − ES','holgura'),eq('SPI = EV/PV · CPI = EV/AC · EAC = BAC/CPI'),eq('DPMO = D/(U·O)·10⁶'),eq('σ = Φ⁻¹(1 − DPMO/10⁶) + 1,5'),eq('C<sub>pk</sub> = mín((LSE − μ)/3σ, (μ − LIE)/3σ)'),'<a href="#m41">Ir a la unidad 4 →</a>'])}
  </div></article>`;
}

/* =============== navegación =============== */
const ORDER=['inicio',...UNITS.flatMap(u=>u.mods),'formulario'];
function buildNav(){
  $('#side').innerHTML=`<a class="home" href="#inicio" data-id="inicio">Inicio</a>`+UNITS.map(u=>`<h3><i>U${u.n}</i>${u.title}</h3>`+u.mods.map(id=>`<a class="it" href="#${id}" data-id="${id}"><span>${MODS[id].code}</span><span>${MODS[id].nav}</span></a>`).join('')).join('')+`<h3>Repaso</h3><a class="it" href="#formulario" data-id="formulario"><span>Σ</span><span>Formulario completo</span></a>`;
  const sel=$('#navsel'); sel.innerHTML=`<option value="inicio">Inicio</option>`+UNITS.map(u=>`<optgroup label="Unidad ${u.n}">${u.mods.map(id=>`<option value="${id}">${MODS[id].code} ${MODS[id].nav}</option>`).join('')}</optgroup>`).join('')+`<option value="formulario">Formulario completo</option>`;
  sel.onchange=()=>{ location.hash=sel.value; };
}
function route(){
  let id=(location.hash||'').slice(1); if(!ORDER.includes(id)) id='inicio';
  const main=$('#main'); main.innerHTML='';
  if(id==='inicio') home(main); else if(id==='formulario') formulario(main); else MODS[id].init(main);
  document.querySelectorAll('.side a').forEach(a=>{ if(a.dataset.id===id) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#navsel').value=id; window.scrollTo(0,0);
}
buildNav(); window.addEventListener('hashchange',route); route();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(redrawAll);
</script>
